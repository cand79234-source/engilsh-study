<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>English OS</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --border:#e8ecf4; --text:#1e293b; --muted:#7c8698;
  --primary:#4f46e5; --primary2:#6366f1; --primary-bg:#eef2ff;
  --green:#16a34a; --green-bg:#f0fdf4; --red:#dc2626; --amber:#d97706;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
h1{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}

/* 顶部 */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50}
.brand{font-weight:800;font-size:17px;color:var(--primary)}
.prog-pill{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.prog-pill:active{opacity:.7}

/* 内容 */
.content{padding:66px 14px calc(var(--nav-h) + 24px);max-width:620px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.badge{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}

/* 按钮 */
.btn{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.green{background:var(--green)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1;text-align:center;min-width:100px}

/* 进度 */
.progressbar{height:9px;background:var(--border);border-radius:20px;overflow:hidden;margin:8px 0 4px}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px;transition:.3s}
.metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.metric b{color:var(--text)}

/* 词汇 */
.word{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--border);
  border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.word:active{background:var(--primary-bg)}
.word .en{font-weight:700;font-size:15px}
.word .cn{color:var(--muted);font-size:12.5px}
.word.done{background:var(--green-bg);border-color:#bbf7d0}
.word.done .en{color:var(--green)}
.word.open{border-color:var(--primary);background:var(--primary-bg)}
.detail{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:13px;margin:-2px 0 10px;font-size:14px}
.detail .row{margin:4px 0}
.detail .lbl{color:var(--muted);font-size:12px}
.colloc{background:#e0e7ff;color:var(--primary);border-radius:6px;padding:2px 8px;font-size:12.5px;display:inline-block;margin:2px 4px 2px 0}
.tran{color:var(--green);font-size:12.5px;margin-top:3px}

/* 造句 */
.sinput{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;margin-top:6px}
.sinput:focus{outline:none;border-color:var(--primary)}
.sitem{margin-bottom:15px}
.sq{font-size:13.5px;font-weight:600;margin:6px 0 2px}
.res{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:11px;margin-top:8px;font-size:13.5px}
.res.good{background:var(--green-bg);border-color:#bbf7d0}
.errtype{display:inline-block;background:#fee2e2;color:var(--red);border-radius:7px;padding:1px 9px;font-size:12px;margin-top:7px;font-weight:600}

/* 复习 */
.rev{padding:12px 0}
.rev .prompt{font-size:15px;font-weight:600;margin-bottom:9px;line-height:1.5}
.revb{display:flex;gap:9px;margin-top:9px}
.revb .btn{flex:1}
.ansbox{color:var(--muted);font-size:13px;margin-top:8px}
.optb{border:1.5px solid var(--border);background:#fff;padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;margin:0 5px 6px 0;min-width:56px}
.optb:active{opacity:.8}

/* 设置 */
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{font-family:monospace;font-size:13px;min-height:110px;line-height:1.6}
.stepper{display:flex;align-items:center;gap:7px}
.stepper button{width:42px;height:42px;flex-shrink:0;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:10px;font-size:20px;cursor:pointer}
.stepper input{text-align:center}
.tagline{font-size:12.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:9px;padding:8px 11px;margin:6px 0}

/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;cursor:pointer}
.bottomnav a .ico{font-size:22px;line-height:1}
.bottomnav a.active{color:var(--primary)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">English OS</div>
  <button class="prog-pill" id="topProg" onclick="go('settings')">阶段0 · W3 · D1</button>
</div>
<main class="content" id="content"></main>
<div class="bottomnav">
  <a data-page="learn" class="active"><span class="ico">📖</span><span>学习</span></a>
  <a data-page="review"><span class="ico">🔁</span><span>复习</span></a>
  <a data-page="settings"><span class="ico">⚙️</span><span>设置</span></a>
</div>
<script>
const api=(p,opt)=>fetch('/api'+p,opt).then(r=>r.json());
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.createElement('div');t.textContent=m;
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.25s';
  document.body.appendChild(t);requestAnimationFrame(()=>t.style.opacity=1);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),250);},2000);}
const state={}; const pages={};
document.querySelectorAll('.bottomnav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.bottomnav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active'); render(a.dataset.page); window.scrollTo(0,0);});
async function refreshProg(){try{const p=await api('/progress');
  document.getElementById('topProg').textContent=`阶段${p.stage} · W${p.week} · D${p.day}`;}catch(e){}}
function go(page){document.querySelectorAll('.bottomnav a').forEach(x=>x.classList.remove('active'));
  document.querySelector(`.bottomnav a[data-page=${page}]`).classList.add('active');render(page);window.scrollTo(0,0);}

/* ============ 学习页：今天学什么 + 本周词 + 造句 + 周测 ============ */
pages.learn=async function(el){
  const [d,t] = await Promise.all([api('/home'), api('/today')]);
  state.learn={d,t}; state.today=t;
  const p=d.progress;
  const vp=Math.round(d.today.vocab_done/d.today.vocab_total*100);
  const sp=Math.min(d.today.sentence_done,10);
  document.getElementById('topProg').textContent=`阶段${p.stage} · W${p.week} · D${p.day}`;
  el.innerHTML=`
  <div class="card" style="border:1.5px solid var(--primary)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>今日 · Week${p.week}「${d.week_title}」</h2>
      <span class="badge">${d.week_vocab_count}词/周</span>
    </div>
    <div class="sub" style="margin-top:2px">语法重点：${d.week_grammar||'（未设置）'}　·　Day ${p.day}</div>
    <div class="metric"><span>今日词汇</span><b>${d.today.vocab_done}/${d.today.vocab_total}</b></div>
    <div class="progressbar"><div style="width:${vp}%"></div></div>
    <div class="metric"><span>今日造句</span><b>${sp}/10</b></div>
    <div class="progressbar"><div style="width:${sp*10}%"></div></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>📖 本周词汇</h2>
      <button class="btn ghost sm" onclick="showWordImport()">✏️ 换本周词</button>
    </div>
    <div class="sub" style="margin-top:2px">点击单词展开 → 记住后点「记住了」</div>
    <div id="wordlist">${renderWords(t.words)}</div>
    <div style="display:none" id="wordimport"></div>
  </div>

  <div class="card">
    <h2>✍️ 造句 10 句</h2>
    <div class="sub" style="margin-top:2px">写关于你自己的句子 · 保存后有批改</div>
    <div id="sentences"></div>
  </div>

  <div class="card" style="background:${d.is_sunday?'var(--amber)':'var(--card)'}${d.is_sunday?';color:#fff':''}">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="${d.is_sunday?'color:#fff':''}">📝 本周周测</h2>
      ${d.is_sunday?'<span style="font-size:12px;background:rgba(255,255,255,.3);padding:3px 10px;border-radius:12px">周日测试日</span>':''}
    </div>
    <div class="sub" style="margin-top:2px;${d.is_sunday?'color:#fff':''}">测试本周语法与词汇，≥75% 进入下一周</div>
    <div class="btnrow"><button class="btn ${d.is_sunday?'ghost':''}" style="${d.is_sunday?'border-color:#fff;color:#fff':'border:0'}" onclick="renderQuiz()">开始本周测试</button></div>
    <div id="quizarea"></div>
  </div>`;
  renderSentences();
};

function renderWords(words){
  if(!words||words.length===0) return '<div class="sub" style="margin:4px 0">本周还没有词，点「换本周词」粘贴你要学的英文单词。</div>';
  const open=state.openWord;
  return words.map(w=>{
    const isOpen=open===w.word;
    const done=w.mastered>0;
    return `<div>
      <div class="word ${done?'done':''} ${isOpen?'open':''}" onclick="toggleW('${esc(w.word)}')">
        <div><div class="en">${esc(w.word)}</div><div class="cn">${esc(w.meaning)||''}</div></div>
        <div style="display:flex;align-items:center;gap:6px"><span class="badge" style="${done?'background:#dcfce7;color:var(--green)':''}">${esc(w.pos)||''}</span>${done?'✅':''}</div>
      </div>
      ${isOpen?`<div class="detail">
        <div class="row"><b>${esc(w.word)}</b> ${w.pos?`<span style="color:var(--muted)">· ${esc(w.pos)}</span>`:''} <span style="color:var(--muted)">/${esc(w.meaning)}/</span></div>
        ${w.collocation?`<div class="row"><span class="lbl">搭配</span><div><span class="colloc">${esc(w.collocation)}</span></div></div>`:''}
        ${w.example?`<div class="row"><span class="lbl">例句</span>${esc(w.example)}</div>`:''}
        ${w.translation?`<div class="tran">${esc(w.translation)}</div>`:''}
        <div class="btnrow"><button class="btn green" onclick="master('${esc(w.word)}')">我记住了 ✅</button></div>
      </div>`:''}
    </div>`;
  }).join('');
}
async function toggleW(word){state.openWord=(state.openWord===word)?null:word;renderWordsInto();}
function renderWordsInto(){const t=state.today;document.getElementById('wordlist').innerHTML=renderWords(t.words);}
async function master(word){
  const w=state.today.words.find(x=>x.word===word); if(!w)return;
  await api('/word/master',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word,mastered:2,meaning:w.meaning,collocation:w.collocation})});
  toast(`已掌握「${word}」`); refreshProg(); pages.learn(document.getElementById('content'));
}
async function showWordImport(){
  const box=document.getElementById('wordimport');
  if(box.style.display==='block'){box.style.display='none';return;}
  box.style.display='block';
  const p=state.learn.d.progress;
  box.innerHTML=`
    <div class="tagline">粘贴你要学的英文单词（逗号 / 空格 / 换行分隔均可）。系统自动补中文、词性、例句、搭配。</div>
    <textarea id="imp_words" placeholder="例如：hobby travel movie music cooking"></textarea>
    <div class="btnrow">
      <button class="btn" onclick="saveWords(${p.stage},${p.week})">💾 设为本周词汇</button>
    </div>
    <div id="imp_result"></div>`;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function saveWords(stage,week){
  const raw=document.getElementById('imp_words').value;
  if(!raw.trim()){toast('请先粘贴英文单词');return;}
  const r=await api('/words/set',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({words:raw,stage,week})});
  const box=document.getElementById('imp_result');
  let msg=`✅ 已匹配 ${r.matched} 个词并设为本周内容。`;
  if(r.unmatched&&r.unmatched.length) msg+=`<br>未收录(忽略)：${esc(r.unmatched.join(', '))}`;
  box.innerHTML=`<div class="res good">${msg}</div>`;
  toast(`已设置本周 ${r.matched} 个词`);
  setTimeout(()=>pages.learn(document.getElementById('content')),800);
}

/* ---- 造句 ---- */
async function renderSentences(){
  const prompts=(state.today.sentence_prompts||[]).slice(0,10);
  document.getElementById('sentences').innerHTML=prompts.map((p,i)=>`
    <div class="sitem">
      <div class="sq">${i+1}. ${esc(p)}</div>
      <input class="sinput" id="sin_${i}" placeholder="写一个英文句子…" style="${(state.ssent&&state.ssent[i])?'border-color:var(--green)':''}">
      <div class="btnrow"><button class="btn ghost sm" onclick="check(${i})">✍️ 批改</button></div>
      <div id="sres_${i}"></div>
    </div>`).join('');
  state.sentencesCount=prompts.length;
}
async function check(i){
  const v=document.getElementById('sin_'+i).value.trim();
  if(!v){toast('先写一个句子');return;}
  const r=await api('/sentence/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sentence:v})});
  const b=document.getElementById('sres_'+i);
  if(r.good){b.innerHTML=`<div class="res good">✅ 很好！<br><b>${esc(r.corrected)}</b></div>`;}
  else{b.innerHTML=`<div class="res">
      <div style="color:#475569">你写的：${esc(r.original)}</div>
      <div style="margin-top:3px">建议：<b style="color:var(--green)">${esc(r.corrected)}</b></div>
      ${r.error_type?`<span class="errtype">${esc(r.error_type)}</span>`:''}
      ${r.explanation?`<div class="sub" style="margin-top:6px">${esc(r.explanation)}</div>`:''}
    </div>`;}
  state.ssent=state.ssent||{};state.ssent[i]=1;
}

/* ============ 复习页 ============ */
pages.review=async function(el){
  const d=await api('/review/due');
  const items=d.items; state.reviewItems=items;
  document.getElementById('topProg').textContent=`复习 · ${items.length}`;
  el.innerHTML=`
    <h1>🔁 复习</h1>
    <div class="sub">主动回忆：看提示 → 自己造句 → 判定对错</div>
    ${items.length===0?`<div class="card"><div class="sub" style="margin:0">✅ 今日复习全部完成，明天自动加入新内容。</div></div>`
      :items.map((r,i)=>`
      <div class="card">
        <div class="rev" id="revc_${i}">
          <div style="margin-bottom:6px">
            <span class="badge">${kindL(r.kind)}</span>
            <span class="badge" style="background:#f8fafc;color:var(--muted)">间隔${r.interval}天</span>
          </div>
          <div class="prompt">${r.kind==='vocab'?`请用「<b>${esc(r.ref_key)}</b>」写一句关于你的话`:(r.kind==='error'?esc(r.prompt):esc(r.prompt||r.ref_key))}</div>
          <input class="sinput" id="ri_${i}" placeholder="在这里写你的句子…">
          <div class="revb">
            <button class="btn green" onclick="submit(${i},${r.id},true)">✅ 写对了</button>
            <button class="btn" style="background:var(--red)" onclick="submit(${i},${r.id},false)">❌ 错了</button>
          </div>
          <div class="ansbox" id="ra_${i}"><button class="btn ghost sm" onclick="seeAns(${i})">查看参考</button></div>
        </div>
      </div>`).join('')}`;
};
function kindL(k){return {vocab:'词汇',collocation:'搭配',sentence:'句子',grammar:'语法',error:'高频错误'}[k]||k;}
function seeAns(i){const r=state.reviewItems[i];
  document.getElementById('ra_'+i).innerHTML=`参考：${esc(r.answer||r.ref_key)}`;}
async function submit(i,id,ok){
  await api('/review/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,correct:ok})});
  const box=document.getElementById('revc_'+i);
  box.innerHTML=`<div style="padding:8px 0;font-weight:700;color:${ok?'var(--green)':'var(--red)'}">${ok?'✅ 已记录，下次间隔拉长':'已记录，将提前复习'}</div>`;
  refreshProg();
  setTimeout(()=>pages.review(document.getElementById('content')),900);
}

/* ============ 周测（学习页内嵌）============ */
async function renderQuiz(){
  const d=state.learn.d; const p=d.progress;
  const box=document.getElementById('quizarea');
  if(state.quizShowing){box.innerHTML='';state.quizShowing=false;return;}
  const quiz=await api(`/quiz/${p.stage}/${p.week}`);
  state.quiz={quiz,p,answers:{}};
  box.innerHTML=`
    <div style="margin-top:12px"><b>语法测试（${quiz.questions.length} 题）</b></div>
    ${quiz.questions.map(q=>`<div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="font-size:14px;font-weight:600;margin-bottom:7px">${q.id}. ${esc(q.question)}</div>
      <div>${q.options.map((o,oi)=>`<button class="optb" id="q${q.id}_${oi}" style="${state.quiz.answers[q.id]===oi?'background:var(--primary);color:#fff;border-color:var(--primary)':''}"
        onclick="pick(${q.id},${oi})">${esc(o)}</button>`).join('')}</div>
      <div class="sub" style="margin:5px 0 0">考点：${esc(q.tag)}</div>
    </div>`).join('')}
    <div class="btnrow"><button class="btn" onclick="grade()">提交周测</button></div>
    <div id="quizres"></div>`;
  state.quizShowing=true;box.scrollIntoView({behavior:'smooth'});
}
function pick(qid,oi){state.quiz.answers[qid]=oi;document.querySelectorAll(`[id^=q${qid}_]`).forEach(b=>{b.style.background='';b.style.color='';b.style.borderColor='';});
  const b=document.getElementById(`q${qid}_${oi}`);b.style.background='var(--primary)';b.style.color='#fff';b.style.borderColor='var(--primary)';}
async function grade(){
  const r=await api('/quiz/grade',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stage:state.quiz.p.stage,week:state.quiz.p.week,answers:state.quiz.answers})});
  document.getElementById('quizres').innerHTML=`
    <div class="res ${r.passed?'good':''}">
      <div style="font-size:19px;font-weight:800">${r.correct}/${r.total} · ${r.pct}% ${r.passed?'✅ 通过':'❌ 未通过'}</div>
      <div class="sub" style="margin-top:6px">${r.passed?'可以进入下一周继续学习。':'未达 75%，先复习本周内容再测。'}</div>
      ${r.detail.filter(x=>!x.ok).slice(0,4).map(x=>`<div style="color:var(--red);font-size:13px;margin-top:4px">✗ ${esc(x.question)} → ${esc(x.options[x.correct_idx])}</div>`).join('')}
    </div>`;
  refreshProg();setTimeout(()=>pages.learn(document.getElementById('content')),1600);
}

/* ============ 设置页：进度 + 本周主题 + 错误库 ============ */
pages.settings=async function(el){
  const [p,stages] = await Promise.all([api('/progress'),api('/stages')]);
  const week=await api(`/week/${p.stage}/${p.week}`);
  const errs=await api('/errors');
  state.settings={p,stages};
  document.getElementById('topProg').textContent='设置';
  el.innerHTML=`
    <h1>设置</h1>
    <div class="sub">调整进度 · 查看本周 · 错误库</div>

    <div class="card" style="border:1.5px solid var(--primary)">
      <h2>🎯 当前进度</h2>
      <div class="sub" style="margin-top:2px">调整位置不删历史，只改「当前学到哪」。</div>
      <label>阶段</label>
      <select id="set_stage" onchange="stageChange()">${stages.map((s,i)=>`<option value="${i}" ${i===p.stage?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <div style="display:flex;gap:10px;margin-top:6px">
        <div style="flex:1"><label>主题周 (1-12)</label>
          <div class="stepper"><button onclick="step('set_week',-1)">−</button><input type="number" id="set_week" value="${p.week}" min="1" max="12"><button onclick="step('set_week',1)">＋</button></div>
        </div>
        <div style="flex:1"><label>Day (1-7)</label>
          <div class="stepper"><button onclick="step('set_day',-1)">−</button><input type="number" id="set_day" value="${p.day}" min="1" max="7"><button onclick="step('set_day',1)">＋</button></div>
        </div>
      </div>
      <div id="weekpreview" class="tagline" style="margin-top:10px">${week?`本周：${esc(week.title)} · 语法：${esc(week.grammar)}`:'加载中…'}</div>
      <div class="btnrow"><button class="btn" onclick="saveProgress()">💾 保存位置</button></div>
    </div>

    <div class="card">
      <h2>📚 错误与薄弱项</h2>
      <div class="sub" style="margin-top:2px">自动累积造句中的错误，按类型统计</div>
      ${errs.length===0?'<div class="sub" style="margin:4px 0">暂无错误记录，多造句系统会自动帮你揪错。</div>'
        :errs.map(w=>`<div class="word" onclick="toggleErr('${esc(w.type)}')">
          <div class="en">${w.level} ${esc(w.type)}</div><div style="font-weight:800;color:var(--primary)">${w.total}次</div></div>`).join('')}
      <div id="errdetail"></div>
    </div>`;
  state.settings.week=week;
};
async function stageChange(){
  const p=state.settings.p, stage=+document.getElementById('set_stage').value;
  // 预览该阶段第1周
  const w=await api(`/week/${stage}/1`);
  document.getElementById('weekpreview').innerHTML=`阶段${stage} 第1周：${esc(w.title||'未设置')} · 语法：${esc(w.grammar||'')}`;
}
function step(id,d){const el=document.getElementById(id);const v=+el.value+d;const mn=+el.min||1,mx=+el.max||12;el.value=Math.max(mn,Math.min(mx,v));onStepChange();}
async function onStepChange(){
  const stage=+document.getElementById('set_stage').value;
  const week=+document.getElementById('set_week').value;
  const w=await api(`/week/${stage}/${week}`);
  document.getElementById('weekpreview').innerHTML=`阶段${stage} 第${week}周：${esc(w.title||'')} · 语法：${esc(w.grammar||'')}（调好位置点「保存位置」生效）`;
}
async function saveProgress(){
  const stage=+document.getElementById('set_stage').value;
  const week=+document.getElementById('set_week').value;
  const day=+document.getElementById('set_day').value;
  await api('/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,week,day})});
  toast('已保存位置（历史保留）');refreshProg();pages.settings(document.getElementById('content'));
}
async function toggleErr(type){
  const d=await api('/errors/'+encodeURIComponent(type));
  const box=document.getElementById('errdetail');
  if(box.dataset.type===type){box.innerHTML='';box.dataset.type='';return;}
  box.dataset.type=type;
  box.innerHTML=`<div class="card" style="margin-top:6px">
    <h2>${esc(type)}</h2>
    ${d.items.slice(0,12).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="color:#475569;font-size:13.5px">✗ ${esc(x.original)}</div>
      <div style="color:var(--green);font-size:13.5px">✓ ${esc(x.corrected)}</div>
      ${x.explanation?`<div class="sub" style="margin-top:2px">${esc(x.explanation)}</div>`:''}
    </div>`).join('')}
  </div>`;
}

async function render(page){const el=document.getElementById('content');if(pages[page])await pages[page](el);}
render('learn');
</script>
</body>
</html>
