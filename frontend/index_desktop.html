<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English OS · 个人英语学习系统</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --border:#e2e8f0; --text:#1e293b; --muted:#64748b;
  --primary:#4f46e5; --primary2:#6366f1; --green:#16a34a; --red:#dc2626; --amber:#d97706;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6}
.app{display:flex;min-height:100vh}
/* 侧边导航 */
.nav{width:220px;background:var(--card);border-right:1px solid var(--border);padding:20px 14px;position:fixed;top:0;bottom:0;overflow-y:auto}
.nav .logo{font-weight:800;font-size:20px;color:var(--primary);padding:6px 10px 18px}
.nav .logo small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:3px 0;border-radius:10px;
  color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px;cursor:pointer;transition:.15s}
.nav a:hover{background:#eef2ff;color:var(--primary)}
.nav a.active{background:var(--primary);color:#fff}
.nav a .ico{width:22px;text-align:center}
.content{flex:1;margin-left:220px;padding:28px 34px;max-width:960px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:18px}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.badge{background:#eef2ff;color:var(--primary);border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.nav{width:70px}.nav .logo small,.nav a span.txt{display:none}.content{margin-left:70px}.grid2{grid-template-columns:1fr}}
.btn{background:var(--primary);color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{background:var(--primary2)}
.btn.ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.green{background:var(--green)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.progressbar{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:8px 0 2px}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px;transition:.3s}
.word{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.15s;background:#fff}
.word:hover{border-color:var(--primary)}
.word .w{font-weight:700;font-size:16px}
.word .m{color:var(--muted);font-size:13px}
.word .tag{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:1px 7px;border-radius:10px}
.word.done{background:#f0fdf4;border-color:#bbf7d0}
.word.done .w{color:var(--green)}
.word .ck{font-size:18px}
.word.open{border-color:var(--primary);background:#f8faff}
.detail{background:#f8faff;border:1px solid #e0e7ff;border-radius:10px;padding:14px 16px;margin:-4px 0 10px}
.detail .row{margin:4px 0}
.detail .lbl{color:var(--muted);font-size:12.5px;display:inline-block;width:60px}
.detail .colloc{background:#eef2ff;color:var(--primary);border-radius:6px;padding:1px 8px;font-size:13px}
.sentence-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-top:8px}
.sentence-input:focus{outline:none;border-color:var(--primary)}
.result{background:#f8faff;border:1px solid #e0e7ff;border-radius:10px;padding:14px 16px;margin-top:12px}
.result.good{background:#f0fdf4;border-color:#bbf7d0}
.result .orig{color:#475569}
.result .fix{color:var(--green);font-weight:600}
.result .expl{color:var(--muted);font-size:13.5px;margin-top:6px}
.errtype{display:inline-block;background:#fee2e2;color:var(--red);border-radius:6px;padding:1px 9px;font-size:12.5px;margin-top:6px}
.weak-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer}
.weak-item:hover{border-color:var(--primary)}
.weak-item .type{font-weight:600;flex:1}
.weak-item .n{font-weight:700;font-size:16px}
.review-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:12px}
.review-card .prompt{font-size:16px;font-weight:600;margin-bottom:10px}
.pill{display:inline-block;background:#eef2ff;color:var(--primary);border-radius:16px;padding:3px 12px;font-size:13px;font-weight:600;margin:0 6px 6px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:left}
.tbl th{color:var(--muted);font-weight:600;font-size:13px}
.tbl tr:hover td{background:#f8faff}
.select{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px;background:#fff}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.toast{position:fixed;bottom:24px;right:24px;background:#1e293b;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:.3s;z-index:99}
.toast.show{opacity:1}
.rowline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.section-title{font-size:15px;font-weight:700;margin:18px 0 10px;color:var(--primary)}
.mono{font-family:ui-monospace,Menlo,monospace}
.rev-btn{border:none;padding:9px 18px;border-radius:9px;font-weight:600;cursor:pointer;font-size:14px}
.rev-ok{background:var(--green);color:#fff}
.rev-no{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="app">
  <nav class="nav">
    <div class="logo">English OS<small>个人英语学习系统</small></div>
    <a data-page="home" class="active"><span class="ico">🏠</span><span class="txt">主页</span></a>
    <a data-page="main"><span class="ico">📘</span><span class="txt">主线</span></a>
    <a data-page="review"><span class="ico">🔁</span><span class="txt">复习</span></a>
    <a data-page="quiz"><span class="ico">📝</span><span class="txt">周测</span></a>
    <a data-page="errors"><span class="ico">❌</span><span class="txt">错误</span></a>
    <a data-page="settings"><span class="ico">⚙️</span><span class="txt">设置</span></a>
  </nav>
  <main class="content" id="content"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const api = (p, opt) => fetch('/api'+p, opt).then(r=>r.json());
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
let state={progress:null};
const pages={};

/* ---------- 导航 ---------- */
document.querySelectorAll('.nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active');
  render(a.dataset.page);
});

/* ---------- 主页 ---------- */
pages.home = async function(el){
  const d = await api('/home');
  state.home=d;
  const p=d.progress, done=d.today.vocab_done, total=d.today.vocab_total;
  const vp=Math.round(done/total*100);
  const sp=d.today.sentence_done;
  const sunday=d.is_sunday;
  el.innerHTML=`
    <h1>English OS</h1>
    <div class="sub">告诉我现在应该继续做什么</div>
    <div class="card">
      <h2>当前进度 <span class="badge">阶段${p.stage} → Week ${p.week} → Day ${p.day}</span></h2>
      <div class="rowline" style="margin-top:4px">
        <span class="pill">📚 ${d.week_title}</span>
        <span class="pill">语法：${d.week_grammar}</span>
        ${sunday?'<span class="pill" style="background:#fef3c7;color:#b45309">今天是周日 · 周测日</span>':''}
      </div>
      <div class="progressbar"><div style="width:${vp}%"></div></div>
      <div class="rowline" style="justify-content:space-between">
        <span>主线 词汇 <b>${done}/${total}</b></span>
        <span>造句 <b>${sp}/10</b></span>
      </div>
      <div class="btnrow">
        <button class="btn" onclick="goMain()">▶ 继续学习</button>
        <button class="btn ghost" onclick="navigator('review')">复习 (${d.due_reviews.length})</button>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>今日复习 <span class="badge">${d.due_reviews.length} 项</span></h2>
        ${d.due_reviews.length===0?'<div class="sub" style="margin:0">今天没有到期的复习。学完新词后会自动出现。</div>':
        d.due_reviews.slice(0,6).map(r=>`<div class="word" onclick="navigator('review')"><span class="w">${r.kind==='vocab'?'📖':'❌'} ${r.ref_key}</span><span class="m">间隔${r.interval}天 · Day${r.day}</span></div>`).join('')}
        ${d.due_reviews.length>6?`<div class="sub" style="margin-top:8px">还有 ${d.due_reviews.length-6} 项…</div>`:''}
      </div>
      <div class="card">
        <h2>薄弱项</h2>
        ${d.weaknesses.length===0?'<div class="sub" style="margin:0">暂无错误记录，开始造句吧。</div>':
        d.weaknesses.map(w=>`<div class="weak-item" onclick="navigator('errors')"><span class="type">${w.level} ${w.type}</span><span class="n">${w.total}次</span></div>`).join('')}
      </div>
    </div>
    <div class="card">
      <h2>学习闭环</h2>
      <div class="sub">学习 → 输出 → AI批改 → 错误沉淀 → 自动复习 → 周测 → 发现薄弱项 → 补课 → 再学习</div>
      <div class="rowline">
        <span class="pill">📖 主线</span><span class="pill">✍️ 造句</span><span class="pill">🔁 复习</span>
        <span class="pill">📝 周测</span><span class="pill">❌ 错误</span>
      </div>
    </div>`;
};

/* ---------- 主线 ---------- */
let openWord=null;
pages.main = async function(el){
  const d = await api('/today');
  state.today=d;
  const p=d.progress;
  const done=d.words.filter(w=>w.mastered>0).length;
  el.innerHTML=`
    <h1>主线 · 今日学习</h1>
    <div class="sub">阶段${p.stage} → Week ${p.week}「${d.week_title}」→ Day ${p.day} ｜ 语法：<b>${d.grammar}</b></div>
    <div class="card">
      <h2>今日词汇 <span class="badge">${done}/${d.words.length} 已掌握</span></h2>
      <div id="wordlist">${d.words.map((w,i)=>`
        <div>
          <div class="word ${w.mastered>0?'done':''} ${openWord===w.word?'open':''}" onclick="toggleWord('${w.word.replace(/'/g,"\\'")}')">
            <div><span class="w">${w.word}</span> <span class="m">${w.meaning}</span></div>
            <div class="rowline"><span class="tag">${w.pos}</span>${w.mastered>0?'<span class="ck">✅</span>':''}</div>
          </div>
          <div id="det_${w.word}" style="display:none"></div>
        </div>`).join('')}
      </div>
      <div class="sub" style="margin-top:8px;font-size:12.5px">点击词展开详情 → 记住后点「我记住了」，自动加入复习。</div>
    </div>
    <div class="card">
      <h2>今日造句 · 10 句</h2>
      <div class="sub">规则：关于你自己 · 用今天语法 · 用今天词汇。写完后 AI 批改。</div>
      <div id="sentences"></div>
    </div>
    <div class="card">
      <h2>今日口语</h2>
      <div class="sub">${d.speaking_topic}</div>
    </div>`;
  // 加载已有造句
  renderSentences();
  // 若有展开的词，填充详情
  if(openWord){
    const w=d.words.find(x=>x.word===openWord);
    if(w) showWordDetail(openWord, w);
  }
};

function toggleWord(word){
  openWord = openWord===word?null:word;
  pages.main(document.getElementById('content'));
}
async function showWordDetail(word, w){
  const box=document.getElementById('det_'+word);
  if(openWord!==word){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=`
    <div class="detail">
      <div class="row"><span class="lbl">单词</span><b>${w.word}</b> <span style="color:var(--muted)">/${w.pos}/</span></div>
      <div class="row"><span class="lbl">意思</span>${w.meaning}</div>
      <div class="row"><span class="lbl">搭配</span><span class="colloc">${w.collocation}</span></div>
      <div class="row"><span class="lbl">例句</span>${w.example}</div>
      <div class="btnrow">
        <button class="btn green" onclick="masterWord('${word.replace(/'/g,"\\'")}')">我记住了 ✅</button>
      </div>
    </div>`;
}
async function masterWord(word){
  const w=state.today.words.find(x=>x.word===word);
  await api('/word/master',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word,mastered:2,meaning:w.meaning,collocation:w.collocation})});
  toast(`已掌握「${word}」，已加入复习`);
  pages.main(document.getElementById('content'));
}

async function renderSentences(){
  const el=document.getElementById('sentences');
  const prompts=state.today.sentence_prompts||[];
  let html='';
  for(let i=0;i<prompts.length;i++){
    html+=`<div class="card" style="padding:14px 16px;margin-bottom:12px">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px">${i+1}. ${prompts[i]}</div>
      <input class="sentence-input" id="sin_${i}" placeholder="写一个关于你自己的完整句子…">
      <div class="btnrow"><button class="btn ghost" onclick="checkSentence(${i})">✍️ AI 批改</button></div>
      <div id="sres_${i}"></div>
    </div>`;
  }
  el.innerHTML=html;
}
async function checkSentence(i){
  const val=document.getElementById('sin_'+i).value.trim();
  if(!val){toast('请先写一个句子');return;}
  const btn=document.querySelector(`#sentences .btnrow button`);
  btn.disabled=true;
  const r=await api('/sentence/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sentence:val})});
  const box=document.getElementById('sres_'+i);
  if(r.good){
    box.innerHTML=`<div class="result good">✅ 完全正确！<br><span class="fix">${r.corrected}</span></div>`;
  }else{
    box.innerHTML=`<div class="result">
      <div class="orig">原句：${r.original}</div>
      <div style="margin-top:4px">✅ 修正：<span class="fix">${r.corrected}</span></div>
      ${r.error_type?`<span class="errtype">${r.error_type}</span>`:''}
      <div class="expl">${r.explanation}</div>
      ${r.needs_review?'<div class="expl" style="color:var(--primary)">已存入错误库，并自动安排复习。</div>':''}
    </div>`;
  }
  btn.disabled=false;
}

/* ---------- 复习 ---------- */
pages.review = async function(el){
  const d = await api('/review/due');
  const items=d.items;
  state.reviewItems=items;
  el.innerHTML=`
    <h1>复习</h1>
    <div class="sub">系统自动安排的到期内容 · 采用主动回忆（看词→自己造句→判定）</div>
    ${items.length===0?'<div class="card"><div class="sub" style="margin:0">🎉 今日复习全部完成！明天会有新内容自动加入。</div></div>':
    items.map((r,i)=>`
      <div class="review-card" id="rev_${i}">
        <div class="rowline"><span class="pill">${kindLabel(r.kind)}</span><span class="pill">间隔${r.interval}天 · 连续对${r.reps}次</span></div>
        <div class="prompt">${r.kind==='vocab'?`请使用「<b>${r.ref_key}</b>」写一个关于你自己的句子：`:r.kind==='error'?r.prompt:`${r.prompt}`}</div>
        <input class="sentence-input" id="rev_in_${i}" placeholder="${r.kind==='vocab'?`用 ${r.ref_key} 造句…`:'你的答案…'}">
        <div class="btnrow">
          <button class="rev-btn rev-ok" onclick="submitRev(${i},${r.id},true)">✅ 我写对了</button>
          <button class="rev-btn rev-no" onclick="submitRev(${i},${r.id},false)">❌ 不确定/错了</button>
        </div>
        <div style="margin-top:10px" id="rev_ans_${i}"><button class="btn ghost" style="padding:6px 12px;font-size:13px" onclick="showRevAns(${i})">查看参考答案</button></div>
      </div>`).join('')}`;
};
function kindLabel(k){return {vocab:'📖词汇',collocation:'🔗搭配',sentence:'✍️句子',grammar:'📐语法',error:'❌高频错误'}[k]||k;}
function showRevAns(i){
  const r=state.reviewItems[i];
  document.getElementById('rev_ans_'+i).innerHTML=`<div style="color:var(--muted);font-size:13px">参考：${r.answer||r.ref_key}</div>`;
}
async function submitRev(i,id,correct){
  await api('/review/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,correct})});
  const card=document.getElementById('rev_'+i);
  if(correct){card.innerHTML='<div style="padding:8px 0;color:var(--green);font-weight:600">✅ 已记录正确，复习间隔已拉长。</div>';}
  else{card.innerHTML='<div style="padding:8px 0;color:var(--red);font-weight:600">已记录错误，会提前重新安排复习。</div>';}
  toast(correct?'回答正确，间隔已延长':'已标记，将提前复习');
  // 刷新主页数据
  api('/home').then(d=>state.home=d);
}

/* ---------- 周测 ---------- */
pages.quiz = async function(el){
  const d=await api('/home');
  const p=d.progress;
  const quiz=await api(`/quiz/${p.stage}/${p.week}`);
  state.quiz={quiz,p};
  el.innerHTML=`
    <h1>周测 · Week ${p.week}</h1>
    <div class="sub">本周主题「${d.week_title}」｜ 语法：${d.week_grammar} ｜ 目标：语法 ≥75% 通过后进入下一周</div>
    <div class="card"><h2>语法测试 <span class="badge">${quiz.questions.length} 题</span></h2>
    ${quiz.questions.map(q=>`
      <div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:600;margin-bottom:6px">${q.id}. ${q.question}</div>
        <div class="rowline">${q.options.map((o,oi)=>`<button class="btn ghost" style="padding:6px 14px;font-size:13px" id="q_${q.id}_${oi}" onclick="pickAns(${q.id},${oi})">${o}</button>`).join('')}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:4px">考点：${q.tag}</div>
      </div>`).join('')}
      <div class="btnrow"><button class="btn" onclick="gradeQuiz()">提交周测</button></div>
      <div id="quizres"></div>
    </div>`;
};
function pickAns(qid,oi){
  state.quiz.answers=state.quiz.answers||{};
  state.quiz.answers[qid]=oi;
  document.querySelectorAll(`[id^=q_${qid}_]`).forEach(b=>b.style.background='#fff');
  document.getElementById(`q_${qid}_${oi}`).style.background='#eef2ff';
}
async function gradeQuiz(){
  const r=await api('/quiz/grade',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:state.quiz.p.stage,week:state.quiz.p.week,answers:state.quiz.answers||{}})});
  const box=document.getElementById('quizres');
  box.innerHTML=`<div class="result ${r.passed?'good':''}">
    <div style="font-size:18px;font-weight:700">${r.correct}/${r.total} · ${r.pct}% ${r.passed?'✅ 通过！':'❌ 未通过'}</div>
    <div class="expl">${r.passed?'可以进入下一周继续学习。':'未达到75%，建议复习本周语法和薄弱项后重新测试。'}</div>
    ${r.detail.filter(x=>!x.ok).slice(0,5).map(x=>`<div class="expl" style="color:var(--red)">✗ ${x.question}（答案：${x.options[x.correct_idx]}）</div>`).join('')}
  </div>`;
  toast(r.passed?'周测通过！':'周测未通过，继续本周主题');
}

/* ---------- 错误 / 薄弱项 ---------- */
pages.errors = async function(el){
  const d=await api('/errors');
  el.innerHTML=`
    <h1>错误 · 我的薄弱项</h1>
    <div class="sub">长期累积的错误类型与频率，系统据此安排补课与复习。</div>
    ${d.map(w=>`
      <div class="weak-item" onclick="showErrDetail('${w.type}')">
        <span class="type">${w.level} ${w.type}</span>
        <span class="n">${w.total}次</span>
      </div>`).join('')}
    ${d.length===0?'<div class="card"><div class="sub" style="margin:0">暂无错误记录。</div></div>':''}
    <div id="errdetail"></div>`;
};
async function showErrDetail(type){
  const d=await api(`/errors/${encodeURIComponent(type)}`);
  const el=document.getElementById('errdetail');
  el.innerHTML=`<div class="card">
    <h2>${type} · 共 ${d.total} 次</h2>
    ${d.items.slice(0,10).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="color:#475569">❌ ${x.original}</div>
      <div style="color:var(--green)">✅ ${x.corrected}</div>
      <div class="expl" style="font-size:12.5px">${x.explanation} <span style="color:#cbd5e1">(${x.created_at.slice(0,10)})</span></div>
    </div>`).join('')}
    <div class="btnrow"><button class="btn ghost" onclick="showErrDetail(null)">收起</button></div>
  </div>`;
}

/* ---------- 设置 ---------- */
pages.settings = async function(el){
  const p=await api('/progress');
  const st=await api('/stages');
  const ai=await api('/ai/status');
  const weeks=await api('/home');
  el.innerHTML=`
    <h1>设置</h1>
    <div class="sub">手动调整学习进度（不删除任何历史数据）· 编辑每周内容 · AI 配置</div>

    <div class="card">
      <h2>调整学习进度</h2>
      <div class="sub">只修改当前位置，历史学习记录、错误、SRS、掌握程度全部保留。</div>
      <div class="grid2">
        <div><label>阶段</label><select class="select" id="set_stage">${st.map((s,i)=>`<option value="${i}" ${i===p.stage?'selected':''}>${s.name}</option>`).join('')}</select></div>
        <div><label>主题周 (1-12)</label><input type="number" id="set_week" value="${p.week}" min="1" max="12"></div>
        <div><label>Day (1-7)</label><input type="number" id="set_day" value="${p.day}" min="1" max="7"></div>
      </div>
      <div class="btnrow"><button class="btn" onclick="saveProgress()">保存进度调整</button></div>
    </div>

    <div class="card">
      <h2>编辑本周内容</h2>
      <div class="sub">你自己决定本周主题（粘贴你从 AI 得到的词汇/例句）。</div>
      <div id="wekedit"></div>
    </div>

    <div class="card">
      <h2>AI 批改配置</h2>
      <div class="sub">${ai.configured?'✅ 已连接 AI：'+ai.model:'⚠️ 未配置 AI，当前使用本地规则纠错兜底。填入 OpenAI 兼容接口后启用 AI 批改。'}</div>
      <label>Base URL</label><input type="text" id="ai_base" value="${ai.base_url}" placeholder="https://api.openai.com/v1 或本地兼容端点">
      <label>API Key</label><input type="password" id="ai_key" placeholder="sk-...">
      <label>模型</label><input type="text" id="ai_model" value="${ai.model}" placeholder="gpt-4o-mini">
      <div class="btnrow"><button class="btn ghost" onclick="saveAI()">保存 AI 配置</button></div>
    </div>`;
  loadWeekEdit(p.stage,p.week);
};
async function loadWeekEdit(stage,week){
  const w=await api(`/week/${stage}/${week}`);
  const el=document.getElementById('wekedit');
  if(!el)return;
  el.innerHTML=`
    <label>主题标题</label><input type="text" id="we_title" value="${w.title||''}">
    <label>本周语法</label><input type="text" id="we_grammar" value="${w.grammar||''}">
    <label>词汇（JSON，每项含 word/meaning/pos/collocation/example）</label>
    <textarea id="we_vocab" style="width:100%;min-height:180px;padding:10px;border:1px solid var(--border);border-radius:10px;font-family:monospace;font-size:13px">${JSON.stringify(w.vocab||[],null,1)}</textarea>
    <div class="btnrow"><button class="btn ghost" onclick="saveWeek(${stage},${week})">保存本周内容</button></div>`;
}
async function saveWeek(stage,week){
  let vocab=[];
  try{vocab=JSON.parse(document.getElementById('we_vocab').value);}
  catch(e){toast('词汇 JSON 格式错误');return;}
  await api('/week',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,week,title:document.getElementById('we_title').value,grammar:document.getElementById('we_grammar').value,vocab})});
  toast('本周内容已保存');
}
async function saveProgress(){
  const stage=+document.getElementById('set_stage').value;
  const week=+document.getElementById('set_week').value;
  const day=+document.getElementById('set_day').value;
  await api('/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage,week,day})});
  toast('进度已调整（历史数据全部保留）');
  state.progress=await api('/progress');
}
async function saveAI(){
  await api('/ai/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_url:document.getElementById('ai_base').value,api_key:document.getElementById('ai_key').value,model:document.getElementById('ai_model').value})});
  toast('AI 配置已保存，重启后生效');
}

/* ---------- 路由 ---------- */
function navigator(page){document.querySelectorAll('.nav a').forEach(x=>x.classList.remove('active'));document.querySelector(`.nav a[data-page=${page}]`).classList.add('active');render(page);}
async function render(page){const el=document.getElementById('content');if(pages[page]){await pages[page](el);}el.scrollTop=0;}
function goMain(){render('main');}

/* 初次加载 */
render('home');
</script>
</body>
</html>
