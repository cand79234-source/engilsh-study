<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>English OS</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --border:#e8ecf4; --text:#1e293b; --muted:#7c8698;
  --primary:#4f46e5; --primary2:#6366f1; --primary-bg:#eef2ff;
  --green:#16a34a; --green-bg:#f0fdf4; --red:#dc2626; --amber:#d97706;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
h1{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}

/* 顶部 */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50}
.brand{font-weight:800;font-size:17px;color:var(--primary)}
.prog-pill{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.prog-pill:active{opacity:.7}

/* 内容 */
.content{padding:66px 14px calc(var(--nav-h) + 24px);max-width:620px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.badge{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}

/* 按钮 */
.btn{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.green{background:var(--green)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1;text-align:center;min-width:100px}

/* 进度 */
.progressbar{height:9px;background:var(--border);border-radius:20px;overflow:hidden;margin:8px 0 4px}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px;transition:.3s}
.metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.metric b{color:var(--text)}

/* 词汇 */
.word{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--border);
  border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.word:active{background:var(--primary-bg)}
.word .en{font-weight:700;font-size:15px}
.word .cn{color:var(--muted);font-size:12.5px}
.word .ph{color:var(--muted);font-weight:500;font-size:12px;margin-left:5px}
.word.done{background:var(--green-bg);border-color:#bbf7d0}
.word.done .en{color:var(--green)}
.word.open{border-color:var(--primary);background:var(--primary-bg)}
.detail{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:13px;margin:-2px 0 10px;font-size:14px}
.detail .row{margin:4px 0}
.detail .lbl{color:var(--muted);font-size:12px}
.colloc{background:#e0e7ff;color:var(--primary);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:800;display:inline-block;margin:3px 6px 3px 0;cursor:pointer;user-select:none;border:1px solid #cdd6f6}
.colloc:active{background:var(--primary);color:#fff;transform:scale(.96)}
.hl{color:var(--primary);font-weight:800;background:transparent}
.tk{cursor:pointer;border-bottom:1px dotted rgba(59,130,246,.4)}
.tk:active{background:var(--primary-bg)}
.detail .row.exrow .tran .hl{background:none}
.detail .row.exrow{margin:9px 0 0;padding-top:8px;border-top:1px dashed #e0e7ff}
.exrow .tran{margin-left:0}
.tran{color:var(--green);font-size:12.5px;margin-top:3px;line-height:1.5}

/* 造句 */
.sinput{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;margin-top:6px}
.sinput:focus{outline:none;border-color:var(--primary)}
.sitem{margin-bottom:15px}
.sq{font-size:13.5px;font-weight:600;margin:6px 0 2px}
.res{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:11px;margin-top:8px;font-size:13.5px}
.res.good{background:var(--green-bg);border-color:#bbf7d0}
.errtype{display:inline-block;background:#fee2e2;color:var(--red);border-radius:7px;padding:1px 9px;font-size:12px;margin-top:7px;font-weight:600}
.spk{cursor:pointer;font-size:16px;user-select:none;line-height:1;display:inline-flex}
.spk:active{transform:scale(.9)}

/* 复习 */
.rev{padding:12px 0}
.rev .prompt{font-size:15px;font-weight:600;margin-bottom:9px;line-height:1.5}
.revb{display:flex;gap:9px;margin-top:9px}
.revb .btn{flex:1}
.ansbox{color:var(--muted);font-size:13px;margin-top:8px}
.optb{border:1.5px solid var(--border);background:#fff;padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;margin:0 5px 6px 0;min-width:56px}
.optb:active{opacity:.8}

/* 设置 */
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{font-family:monospace;font-size:13px;min-height:110px;line-height:1.6}
.stepper{display:flex;align-items:center;gap:7px}
.stepper button{width:42px;height:42px;flex-shrink:0;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:10px;font-size:20px;cursor:pointer}
.stepper input{text-align:center}
.tagline{font-size:12.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:9px;padding:8px 11px;margin:6px 0}

/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;cursor:pointer}
.bottomnav a .ico{font-size:22px;line-height:1}
.bottomnav a.active{color:var(--primary)}

/* 弹窗 / 进度调整 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:90}
.overlay.show{display:flex}
.sheet{width:100%;max-width:620px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:2px}
.sheet .close{float:right;border:none;background:#f1f5f9;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer}
#seg_stage{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}
#seg_stage button{border:1.5px solid var(--border);background:#fff;padding:7px 8px;border-radius:9px;font-size:12.5px;cursor:pointer;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seg_stage button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
#seg_stage button small{display:block;font-size:9.5px;font-weight:400;opacity:.8}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.sticky-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;margin:0 -16px calc(-16px - env(safe-area-inset-bottom));
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:2}
.pickgrid button{border:1.5px solid var(--border);background:#fff;padding:9px 0;border-radius:9px;font-size:13px;cursor:pointer;text-align:center}
.pickgrid button.on{background:var(--primary-bg);color:var(--primary);border-color:var(--primary);font-weight:700}
.errcount{font-size:12px;font-weight:700;background:#fee2e2;color:var(--red);border-radius:20px;padding:2px 8px}
.pill-mini{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">English OS</div>
  <button class="prog-pill" id="topProg" onclick="openProg()">阶段0 · W1 · D1</button>
</div>
<main class="content" id="content"></main>
<div class="bottomnav">
  <a data-page="learn" class="active"><span class="ico">📖</span><span>学习</span></a>
  <a data-page="review"><span class="ico">🔁</span><span>复习</span></a>
  <a data-page="errors"><span class="ico">🎯</span><span>薄弱项</span></a>
</div>
<!-- 进度调整弹窗 -->
<div class="overlay" id="progOverlay" onclick="if(event.target===this)closeProg()">
  <div class="sheet" id="progSheet"></div>
</div>
<script>
const api=(p,opt)=>fetch('/api'+p,opt).then(r=>r.json());
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* 统一事件委托：凡是参数来自用户导入内容（单词/搭配/例句）的点击，
   一律用 data-act + data-val 而非内联 onclick。
   原因：HTML 转义救不了内联 JS——onclick="speak('I'm ...')" 里的撇号会直接破坏 JS 语法，
   而英语里 I'm / don't / it's 遍地都是。data-* 属性不会被执行，取值后才调用。 */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const v = el.getAttribute('data-val');
  if (act === 'speak') { e.stopPropagation(); speak(v); }
  else if (act === 'toggleW') toggleW(v);
  else if (act === 'master') master(v);
  else if (act === 'openErr') openErr(v);
  else if (act === 'wlookup') wordLookup(v);
  if (act === 'showColloc') showColloc(v, el.getAttribute('data-val2') || '');
  else if (act === 'check') submitSentence(v);
  else if (act === 'redo') redoSentence(v);
  else if (act === 'copyOne') copyOne(v, el.getAttribute('data-val2') || '');
  else if (act === 'copyAll') copyAll();
  else if (act === 'mySentences') toggleMySentences();
});
function toast(m){const t=document.createElement('div');t.textContent=m;
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.25s';
  document.body.appendChild(t);requestAnimationFrame(()=>t.style.opacity=1);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),250);},2000);}
const state={}; const pages={};
document.querySelectorAll('.bottomnav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.bottomnav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active'); render(a.dataset.page); window.scrollTo(0,0);});
async function refreshProg(){try{const p=await api('/progress');
  document.getElementById('topProg').textContent=`阶段${p.stage} · W${p.week} · D${p.day}`;}catch(e){}}
function go(page){document.querySelectorAll('.bottomnav a').forEach(x=>x.classList.remove('active'));
  document.querySelector(`.bottomnav a[data-page=${page}]`).classList.add('active');render(page);window.scrollTo(0,0);}

/* ============ 学习页：今天学什么 + 本周词 + 造句 + 周测 ============ */
pages.learn=async function(el){
  const [d,t] = await Promise.all([api('/home'), api('/today')]);
  state.learn={d,t}; state.today=t;
  const p=d.progress;
  const vp=Math.round(d.today.vocab_done/d.today.vocab_total*100);
  const sp=Math.min(d.today.sentence_done,10);
  document.getElementById('topProg').textContent=`阶段${p.stage} · W${p.week} · D${p.day}`;
  el.innerHTML=`
  <div class="card" style="border:1.5px solid var(--primary)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>今日 · Week${p.week}「${d.week_title}」</h2>
      <span class="badge">${d.week_vocab_count}词/周</span>
    </div>
    <div class="sub" style="margin-top:2px">语法重点：${d.week_grammar||'（未设置）'}　·　Day ${p.day}</div>
    <div class="metric"><span>今日词汇</span><b>${d.today.vocab_done}/${d.today.vocab_total}</b></div>
    <div class="progressbar"><div style="width:${vp}%"></div></div>
    <div class="metric"><span>今日造句</span><b>${sp}/10</b></div>
    <div class="progressbar"><div style="width:${sp*10}%"></div></div>
  </div>

  ${t.is_rest_day?`
  <div class="card" style="background:#ecfdf5;border-color:#a7f3d0">
    <h2>😌 Day7 · 休息日</h2>
    <div class="sub" style="margin-top:4px">今天不学新词。你可以：<b>做本周周测</b>、翻翻这周造过的句子，或者直接休息。</div>
    <div class="btnrow" style="margin-top:8px">
      <button class="btn ghost sm" onclick="renderQuiz()">📝 做本周周测</button>
      <button class="btn ghost sm" onclick="openProg()">📍 回到 Day1</button>
    </div>
  </div>`:`
  <div class="card">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px">
      <h2 style="margin:0;flex:1 1 200px;min-width:0">📖 本周词汇</h2>
      <button class="btn ghost sm" style="flex-shrink:0" onclick="showImport()">📥 导入本周词</button>
    </div>
    <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
      ${t.day_group&&t.day_group.name?`<span class="badge">${esc(t.day_group.name)}</span>`:''}
      ${t.week_total_words&&t.week_total_words>20?`<span class="badge" style="background:#f8fafc;color:var(--muted)">Day ${t.progress.day}/${t.week_total_words}词/周</span>`:''}
    </div>
    <div class="sub" style="margin-top:2px">点单词看例句和搭配 · 点 <b>🔊</b> 听发音 · 记住后点「记住了」</div>
    <div id="wordlist">${renderWords(t.words)}</div>
  </div>

  <div class="card" id="planBasic">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px">
      <h2 style="margin:0;flex:1 1 200px;min-width:0">① 基础 · 每词一句 <span class="badge" id="basicProg" style="background:var(--primary-bg);color:var(--primary)"></span></h2>
      <button class="btn ghost sm" style="flex-shrink:0" id="copyAllBtn" data-act="copyAll">📋 复制全部</button>
    </div>
    <div class="sub" style="margin-top:2px">目标：<b>会用</b>。今天 ${(t.sentence_plan&&t.sentence_plan.basic||[]).length} 个词，每个造一句 · 「复制全部」＝把今天 ①②③ 的每次作答和批改结果一次带走</div>
    <div id="sentences"></div>
  </div>

  <div class="card" id="planUpgrade" style="background:#fffbeb;border-color:#fde68a">
    <h2>② 升级 · 5 句 <span class="badge" id="upProg" style="background:#fef3c7;color:#92400e"></span></h2>
    <div class="sub" style="margin-top:2px">目标：<b>用得更自然</b>。系统给升级方向 + 可照搬的示范句，你把第①段的句子改好</div>
    <div id="upgrades"></div>
  </div>

  <div class="card" id="planCombo" style="background:#f8fafc;border-color:#e2e8f0">
    <h2>③ 组合表达 · 10 组 <span class="badge" id="comboProg" style="background:#e0e7ff;color:var(--primary)"></span></h2>
    <div class="sub" style="margin-top:2px">目标：<b>把词放进连续表达</b>。到期复习词混在这里一起过${(t.review_pool||[]).length?`（今天 ${(t.review_pool||[]).length} 个）`:''} · 写多写少随意，不强制</div>
    <div id="combos"></div>
  </div>`}

  <div class="card" style="background:${d.is_sunday?'var(--amber)':'var(--card)'}${d.is_sunday?';color:#fff':''}">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="${d.is_sunday?'color:#fff':''}">📝 本周周测</h2>
      ${d.is_sunday?'<span style="font-size:12px;background:rgba(255,255,255,.3);padding:3px 10px;border-radius:12px">周日测试日</span>':''}
    </div>
    <div class="sub" style="margin-top:2px;${d.is_sunday?'color:#fff':''}">测试本周语法与词汇，≥75% 进入下一周</div>
    <div class="btnrow"><button class="btn ${d.is_sunday?'ghost':''}" style="${d.is_sunday?'border-color:#fff;color:#fff':'border:0'}" onclick="renderQuiz()">开始本周测试</button></div>
    <div id="quizarea"></div>
  </div>`;
  // 跨天可查的「我的造句记录」面板（修复『昨天造的句子看不见』）
  el.innerHTML += `
  <div class="card" style="background:#f1f5f9;border-color:#cbd5e1">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>📚 我的造句记录</h2>
      <button class="btn ghost sm" data-act="mySentences">展开 / 收起</button>
    </div>
    <div class="sub" style="margin-top:2px">跨天保留：你写过的每一句都在这里（刷新 / 换天也不会丢）</div>
    <div id="mySentences" style="display:none;margin-top:8px"></div>
  </div>`;
  if(!t.is_rest_day) renderSentencePlan(t);
};

function renderWords(words){
  if(!words||words.length===0) return '<div class="sub" style="margin:4px 0">本周还没有词，点「换本周词」粘贴你要学的英文单词。</div>';
  const open=state.openWord;
  return words.map(w=>{
    const isOpen=open===w.word;
    const done=w.mastered>0;
    const collocs=(w.collocations||[]).filter(c=>c&&c.phrase);
    const exs=(w.examples||[]).filter(e=>e&&e.sentence);
    return `<div>
      <div class="word ${done?'done':''} ${isOpen?'open':''}" data-act="toggleW" data-val="${esc(w.word)}">
        <div><div class="en">${esc(w.word)} ${w.phonetic?`<span class="ph">${esc(w.phonetic)}</span>`:''}</div><div class="cn">${esc(w.meaning)||''}</div></div>
        <div style="display:flex;align-items:center;gap:7px">
          <span class="spk" data-role="spk" title="听发音" data-act="speak" data-val="${esc(w.word)}">🔊</span>
          ${w.pos?`<span class="badge" style="${done?'background:#dcfce7;color:var(--green)':''}">${esc(w.pos)}</span>`:''}
          ${done?'✅':''}
        </div>
      </div>
      ${isOpen?`<div class="detail">
        <div class="row" style="display:flex;align-items:center;gap:6px"><b>${esc(w.word)}</b>
          ${w.pos?`<span style="color:var(--muted)">· ${esc(w.pos)}</span>`:''}
          <span style="color:var(--muted)">/${esc(w.meaning)}/</span>
          <span class="spk" style="margin-left:auto" data-act="speak" data-val="${esc(w.word)}">🔊</span></div>
        ${collocs.length?`<div class="row"><span class="lbl">固定搭配 · 点开看解释</span>
          <div>${collocs.map((c,ci)=>`<span class="colloc" data-act="showColloc" data-val="${esc(c.phrase)}" data-val2="${esc(c.meaning||'')}">${esc(c.phrase)}</span>`).join('')}</div></div>`:''}
        ${exs.map((e,ei)=>`<div class="row exrow">
            <span class="lbl">例句 ${ei+1} · 加粗=该词固定搭配</span>
            <div style="display:flex;align-items:flex-start;gap:6px">
              <span style="flex:1;line-height:1.6" data-ex>${hlColloc(e.sentence, collocs.map(c=>c.phrase))}</span>
              <span class="spk" data-act="speak" data-val="${esc(e.sentence)}">🔊</span>
            </div>
            ${e.translation?`<div class="tran">${esc(e.translation)}</div>`:''}

/* 例句内固定搭配高亮：把例句中出现的搭配词组（含变体词形）加粗 */
function _norm(w){
  // 轻量词形归一：小写 + 去常见后缀，用于比较词根
  if(!w)return '';
  w=String(w).toLowerCase();
  if(w.length<=3)return w;
  if(/[^a-z]/.test(w))return w.replace(/[^a-z]/g,'');
  let r=w;
  // 不规则高频
  const irr={went:'go',gone:'go',been:'be',were:'be',had:'have',made:'make',did:'do',said:'say',
             saw:'see',took:'take',got:'get',gave:'give',found:'find',felt:'feel',knew:'know',
             taught:'teach',bought:'buy',thought:'think',spoke:'speak',wrote:'write',came:'come',
             became:'become',began:'begin',built:'build',caught:'catch',chose:'choose',drove:'drive',
             grew:'grow',heard:'hear',kept:'keep',left:'leave',met:'meet',paid:'pay',put:'put',
             ran:'run',sent:'send',sat:'sit',stood:'stand',told:'tell',understood:'understand',won:'win'};
  if(irr[r])return irr[r];
  // 去词缀：-ing/-ed/-d/-es/-s/-ies
  if(r.endsWith('ing')){const b=r.slice(0,-3);if(b.endsWith('e'))return b;return b;} // come->coming→com? 近似用 b
  if(r.endsWith('ied'))return r.slice(0,-3)+'y';
  if(r.endsWith('ed'))return r.slice(0,-2);
  if(r.endsWith('d'))return r.slice(0,-1);
  if(r.endsWith('ies'))return r.slice(0,-3)+'y';
  if(r.endsWith('es'))return r.slice(0,-2);
  if(r.endsWith('s'))return r.slice(0,-1);
  return r;
}
const _SKIP=['a','an','the'];   // 退化匹配时排除的纯冠词
function hlColloc(sentence, phrases){
  if(!sentence)return esc(sentence||'');
  if(!phrases||!phrases.length)return esc(sentence);
  // 把原文切块：字 + 分隔
  const segs=[]; // {txt:词原文, w:归一后的词|null}
  let m;
  const re=/([A-Za-z][A-Za-z'’-]*)|([^A-Za-z]+)/g;
  while((m=re.exec(sentence))!==null){
    if(m[1])segs.push({txt:m[1], w:_norm(m[1])});
    else segs.push({txt:m[0], w:null});
  }
  const marked=new Array(segs.length).fill(false);
  function tryMatch(pWords){
    // 滑动窗口：例句某起点起，依次匹配目标词（跳过标点），全部命中则标记
    for(let s=0;s<segs.length;s++){
      if(segs[s].w==null)continue;
      let j=0, hit=true, pidx=[];
      for(let i=s;i<segs.length&&j<pWords.length;i++){
        if(segs[i].w==null)continue;           // 跳过标点/空格
        if(segs[i].w===pWords[j]){pidx.push(i);j++;}
        else { hit=false; break; }             // 必须连续命中
      }
      if(hit&&j===pWords.length){ for(const k of pidx)marked[k]=true; return true; }
    }
    return false;
  }
  for(const ph of phrases){
    const words=String(ph).split(/\s+/).map(x=>x.replace(/[«»「」]/g,'')).filter(Boolean).map(_norm).filter(Boolean);
    if(!words.length)continue;
    // 完整顺序匹配（变体已由 _norm 拉平）
    tryMatch(words);
  }
  // 若完整词组未连续出现，退化为只标该搭配里最长的那个实词（通常是核心名词/动词），
  // 避免把句子里所有沾边的介词/通用动词都标粗。每搭配至多补一组。
  const _STOP=/^(a|an|the|for|of|in|on|at|to|with|from|by|be|is|are|was|were|and|or|as|do|does|did)$/;
  for(const ph of phrases){
    const ws=String(ph).split(/\s+/).map(x=>x.replace(/[«»「」]/g,'')).filter(Boolean).map(_norm);
    // 从长到短取候选（实词），先试最长的那个
    const cand=ws.filter(w=>w&&!_STOP.test(w)).sort((a,b)=>b.length-a.length);
    if(!cand.length)continue;
    let done=false;
    for(const c of cand){
      // 找例句中第一个未标记的该词
      for(let i=0;i<segs.length;i++){
        if(!marked[i]&&segs[i].w===c&&segs[i].txt.length>=3){marked[i]=true;done=true;break;}
      }
      if(done)break;
    }
  }
  // 拼接：每个英文词包成可点 span（欧陆式点词查义），搭配词组保持加粗
  let out='';
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(s.w!=null){
      const inner = marked[i] ? '<b class="hl">'+esc(s.txt)+'</b>' : esc(s.txt);
      out += '<span class="tk" data-act="wlookup" data-val="'+esc(s.txt.toLowerCase())+'">'+inner+'</span>';
    } else {
      out += esc(s.txt);
    }
  }
  return out;
}

// 离线发音：浏览器本地 TTS（优先选本机已下载的英文语音，无需联网/无外部服务）
let _voices=[], _voice=null, _voiceReady=false;
function _enVoices(vs){
  return (vs||[]).filter(v=>/^en/i.test(v.lang||''));
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  let vs=[];
  try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return; }
  // 语音列表还没异步加载好：保持原状，等 onvoiceschanged / 定时轮询
  if(!vs.length) return;
  _voices=vs; _voiceReady=true;
  const en=_enVoices(vs);
  // 优先：本机离线可用(localService=true，非联网合成)的美/英音；其次 google；最后任意英文
  const usuk=en.filter(v=>/en(-|_)?(US|GB|UK)/i.test(v.lang));
  _voice=(usuk.find(v=>v.localService)||en.find(v=>v.localService))
      ||usuk.find(v=>/google/i.test(v.name))
      ||usuk[0]||en[0]||null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
  // 部分浏览器/微信内核首次 getVoices() 返回空，需要反复触发才会填充
  let _vt=0;
  const _vi=setInterval(()=>{pickVoice(); if(_voiceReady||(++_vt>12)) clearInterval(_vi);},250);
}
function hasEnglishVoice(){
  if(!('speechSynthesis' in window)) return false;
  try{
    const vs=speechSynthesis.getVoices();
    if(vs&&vs.length) return _enVoices(vs).length>0;
    return !!_enVoices(_voices).length;
  }catch(e){return !!_enVoices(_voices).length;}
}
function speak(text){
  if(!text)return;
  const ss=window.speechSynthesis;
  if(!ss){toast('当前浏览器不支持语音朗读，建议换用 Chrome / Safari 打开');return;}
  // 每次同步刷新一次语音列表（voices 常是异步就绪的）。
  // 注意：这里绝不能 await，否则 iOS 会因"不在用户手势同步栈内"而拒绝发声。
  try{ pickVoice(); }catch(e){}
  try{ ss.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.92; u.pitch=1;
  // 拿得到英文语音就用它；拿不到就不设 voice，交给浏览器默认语音兜底
  // （旧版在这里"检测不到英文语音就 return"，导致大量手机点了没反应）
  if(_voice) u.voice=_voice;
  try{ ss.resume(); }catch(e){}

  let started=false;
  u.onstart=()=>{started=true;};
  u.onerror=(e)=>{
    const err=(e&&e.error)||'';
    if(err==='not-allowed'){
      toast('系统不允许朗读：检查手机是否处于静音、浏览器是否禁用了语音');
    }else if(err==='language-unavailable'||err==='voice-unavailable'){
      toast('设备缺少英文语音包，请在系统“设置→语言和语音”里下载英语语音后重试');
    }else if(err==='interrupted'||err==='canceled'){
      // 用户自己打断，不提示
    }else if(err){
      toast('朗读失败（'+err+'），建议换用系统浏览器打开');
    }else{
      toast('朗读失败，建议换用 Chrome / Safari 打开');
    }
  };
  try{ ss.speak(u); }catch(e){ toast('朗读失败：'+(e&&e.message||e)); return; }

  // Chrome 已知 bug：paused 状态下不发声，补一次 resume
  setTimeout(()=>{ try{ if(ss.paused) ss.resume(); }catch(e){} },150);
  // 兜底：说不出来且没有任何事件（多见于微信内核不支持 TTS），给可操作提示
  setTimeout(()=>{
    if(started) return;
    try{
      if(!ss.speaking && !ss.pending && !hasEnglishVoice()){
        toast('这个浏览器可能不支持朗读，建议用系统浏览器（Safari/Chrome）打开本页');
      }
    }catch(e){}
  },1200);
}

  await loadAttempts();
  state.tkMeta={};
  const g=(t&&t.grammar)||'';   // 本周语法要求（如「一般现在时、频率副词」），随批改一起传给后端

  // ① 基础：每词一句
  document.getElementById('sentences').innerHTML=p.basic.map((b,i)=>{
    const tk='basic:'+i;
    state.tkMeta[tk]={word:b.word||'', task:b.task||'', label:b.task||'', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${b.i}. ${esc(b.task)}${b.focus?' <span class="badge" style="background:#fef3c7;color:#92400e">★重点</span>':''}</div>`,
      '写一个英文句子…', false);
  }).join('') || '<div class="sub">今天没有新词。</div>';

  // ② 升级：给方向 + 示范句
  document.getElementById('upgrades').innerHTML=(p.upgrade||[]).map((u,i)=>{
    const tk='up:'+i;
    state.tkMeta[tk]={word:u.word||'', task:u.task||'', label:'升级「'+(u.word||'')+'」', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${u.i}. 升级「<b>${esc(u.word)}</b>${u.meaning?'（'+esc(u.meaning)+'）':''}」
        <span class="badge" style="background:#fef3c7;color:#92400e">${esc(u.direction)}</span>
        ${u.is_review?'<span class="badge" style="background:#fee2e2;color:#b91c1c">复习词</span>':''}</div>
      <div class="sub" style="margin:4px 0">${esc(u.direction_desc)}</div>
      <div class="sub" style="margin:4px 0;color:var(--muted)">示范：${esc(u.sample)}</div>
      ${u.collocation?`<div class="sub" style="margin:4px 0">可用搭配：<b>${esc(u.collocation)}</b></div>`:''}`,
      '把第①段的句子改得更自然…', false);
  }).join('') || '<div class="sub">今天的词还够不上升级，先把基础句写完。</div>';

  // ③ 组合：2-3 个词写成连续表达
  document.getElementById('combos').innerHTML=(p.combo||[]).map((c,i)=>{
    const tk='combo:'+i;
    state.tkMeta[tk]={word:(c.words||[]).map(w=>w.word).join(' '), task:c.scene||'', label:c.scene||'', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${c.i}. ${esc(c.scene)}</div>
      <div class="sub" style="margin:4px 0">${(c.words||[]).map(w=>`<span class="badge" style="background:${w.review?'#fee2e2;color:#b91c1c':'var(--primary-bg);color:var(--primary)'}">${esc(w.word)}${w.meaning?'·'+esc(w.meaning):''}${w.review?' 🔁':''}</span>`).join(' ')}</div>
      <div class="sub" style="margin:4px 0;color:var(--muted)">${esc(c.hint||'建议 2-3 句，写多写少随意，不强制。')}</div>`,
      '写 2-3 句连续表达（写多写少随意）…', true);
  }).join('') || '<div class="sub">今天没有可组合的词。</div>';

  planKeys().forEach(tk=>renderAttempts(tk));
  planProgress();
}

/* 单题外壳：题干 + 输入框 + 批改按钮 + 结果区 + 历史区 */
function itemHtml(tk, headHtml, ph, isArea){
  const n=histOf(tk).length;
  const inp=isArea
    ? `<textarea class="sinput" id="in_${tk}" rows="3" placeholder="${esc(ph)}"></textarea>`
    : `<input class="sinput" id="in_${tk}" placeholder="${esc(ph)}">`;
  return `<div class="sitem">
    ${headHtml}
    ${inp}
    <div class="btnrow">
      <button class="btn ghost sm" data-act="check" data-val="${tk}">✍️ 批改${n?'（第 '+(n+1)+' 次）':''}</button>
      <button class="btn ghost sm" data-act="redo" data-val="${tk}" style="${n?'':'display:none'}" id="redo_${tk}">✏️ 重新作答</button>
      <button class="btn ghost sm" data-act="copyOne" data-val="${tk}" data-val2="last" style="${n?'':'display:none'}" id="cp_${tk}">📋 复制</button>
    </div>
    <div id="res_${tk}"></div>
  </div>`;
}

/* ---------- 提交批改 ---------- */
async function submitSentence(tk){
  const inp=document.getElementById('in_'+tk);
  const v=(inp&&inp.value||'').trim();
  if(!v){toast('先写一个句子');return;}
  const meta=(state.tkMeta||{})[tk]||{};
  const btn=document.querySelector('[data-act="check"][data-val="'+tk+'"]');
  if(btn){btn.disabled=true;btn.textContent='批改中…';}
  try{
    const r=await api('/sentence/check',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sentence:v, word:meta.word||'', task_key:tk,
        grammar:meta.grammar||'', prompt:meta.task||''})});
    if(!r||r.error){toast((r&&r.error)||'批改失败');return;}
    state.hist=state.hist||{}; state.hist[tk]=state.hist[tk]||[];
    state.hist[tk].push({
      id:r.sentence_id, attempt:r.attempt, sentence:r.original, corrected:r.corrected,
      score:r.score, verdict:r.verdict, ok:!!r.ok, error_type:r.error_type,
      status:r.status||'', errors:r.errors||[], task_issues:r.task_issues||[],
      optimizations:r.optimizations||[], created_at:r.created_at});
    renderAttempts(tk);
    planProgress();
    // 组合题额外反馈：用到了哪几个建议词（只提示，不判错）
    if(tk.indexOf('combo:')===0) comboHint(tk,v);
  }catch(e){ toast('批改失败：'+e.message); }
  finally{ if(btn){btn.disabled=false;btn.textContent='✍️ 批改（第 '+(histOf(tk).length+1)+' 次）';} }
}
function comboHint(tk,txt){
  const c=(planOf(state.today).combo||[])[parseInt(tk.split(':')[1],10)];
  if(!c) return;
  const low=(txt||'').toLowerCase();
  const used=(c.words||[]).filter(w=>low.includes(String(w.word).toLowerCase()));
  const miss=(c.words||[]).filter(w=>!low.includes(String(w.word).toLowerCase()));
  const box=document.getElementById('res_'+tk);
  if(!box) return;
  box.insertAdjacentHTML('afterbegin',
    `<div class="sub" style="margin:6px 0">🎯 用到 ${used.length}/${(c.words||[]).length} 个建议词`
    + (used.length?`：<b>${used.map(w=>esc(w.word)).join('、')}</b>`:'')
    + (miss.length?` · 没用上的：${miss.map(w=>esc(w.word)).join('、')}（下次可以试试）`:' · 全部用上了 👍')
    + `</div>`);
}
function redoSentence(tk){
  const inp=document.getElementById('in_'+tk);
  if(inp){inp.value='';inp.focus();}
  toast('已清空，重新写一句吧 ✏️（上一次的作答已保留）');
}

/* ---------- 结果渲染：判定 / 分数 / 哪里错 / 为什么 / 正确 / 可优化 ---------- */
function renderAttempts(tk){
  const box=document.getElementById('res_'+tk);
  if(!box)return;
  const list=histOf(tk);
  const cp=document.getElementById('cp_'+tk), rd=document.getElementById('redo_'+tk);
  if(cp)cp.style.display=list.length?'':'none';
  if(rd)rd.style.display=list.length?'':'none';
  if(!list.length){box.innerHTML='';return;}
  box.innerHTML=list.map((a,i)=>attemptCard(a,tk,i,i===list.length-1)).join('');
}
function attemptCard(a,tk,i,isLast){
  const sc=Number(a.score||0);
  const errs=a.errors||[], opts=a.optimizations||[], tasks=a.task_issues||[];
  const hasErr=errs.length>0, hasTask=tasks.length>0;
  const pass = sc>=85 && !hasErr && !hasTask;
  let head;
  if(pass){
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--green)">✅ 正确 · ${sc}/100 · 基本掌握</div>`;
  }else if(hasErr){
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--red)">❌ 有错误 · ${sc}/100 · 需要改进</div>`;
  }else if(hasTask){
    head=`<div style="font-size:15.5px;font-weight:800;color:#b45309">⚠️ 未完成题目要求 · ${sc}/100 · 需要改进</div>`;
  }else{
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--red)">❌ 有错误 · ${sc}/100 · 需要改进</div>`;
  }
  if(a.status==='UNCERTAIN'){
    head=`<div style="font-size:15.5px;font-weight:800;color:#b45309">⚠️ 系统无法完全判断 · ${sc}/100</div>`;
  }
  const errHtml = errs.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:var(--red)">🔍 哪里错了 / 为什么错</div>`
      + errs.map((e,j)=>`<div style="background:#fff;border:1px solid #fecaca;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">❌ <b>哪里错了：</b><span style="color:var(--red);font-weight:700">${esc(e.where)}</span>
          ${e.type?`<span class="errtype" style="margin-left:5px">${esc(e.type)}</span>`:''}</div>
        <div style="font-size:13.5px;color:#475569;margin-top:4px">💡 <b>为什么错：</b>${esc(e.explanation)}</div>
        <div style="font-size:13.5px;margin-top:4px">✅ <b>正确表达：</b><b style="color:var(--green)">${esc(e.correct)}</b></div>
      </div>`).join('')
    : (hasTask?`<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">✅ 没有明显语法错误</div>`
                :`<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">✅ 没有明显错误</div>`);
  const taskHtml = tasks.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:#b45309">📋 题目要求（需补齐，不计入语法错误）</div>`
      + tasks.map((e,j)=>`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">⚠️ <b>未完成：</b><span style="color:#b45309;font-weight:700">${esc(e.where)}</span></div>
        <div style="font-size:13.5px;color:#475569;margin-top:4px">💡 ${esc(e.explanation)}</div>
      </div>`).join('')
    : '';
  const corHtml = (!pass && a.corrected && a.corrected!==a.sentence)
    ? `<div style="margin-top:6px;font-size:13.5px">📗 <b>整句正确写法：</b><b style="color:var(--green)">${esc(a.corrected)}</b></div>`:'';
  const optHtml = opts.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:#92400e">💡 可以优化（原句没错，仅供参考，不扣分）</div>`
      + opts.map((o,j)=>`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">✨ <b>可以优化：</b>${o.suggestion?`<b style="color:var(--green)">${esc(o.suggestion)}</b>`:'<span style="color:var(--muted)">（见说明）</span>'}</div>
        <div style="font-size:13px;color:#475569;margin-top:4px">${esc(o.reason||'')}</div>
      </div>`).join('')
    : '';
  return `<div class="res ${pass?'good':''}" style="margin-top:8px;${isLast?'':'opacity:.72'}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="min-width:0">
        <div style="font-size:12px;color:var(--muted)">第 ${a.attempt||i+1} 次作答${isLast?' · <b style="color:var(--primary)">最新</b>':''}</div>
        ${head}
      </div>
      <button class="btn ghost sm" style="flex-shrink:0" data-act="copyOne" data-val="${tk}" data-val2="${a.attempt}">📋 复制</button>
    </div>
    <div style="margin-top:5px;font-size:14px;line-height:1.6">${esc(a.sentence)}</div>
    ${errHtml}${taskHtml}${corHtml}${optHtml}
  </div>`;
}

/* ---------- 复制 ---------- */
function copyOne(tk, which){
  const list=histOf(tk);
  if(!list.length){toast('还没有批改记录');return;}
  const a = (which==='last'||which===''||which==null) ? list[list.length-1]
          : (list.find(x=>String(x.attempt)===String(which)) || list[list.length-1]);
  copyText(attemptCopyText(tk,a));
}
function attemptCopyText(tk,a){
  const meta=(state.tkMeta||{})[tk]||{};
  const sc=Number(a.score||0);
  const L=[];
  L.push('【造句批改】');
  L.push('单词：'+(meta.word||'—'));
  if(meta.task) L.push('题目：'+meta.task);
  L.push('第 '+(a.attempt||1)+' 次作答');
  L.push('我的句子：'+(a.sentence||''));
  L.push('得分：'+sc+'/100');
  L.push('判定：'+(a.ok?'✅ 正确':'❌ 有错误')+'（≥85 基本掌握，<85 需要改进）');
  if((a.errors||[]).length){
    (a.errors||[]).forEach((e,j)=>{
      L.push('错误'+(j+1)+' · 哪里错了：'+e.where);
      L.push('错误'+(j+1)+' · 类型：'+(e.type||'—'));
      L.push('错误'+(j+1)+' · 为什么错：'+e.explanation);
      L.push('错误'+(j+1)+' · 正确表达：'+e.correct);
    });
    if(a.corrected) L.push('整句正确写法：'+a.corrected);
  }else{
    L.push('哪里错了：没有明显错误');
  }
  if((a.task_issues||[]).length){
    (a.task_issues||[]).forEach((e,j)=>{
      L.push('题目要求'+(j+1)+' · 未完成：'+e.where);
      L.push('题目要求'+(j+1)+' · 说明：'+e.explanation);
    });
  }
  if((a.optimizations||[]).length){
    (a.optimizations||[]).forEach((o,j)=>{
      L.push('可优化'+(j+1)+'：'+(o.suggestion||'（见说明）'));
      L.push('可优化'+(j+1)+' 说明：'+(o.reason||''));
    });
  }else{
    L.push('可优化表达：无');
  }
  return L.join('\n');
}
async function toggleMySentences(){
  const box=document.getElementById('mySentences');
  if(!box) return;
  if(box.style.display!=='none'){ box.style.display='none'; return; }
  box.style.display='block';
  box.innerHTML='<div class="sub" style="margin:0">加载中…</div>';
  try{
    const d=await api('/sentence/history');
    const items=d.items||[];
    if(!items.length){ box.innerHTML='<div class="sub" style="margin:0">还没有写过句子。</div>'; return; }
    // 按日期分组（created_at 形如 2026-09-03T...）
    const byDay={};
    items.forEach(it=>{ const day=(it.created_at||'').slice(0,10)||'未知';
      (byDay[day]=byDay[day]||[]).push(it); });
    box.innerHTML=Object.keys(byDay).sort().reverse().map(day=>{
      const rows=byDay[day].map(it=>{
        const ok=it.ok;
        const tag=ok?'<span style="color:var(--green);font-weight:700">✅</span>'
                    :'<span style="color:var(--red);font-weight:700">❌</span>';
        const w=it.word?'<span class="badge" style="background:var(--primary-bg);color:var(--primary)">'+esc(it.word)+'</span> ':'';
        return `<div style="display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid #e2e8f0">
          ${tag} ${w}<span style="font-size:13.5px">${esc(it.sentence)}</span>
          <span style="color:var(--muted);font-size:12px;margin-left:auto">${Number(it.score||0)}分</span>
        </div>`;
      }).join('');
      return `<div style="margin:10px 0"><div style="font-size:13px;font-weight:800;color:var(--muted);margin-bottom:3px">📅 ${day} · ${byDay[day].length} 句</div>${rows}</div>`;
    }).join('');
  }catch(e){ box.innerHTML='<div class="sub" style="margin:0">加载失败：'+esc(e.message)+'</div>'; }
}
function copyAllText(){
  const t=state.today||{}, pr=t.progress||{};
  const keys=planKeys().filter(k=>histOf(k).length);
  if(!keys.length) return '';
  const L=['【今日造句批改记录】',
    '日期：'+new Date().toISOString().slice(0,10),
    '进度：阶段'+pr.stage+' · W'+pr.week+' · D'+pr.day,
    '共 '+keys.length+' 题'];
  keys.forEach(tk=>{
    L.push('', '───────────────');
    histOf(tk).forEach((a,i)=>{ if(i)L.push(''); L.push(attemptCopyText(tk,a)); });
  });
  return L.join('\n');
}
function copyAll(){ copyText(copyAllText() || '', '今天还没批改过句子'); }
async function copyText(txt, emptyMsg){
  if(!txt){toast(emptyMsg||'没有可复制的内容');return false;}
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(txt); toast('已复制 ✅ 可直接粘贴给 AI 追问'); return true;
    }
    throw new Error('no-clipboard-api');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=txt; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok?'已复制 ✅ 可直接粘贴给 AI 追问':'复制失败，请长按选中文本手动复制');
    return ok;
  }
}

async function grade(){
  const r=await api('/quiz/grade',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stage:state.quiz.p.stage,week:state.quiz.p.week,answers:state.quiz.answers})});
  document.getElementById('quizres').innerHTML=`
    <div class="res ${r.passed?'good':''}">
      <div style="font-size:19px;font-weight:800">${r.correct}/${r.total} · ${r.pct}% ${r.passed?'✅ 通过':'❌ 未通过'}</div>
      <div class="sub" style="margin-top:6px">${r.passed?'可以进入下一周继续学习。':'未达 75%，先复习本周内容再测。'}</div>
      ${r.detail.filter(x=>!x.ok).slice(0,4).map(x=>`<div style="color:var(--red);font-size:13px;margin-top:4px">✗ ${esc(x.question)} → ${esc(x.options[x.correct_idx])}</div>`).join('')}
    </div>`;
  refreshProg();setTimeout(()=>pages.learn(document.getElementById('content')),1600);
}

/* ============ 进度弹窗（点顶部徽章调整，去设置页）============ */
async function openProg(){
  const ov=document.getElementById('progOverlay');
  const p=await api('/progress');
  const stages=await api('/stages');
  state.progDraft={stage:p.stage,week:p.week,day:p.day};
  ov.classList.add('show');
  document.getElementById('progSheet').innerHTML=`
    <button class="close" onclick="closeProg()">✕</button>
    <h3>🎯 调整学习进度</h3>
    <div class="sub" style="margin-top:2px">只改「当前学到哪」，历史记录都会保留。</div>

    <label>阶段</label>
    <div class="seg" id="seg_stage">${stages.map((s,i)=>{
        const parts=s.name.split('｜');
        const main=parts[0]||esc(s.name);
        const sub=parts[1]||'';
        return `<button data-v="${i}" class="${i===p.stage?'on':''}" onclick="setDraft('stage',${i})" title="${esc(s.name)}">${esc(main)}${sub?`<small>${esc(sub)}</small>`:''}</button>`;
      }).join('')}</div>

    <label>主题周 (1-12)</label>
    <div class="pickgrid" id="grid_week">${Array.from({length:12},(_,i)=>`<button data-v="${i+1}" class="${i+1===p.week?'on':''}" onclick="setDraft('week',${i+1})">W${i+1}</button>`).join('')}</div>

    <label>Day (1-7)</label>
    <div class="pickgrid" id="grid_day">${Array.from({length:7},(_,i)=>`<button data-v="${i+1}" class="${i+1===p.day?'on':''}" onclick="setDraft('day',${i+1})">D${i+1}</button>`).join('')}</div>

    <div id="progPreview" class="tagline" style="margin-top:12px"></div>
    <div class="sticky-actions"><div class="btnrow"><button class="btn" onclick="saveProg()">💾 保存并跳转</button></div></div>`;
  previewProg(p);
  ov.querySelector('#progSheet').style.animation='none';void ov.querySelector('#progSheet').offsetHeight;ov.querySelector('#progSheet').style.animation='';
}
function closeProg(){document.getElementById('progOverlay').classList.remove('show');}
function setDraft(k,v){
  state.progDraft[k]=v;
  const segmap={stage:'seg_stage',week:'grid_week',day:'grid_day'};
  const box=document.getElementById(segmap[k]);
  box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v));
  previewProg();
}
async function previewProg(){
  const d=state.progDraft||{};
  const el=document.getElementById('progPreview'); if(!el)return;
  const w=await api(`/week/${d.stage}/${d.week}`);
  const title=esc(w&&w.title||'该周暂无词汇');
  const grammar=esc(w&&w.grammar||'未设置语法');
  const hint=(w&&w.title)?'':'<br><span style="font-size:12px;color:var(--muted)">切换后若该周无内容，系统会用通用词库自动填充，也可自行导入词汇。</span>';
  el.innerHTML=`将定位到 <b>阶段${d.stage} · W${d.week} · D${d.day}</b><br>
    本周：${title} · 语法：${grammar}${hint}`;
}
async function saveProg(){
  const d=state.progDraft;
  await api('/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});
  closeProg();toast('已定位到新进度（历史保留）');refreshProg();
  render(currentPage());
}
function currentPage(){const a=document.querySelector('.bottomnav a.active');return a?a.dataset.page:'learn';}

/* ============ 错误 / 薄弱项页（独立入口）============ */
pages.errors=async function(el){
  const [errs, bank] = await Promise.all([api('/errors'), api('/error-bank')]);
  state.errs=errs; state.bank=bank;
  refreshProg();
  const active=errs.filter(e=>e.count_30d>0).length;
  el.innerHTML=`
    <h1>🎯 薄弱项 <span style="float:right;font-size:12px;color:var(--muted)">近30天有错 ${active} 类</span></h1>
    <div class="sub" style="margin-top:2px">造句中的错误会自动归类沉淀，点开看规律与补课建议。</div>

    ${bankHtml(bank)}

    ${errs.length===0?`<div class="card"><div style="font-size:15px;font-weight:700">✨ 暂无错误记录</div>
      <div class="sub" style="margin:4px 0">去「学习」页多写几句英文，系统会用本地规则帮你揪错并长期记录。</div></div>`:''}

    <div id="errlist">
      ${errs.map(w=>errRow(w)).join('')}
    </div>
    <div id="errdetail" class="card" style="display:none"></div>`;
};
/* 错题本：只有明确错误才进；第一次的记录永久保留，写对了只标「已改正」，不删除 */
function bankHtml(bank){
  const items=(bank&&bank.items)||[];
  if(!items.length) return `<div class="card" style="border:1.5px solid var(--red)">
    <div style="font-size:15px;font-weight:700">📕 错题本 · 暂无错题</div>
    <div class="sub" style="margin:4px 0">写对了的句子<b>不会</b>进这里（即便给了优化建议）；只有明确的语法/用法错误才会自动记录。</div></div>`;
  const g={};
  items.forEach(x=>{const k=x.word||'（其他）';(g[k]=g[k]||[]).push(x);});
  const fmt=t=>(t||'').slice(0,16).replace('T',' ');
  return `<div class="card" style="border:1.5px solid var(--red)">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px">
      <h2 style="margin:0">📕 错题本</h2>
      <span class="badge" style="background:#fee2e2;color:#b91c1c">未改正 ${bank.unfixed} · 共 ${bank.total}</span>
    </div>
    <div class="sub" style="margin-top:2px">第一次犯的错<b>永久保留</b>；后来这个词写对了只标记「已改正」，历史记录不会消失。</div>
    ${Object.keys(g).map(w=>`
      <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="font-size:14px;font-weight:800">${esc(w)}</div>
        ${g[w].map(x=>`
          <div style="background:${x.fixed?'#f0fdf4':'#fef2f2'};border:1px solid ${x.fixed?'#bbf7d0':'#fecaca'};border-radius:9px;padding:8px 10px;margin:6px 0">
            <div style="font-size:13px;color:#475569;line-height:1.5">✗ 我写的：${esc(x.sentence_text||x.original)}</div>
            <div style="font-size:13.5px;margin-top:3px">❌ 错误：<b style="color:var(--red)">${esc(x.error_text||x.original)}</b>
              <span class="errtype" style="margin-left:4px">${esc(x.error_type)}</span>
              ${x.fixed?'<span class="badge" style="background:#dcfce7;color:var(--green);margin-left:4px">已改正</span>':''}</div>
            <div style="font-size:13px;color:#475569;margin-top:3px;line-height:1.5">💡 为什么错：${esc(x.explanation)}</div>
            <div style="font-size:13px;margin-top:3px;line-height:1.5">✅ 正确：<b style="color:var(--green)">${esc(x.corrected)}</b></div>
            <div style="font-size:12px;color:var(--muted);margin-top:3px">首次错误 ${esc(fmt(x.first_at))} · 出现 ${x.times} 次${x.times>1?' · 最近 '+esc(fmt(x.last_at)):''}${x.fixed?' · 改正于 '+esc(fmt(x.fixed_at)):''}</div>
          </div>`).join('')}
      </div>`).join('')}
  </div>`;
}
function errRow(w){
  const col=w.level==='🔴'?'var(--red)':(w.level==='🟡'?'var(--amber)':'var(--muted)');
  return `<div class="word" style="border-left:5px solid ${col}" data-act="openErr" data-val="${esc(w.type)}">
    <div><div class="en">${w.level} ${esc(w.type)}</div>
      <div style="font-size:12px;color:var(--muted)">近30天 ${w.count_30d} 次 · 累计 ${w.total} 次</div></div>
    <div style="font-weight:800;color:${col}">${w.count_30d}次</div></div>`;
}
async function openErr(type){
  const list=document.getElementById('errlist');
  const detail=document.getElementById('errdetail');
  // 若已展开且同类型则收起
  if(detail.dataset.type===type){detail.style.display='none';detail.innerHTML='';detail.dataset.type='';return;}
  detail.dataset.type=type;detail.style.display='block';
  const d=await api('/errors/'+encodeURIComponent(type));
  detail.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>${type}</h2>
      <button class="btn ghost sm" onclick="collapseErr()">收起</button>
    </div>
    <div style="display:flex;gap:8px;margin:8px 0">
      <span class="pill-mini">近7天 <b>${d.count_7d}</b></span>
      <span class="pill-mini">累计 <b>${d.total}</b></span>
    </div>

    ${d.patterns&&d.patterns.length?`<div class="sub" style="margin-top:4px;font-weight:700">📈 高频错误规律</div>
      ${d.patterns.map(p=>`<div style="font-size:13.5px;color:#475569;background:#f8fafc;border:1px dashed var(--border);border-radius:9px;padding:7px 11px;margin:5px 0">
        ✗ <b style="color:var(--red)">${esc(p.wrong)}</b> <span style="color:var(--muted)">· 出现 ${p.times} 次</span></div>`).join('')}`
      :'<div class="sub" style="margin:6px 0">暂无足够规律数据。</div>'}

    ${d.remedy?`<div class="res" style="background:#f0fdf4;border-color:#bbf7d0;margin:8px 0">
        <b style="color:var(--green)">💡 建议补课</b><div style="color:#475569;font-size:13.5px;margin-top:4px">${esc(d.remedy)}</div></div>`:''}

    <div class="sub" style="margin-top:8px;font-weight:700">🕓 最近错误</div>
    ${d.items.slice(0,14).map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="color:#475569;font-size:13.5px">✗ ${esc(x.original)}</div>
      <div style="color:var(--green);font-size:13.5px">✓ ${esc(x.corrected)}</div>
      ${x.explanation?`<div class="sub" style="margin-top:2px">${esc(x.explanation)}</div>`:''}
    </div>`).join('')}
    ${d.items.length===0?'<div class="sub" style="margin:4px 0">该类型暂无明细。</div>':''}`;
}
function collapseErr(){const d=document.getElementById('errdetail');d.style.display='none';d.innerHTML='';d.dataset.type='';}

async function render(page){const el=document.getElementById('content');if(pages[page])await pages[page](el);}
render('learn');
</script>
</body>
</html>
