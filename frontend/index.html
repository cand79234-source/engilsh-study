<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>English OS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --border:#e8ecf4; --text:#1e293b; --muted:#7c8698;
  --primary:#4f46e5; --primary2:#6366f1; --primary-bg:#eef2ff;
  --green:#16a34a; --green-bg:#f0fdf4; --red:#dc2626; --amber:#d97706;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
h1{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}

/* 顶部 */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50}
.brand{font-weight:800;font-size:17px;color:var(--primary)}
.prog-pill{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.prog-pill:active{opacity:.7}

/* 内容 */
.content{padding:66px 14px calc(var(--nav-h) + 24px);max-width:620px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.badge{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.fold-ic{margin-left:auto;cursor:pointer;color:var(--muted);font-size:14px;user-select:none;padding:2px 6px;flex-shrink:0}
.fold-ic:active{opacity:.6}
.starcs{color:#f59e0b;font-size:12px;letter-spacing:1px;white-space:nowrap}

/* 按钮 */
.btn{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.green{background:var(--green)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1;text-align:center;min-width:100px}

/* 进度 */
.progressbar{height:9px;background:var(--border);border-radius:20px;overflow:hidden;margin:8px 0 4px}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px;transition:.3s}
.metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.metric b{color:var(--text)}

/* 词汇 */
.word{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--border);
  border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.word:active{background:var(--primary-bg)}
.word .en{font-weight:700;font-size:15px}
.word .cn{color:var(--muted);font-size:12.5px}
.word .ph{color:var(--muted);font-weight:500;font-size:12px;margin-left:5px}
.word.done{background:var(--green-bg);border-color:#bbf7d0}
.word.done .en{color:var(--green)}
.word.open{border-color:var(--primary);background:var(--primary-bg)}
[data-q].train-ok{border-left:4px solid var(--green);background:var(--green-bg)}
[data-q].train-bad{border-left:4px solid var(--red);background:#fef2f2}
[data-q].train-neutral{border-left:4px solid var(--amber);background:#fffbeb}
.detail{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:13px;margin:-2px 0 10px;font-size:14px}
.detail .row{margin:4px 0}
.detail .lbl{color:var(--muted);font-size:12px}
.colloc{background:#e0e7ff;color:var(--primary);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:800;display:inline-block;margin:3px 6px 3px 0;cursor:pointer;user-select:none;border:1px solid #cdd6f6}
.colloc:active{background:var(--primary);color:#fff;transform:scale(.96)}
.hl{color:var(--primary);font-weight:800;background:transparent}
.tk{cursor:pointer;border-bottom:1px dotted rgba(59,130,246,.4)}
.tk:active{background:var(--primary-bg)}
.detail .row.exrow .tran .hl{background:none}
.detail .row.exrow{margin:9px 0 0;padding-top:8px;border-top:1px dashed #e0e7ff}
.exrow .tran{margin-left:0}
.tran{color:var(--green);font-size:12.5px;margin-top:3px;line-height:1.5}

/* 造句 */
.sinput{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;margin-top:6px}
.sinput:focus{outline:none;border-color:var(--primary)}
.sitem{margin-bottom:15px}
.sq{font-size:13.5px;font-weight:600;margin:6px 0 2px}
.res{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:11px;margin-top:8px;font-size:13.5px}
.res.good{background:var(--green-bg);border-color:#bbf7d0}
.errtype{display:inline-block;background:#fee2e2;color:var(--red);border-radius:7px;padding:1px 9px;font-size:12px;margin-top:7px;font-weight:600}
.spk{cursor:pointer;font-size:16px;user-select:none;line-height:1;display:inline-flex}
.spk:active{transform:scale(.9)}

/* 复习 */
.rev{padding:12px 0}
.rev .prompt{font-size:15px;font-weight:600;margin-bottom:9px;line-height:1.5}
.revb{display:flex;gap:9px;margin-top:9px}
.revb .btn{flex:1}
.ansbox{color:var(--muted);font-size:13px;margin-top:8px}
.optb{border:1.5px solid var(--border);background:#fff;padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;margin:0 5px 6px 0;min-width:56px}
.optb:active{opacity:.8}

/* 设置 */
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{font-family:monospace;font-size:13px;min-height:110px;line-height:1.6}
.stepper{display:flex;align-items:center;gap:7px}
.stepper button{width:42px;height:42px;flex-shrink:0;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:10px;font-size:20px;cursor:pointer}
.stepper input{text-align:center}
.tagline{font-size:12.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:9px;padding:8px 11px;margin:6px 0}

/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.bottomnav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;cursor:pointer}
.bottomnav a .ico{font-size:22px;line-height:1}
.bottomnav a span:not(.ico){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bottomnav a.active{color:var(--primary)}
/* 6 个 tab 在窄屏（≤400px）收紧字号与图标，避免文字被挤断行 */
@media (max-width:400px){
  .bottomnav a{font-size:10px;gap:0;padding:0 1px}
  .bottomnav a .ico{font-size:19px}
}

/* 弹窗 / 进度调整 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:90}
.overlay.show{display:flex}
.sheet{width:100%;max-width:620px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:2px}
.sheet .close{float:right;border:none;background:#f1f5f9;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer}
#seg_stage{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}
#seg_stage button{border:1.5px solid var(--border);background:#fff;padding:7px 8px;border-radius:9px;font-size:12.5px;cursor:pointer;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seg_stage button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
#seg_stage button small{display:block;font-size:9.5px;font-weight:400;opacity:.8}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.sticky-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;margin:0 -16px calc(-16px - env(safe-area-inset-bottom));
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:2}
.pickgrid button{border:1.5px solid var(--border);background:#fff;padding:9px 0;border-radius:9px;font-size:13px;cursor:pointer;text-align:center}
.pickgrid button.on{background:var(--primary-bg);color:var(--primary);border-color:var(--primary);font-weight:700}
.errcount{font-size:12px;font-weight:700;background:#fee2e2;color:var(--red);border-radius:20px;padding:2px 8px}
.pill-mini{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}

/* 总结页 */
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;line-height:1.6;padding:2px 0}
.sumrow b{font-weight:800;color:var(--text)}
.sumrow .srl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumrow .srr{flex-shrink:0;margin-left:8px;color:var(--muted)}
.trendnote{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:2px 0 7px}
.codebox{width:100%;min-height:130px;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;
  font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55;
  background:#f8fafc;color:var(--text);resize:vertical}
.codebox:focus{outline:none;border-color:var(--primary)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">English OS</div>
  <button class="prog-pill" id="topProg" onclick="openProg()">阶段0 · W1 · D1</button>
</div>
<main class="content" id="content"></main>
<div class="bottomnav">
  <a data-page="learn" class="active"><span class="ico">📖</span><span>学习</span></a>
  <a data-page="listen"><span class="ico">🎧</span><span>听力</span></a>
  <a data-page="review"><span class="ico">🔁</span><span>复习</span></a>
  <a data-page="errors"><span class="ico">🎯</span><span>薄弱项</span></a>
  <a data-page="sum"><span class="ico">📊</span><span>总结</span></a>
</div>
<!-- 进度调整弹窗 -->
<div class="overlay" id="progOverlay" onclick="if(event.target===this)closeProg()">
  <div class="sheet" id="progSheet"></div>
</div>
<script>
/* ---------- API 封装：自动带 X-Auth-Token + 401 弹输入框 ----------
   部署在公网时，Render 控制台设了 EOS_TOKEN 之后所有 /api/* 都要口令。
   这个 wrapper 帮我们：
   1) 默认从 localStorage 取 eos_token，自动加到 X-Auth-Token 请求头
   2) 收到 401 时弹一个输入框，让用户填口令，存回 localStorage 后自动重试
   3) 本地模式（服务端未设 EOS_TOKEN）下永远不弹框，所有响应是 200
   口令本身永远不会出现在代码或 git 里——用户首次访问时自己输入并存在浏览器。
   ----------------------------------------------------------------- */
const EOS_TOKEN_KEY = 'eos_token';

function getEosToken() {
  try { return localStorage.getItem(EOS_TOKEN_KEY) || ''; } catch (_) { return ''; }
}
function setEosToken(t) {
  try {
    if (t) localStorage.setItem(EOS_TOKEN_KEY, t);
    else localStorage.removeItem(EOS_TOKEN_KEY);
  } catch (_) {}
}

function promptEosToken() {
  // 单输入框；空 = 取消
  const v = window.prompt('请输入访问口令（EOS_TOKEN）：', '');
  return (v == null) ? null : v.trim();
}

async function apiRaw(p, opt) {
  // 真正的 fetch：带 token、透传 opt
  const headers = Object.assign({}, (opt && opt.headers) || {});
  const tok = getEosToken();
  if (tok && !headers['X-Auth-Token'] && !headers['x-auth-token']
            && !headers['Authorization'] && !headers['authorization']) {
    headers['X-Auth-Token'] = tok;
  }
  const finalOpt = Object.assign({}, opt || {}, { headers });
  const r = await fetch('/api' + p, finalOpt);
  return r;
}

async function api(p, opt) {
  let r = await apiRaw(p, opt);
  if (r.status !== 401) return r.json();
  // 401：先清掉旧 token（可能输错了），再问一次
  setEosToken('');
  const v = promptEosToken();
  if (!v) {
    // 用户取消：把 401 原文透出
    let body = null;
    try { body = await r.json(); } catch (_) {}
    return body || { ok: false, error: '未授权：缺少访问口令（EOS_TOKEN）。' };
  }
  setEosToken(v);
  r = await apiRaw(p, opt);
  if (r.status === 401) {
    setEosToken('');  // 还是错的，清掉
    let body = null;
    try { body = await r.json(); } catch (_) {}
    return body || { ok: false, error: '访问口令错误。' };
  }
  return r.json();
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

/* 统一事件委托：凡是参数来自用户导入内容（单词/搭配/例句）的点击，
   一律用 data-act + data-val 而非内联 onclick。
   原因：HTML 转义救不了内联 JS——onclick="speak('I'm ...')" 里的撇号会直接破坏 JS 语法，
   而英语里 I'm / don't / it's 遍地都是。data-* 属性不会被执行，取值后才调用。 */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const v = el.getAttribute('data-val');
  if (act === 'speak') { e.stopPropagation(); speak(v); }
  else if (act === 'toggleW') toggleW(v);
  else if (act === 'master') master(v);
  else if (act === 'openErr') openErr(v);
  else if (act === 'wlookup') wordLookup(v);
  if (act === 'showColloc') showColloc(v, el.getAttribute('data-val2') || '');
  else if (act === 'check') submitSentence(v);
  else if (act === 'redo') redoSentence(v);
  else if (act === 'copyOne') copyOne(v, el.getAttribute('data-val2') || '');
  else if (act === 'copyAll') copyAll();
  else if (act === 'mySentences') toggleMySentences();
  else if (act === 'revFlash') startFlashcard();
  else if (act === 'revFlip') { state.revFlipped=!state.revFlipped;
    renderFlashcard(document.getElementById('content')); }
  else if (act === 'revGrade') gradeFlash(parseInt(v,10));
  else if (act === 'revExit') { state.revMode='home'; render('review'); }
  else if (act === 'listenPlay' || act === 'listenPlaySlow'){
    const wrap=el.closest('[data-listen]');
    const s=wrap?wrap.getAttribute('data-sentence'):'';
    if(!s){ toast('暂无可播放内容'); return; }
    listenSpeak(s, act==='listenPlaySlow'?0.6:1);
  }
  else if (act === 'listenReveal'){
    const wrap=el.closest('[data-listen]');
    const rev=document.getElementById('lrev_'+v);
    if(rev){
      const showing=rev.style.display!=='none';
      rev.style.display=showing?'none':'';
      if(!showing){ rev.textContent=wrap?(wrap.getAttribute('data-sentence')||''):''; rev.style.color='var(--text)'; }
    }
  }
  else if (act === 'revWeak') { state.revMode='weak'; render('review'); }
  else if (act === 'revAll') { state.revMode='all'; render('review'); }
  else if (act === 'revTrain') { state.revMode='train'; render('review'); }
  else if (act === 'sumTab') { state.sumTab=v; render('sum'); }
  else if (act === 'copySummaryReport') copySummaryReport();
  else if (act === 'copyWeakReport') { copyErrorReport(); }
  else if (act === 'trainCopyDiag') { copyText(_tpl('tplPromptDiag'),'提示词未加载'); }
  else if (act === 'trainCopyTrain') { copyText(_tpl('tplPromptTrain'),'提示词未加载'); }
  else if (act === 'trainParse') { trainImport(); }
  else if (act === 'trainClear') { trainClear(); }
  else if (act === 'tOpt') { trainPick(el); }
  else if (act === 'tSubmit') { trainSubmitQ(el); }
  else if (act === 'listenSubmit') { listenSubmit(el); }
  else if (act === 'learnFold') { const box=document.getElementById(v); if(box){ box.style.display = box.style.display==='none'?'':'none'; if(el) el.textContent = box.style.display==='none'?'▸':'▾'; } }
});
function startFlashcard(){
  state.revMode='flash'; state.revIdx=0; state.revFlipped=false; state.revLog=[];
  // 本次会话快照：复习中的卡片会因到期时间推后而离开队列，
  // 若每步都取实时数据，最后一张做完会被误判成「没有到期卡」而跳回首页，
  // 导致永远看不到完成页。
  state.revItems=(state.revDue||[]).slice();
  render('review');
}
function toast(m){const t=document.createElement('div');t.textContent=m;
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;z-index:99;opacity:0;transition:.25s';
  document.body.appendChild(t);requestAnimationFrame(()=>t.style.opacity=1);
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),250);},2000);}
const state={ folds:{sentences:false, upgrades:false, combos:false} }; const pages={};
document.querySelectorAll('.bottomnav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('.bottomnav a').forEach(x=>x.classList.remove('active'));
  a.classList.add('active'); render(a.dataset.page); window.scrollTo(0,0);});
async function refreshProg(){try{const p=await api('/progress');
  document.getElementById('topProg').textContent=`阶段${p.stage} · W${p.week} · D${p.day}`;}catch(e){}}
function go(page){document.querySelectorAll('.bottomnav a').forEach(x=>x.classList.remove('active'));
  document.querySelector(`.bottomnav a[data-page=${page}]`).classList.add('active');render(page);window.scrollTo(0,0);}

/* ============ 学习页：今天学什么 + 本周词 + 造句 + 周测 ============ */
pages.learn=async function(el){
  const [d,t] = await Promise.all([api('/home'), api('/today')]);
  state.learn={d,t}; state.today=t;
  const p=d.progress;
  const vp=Math.round(d.today.vocab_done/d.today.vocab_total*100);
  const sp=Math.min(d.today.sentence_done,10);
  document.getElementById('topProg').textContent=`阶段${p.stage} · W${p.week} · D${p.day}`;
  el.innerHTML=`
  <div class="card" style="border:1.5px solid var(--primary)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>今日 · Week${p.week}「${d.week_title}」</h2>
      <span class="badge">${d.week_vocab_count}词/周</span>
    </div>
    <div class="sub" style="margin-top:2px">语法重点：${d.week_grammar||'（未设置）'}　·　Day ${p.day}</div>
    <div class="metric"><span>今日词汇</span><b>${d.today.vocab_done}/${d.today.vocab_total}</b></div>
    <div class="progressbar"><div style="width:${vp}%"></div></div>
    <div class="metric"><span>今日造句</span><b>${sp}/10</b></div>
    <div class="progressbar"><div style="width:${sp*10}%"></div></div>
  </div>

  ${t.is_rest_day?`
  <div class="card" style="background:#ecfdf5;border-color:#a7f3d0">
    <h2>😌 Day7 · 休息日</h2>
    <div class="sub" style="margin-top:4px">今天不学新词。你可以：<b>做本周周测</b>、翻翻这周造过的句子，或者直接休息。</div>
    <div class="btnrow" style="margin-top:8px">

/* 例句内固定搭配高亮：把例句中出现的搭配词组（含变体词形）加粗 */
function _norm(w){
  // 轻量词形归一：小写 + 去常见后缀，用于比较词根
  if(!w)return '';
  w=String(w).toLowerCase();
  if(w.length<=3)return w;
  if(/[^a-z]/.test(w))return w.replace(/[^a-z]/g,'');
  let r=w;
  // 不规则高频
  const irr={went:'go',gone:'go',been:'be',were:'be',had:'have',made:'make',did:'do',said:'say',
             saw:'see',took:'take',got:'get',gave:'give',found:'find',felt:'feel',knew:'know',
             taught:'teach',bought:'buy',thought:'think',spoke:'speak',wrote:'write',came:'come',
             became:'become',began:'begin',built:'build',caught:'catch',chose:'choose',drove:'drive',
             grew:'grow',heard:'hear',kept:'keep',left:'leave',met:'meet',paid:'pay',put:'put',
             ran:'run',sent:'send',sat:'sit',stood:'stand',told:'tell',understood:'understand',won:'win'};
  if(irr[r])return irr[r];
  // 去词缀：-ing/-ed/-d/-es/-s/-ies
  if(r.endsWith('ing')){const b=r.slice(0,-3);if(b.endsWith('e'))return b;return b;} // come->coming→com? 近似用 b
  if(r.endsWith('ied'))return r.slice(0,-3)+'y';
  if(r.endsWith('ed'))return r.slice(0,-2);
  if(r.endsWith('d'))return r.slice(0,-1);
  if(r.endsWith('ies'))return r.slice(0,-3)+'y';
  if(r.endsWith('es'))return r.slice(0,-2);
  if(r.endsWith('s'))return r.slice(0,-1);
  return r;
}
const _SKIP=['a','an','the'];   // 退化匹配时排除的纯冠词
function hlColloc(sentence, phrases){
  if(!sentence)return esc(sentence||'');
  if(!phrases||!phrases.length)return esc(sentence);
  // 把原文切块：字 + 分隔
  const segs=[]; // {txt:词原文, w:归一后的词|null}
  let m;
  const re=/([A-Za-z][A-Za-z'’-]*)|([^A-Za-z]+)/g;
  while((m=re.exec(sentence))!==null){
    if(m[1])segs.push({txt:m[1], w:_norm(m[1])});
    else segs.push({txt:m[0], w:null});
  }
  const marked=new Array(segs.length).fill(false);
  function tryMatch(pWords){
    // 滑动窗口：例句某起点起，依次匹配目标词（跳过标点），全部命中则标记
    for(let s=0;s<segs.length;s++){
      if(segs[s].w==null)continue;
      let j=0, hit=true, pidx=[];
      for(let i=s;i<segs.length&&j<pWords.length;i++){
        if(segs[i].w==null)continue;           // 跳过标点/空格
        if(segs[i].w===pWords[j]){pidx.push(i);j++;}
        else { hit=false; break; }             // 必须连续命中
      }
      if(hit&&j===pWords.length){ for(const k of pidx)marked[k]=true; return true; }
    }
    return false;
  }
  for(const ph of phrases){
    const words=String(ph).split(/\s+/).map(x=>x.replace(/[«»「」]/g,'')).filter(Boolean).map(_norm).filter(Boolean);
    if(!words.length)continue;
    // 完整顺序匹配（变体已由 _norm 拉平）
    tryMatch(words);
  }
  // 若完整词组未连续出现，退化为只标该搭配里最长的那个实词（通常是核心名词/动词），
  // 避免把句子里所有沾边的介词/通用动词都标粗。每搭配至多补一组。
  const _STOP=/^(a|an|the|for|of|in|on|at|to|with|from|by|be|is|are|was|were|and|or|as|do|does|did)$/;
  for(const ph of phrases){
    const ws=String(ph).split(/\s+/).map(x=>x.replace(/[«»「」]/g,'')).filter(Boolean).map(_norm);
    // 从长到短取候选（实词），先试最长的那个
    const cand=ws.filter(w=>w&&!_STOP.test(w)).sort((a,b)=>b.length-a.length);
    if(!cand.length)continue;
    let done=false;
    for(const c of cand){
      // 找例句中第一个未标记的该词
      for(let i=0;i<segs.length;i++){
        if(!marked[i]&&segs[i].w===c&&segs[i].txt.length>=3){marked[i]=true;done=true;break;}
      }
      if(done)break;
    }
  }
  // 拼接：每个英文词包成可点 span（欧陆式点词查义），搭配词组保持加粗
  let out='';
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(s.w!=null){
      const inner = marked[i] ? '<b class="hl">'+esc(s.txt)+'</b>' : esc(s.txt);
      out += '<span class="tk" data-act="wlookup" data-val="'+esc(s.txt.toLowerCase())+'">'+inner+'</span>';
    } else {
      out += esc(s.txt);
    }
  }
  return out;
}

  try{
    const r=await api('/dict/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word})});

    body.innerHTML=`<div style="font-size:15px;line-height:1.7;margin-top:4px">${pos}${ph}${esc(r.meaning)||'（无释义）'}</div>`;
  }catch(e){
    const body=ov.querySelector('#wlookup_body'); if(body)body.textContent='查询失败，请重试';
  }
}

async function uploadImportFile(f){

  const ta=document.getElementById('imp_rich');

  const old=btn?btn.textContent:'';

    const fd=new FormData();fd.append('file',f);
    const r=await api('/file/extract',{method:'POST',body:fd});

      if(box)box.innerHTML=`<div class="res" style="background:#fee2e2;border-color:#fecaca;color:var(--red)">📄 ${esc(f.name)}：${esc(r.error||'提取失败')}</div>`;

      📄 已读取「${esc(f.name)}」（${esc(r.format)} · ${r.lines} 行）${warnTxt}<br>

    toast(`文件已提取：${r.lines} 行`);

    if(box)box.innerHTML=`<div class="res" style="background:#fee2e2;border-color:#fecaca;color:var(--red)">上传失败：${esc(e.message)}</div>`;
  }finally{
    if(btn){btn.textContent=old;btn.disabled=false;}
    const inp=document.getElementById('imp_file');if(inp)inp.value='';
  }
}

  }
  let dayTxt=(r.day_counts?Object.keys(r.day_counts).map(k=>`D${k}:${r.day_counts[k]}词`).join(' '):'');
  let w=[]; if(r.warnings&&r.warnings.length) w.push(`⚠️ ${r.warnings.length}条提示：${esc(r.warnings.join('；'))}`);
  if(r.skipped&&r.skipped.length) w.push(`自动跳过了 ${r.skipped.length} 行说明/注释文字。`);
  box.innerHTML=`<div class="res good">
      <b>✅ 已合并到 第${r.week}周「${esc(r.title||'未命名')}」</b><br>
      <span style="color:var(--muted)">本次：${dayTxt?dayTxt:'若干词'} · 当前周共 ${r.total} 词 / ${r.days} 天</span><br>
      <span style="color:var(--muted)">词库新增 ${r.added_new} · 自带例句 ${r.added_examples} · 固定搭配 ${r.added_collocations||0} · 自动补例句 ${r.autogen}</span>
      ${w.length?('<br><span style="color:var(--amber);font-size:13px">'+w.join('<br>')+'</span>'):''}
    </div>`;
  toast(`已合并到第${r.week}周，当前共 ${r.total} 词 / ${r.days} 天`);
  btn.textContent='✅ 完成，点击关闭';
  btn.disabled=false;
  // 仅当导入到非当前周才询问跳转；否则直接刷新当前学习页
  const cur=state.learn.d.progress;
  setTimeout(()=>{
    if(r.week!==cur.week){
      if(confirm(`已导入到第 ${r.week} 周。现在跳到第 ${r.week} 周开始学习吗？`)){
        document.querySelector('.overlay')&&document.querySelector('.overlay').remove();
        setProgressAndGo(r.week);
      }
    } else {
      pages.learn(document.getElementById('content'));
      document.querySelector('.overlay')&&document.querySelector('.overlay').remove();
    }
  }, 400);
}
function setProgressAndGo(week){
  // 保存进度到该周 Day1，并回学习页
  api('/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stage:0,week,day:1})}).then(()=>{refreshProg();render('learn');});
}
// 离线发音：浏览器本地 TTS（优先选本机已下载的英文语音，无需联网/无外部服务）
let _voices=[], _voice=null, _voiceReady=false;
function _enVoices(vs){
  return (vs||[]).filter(v=>/^en/i.test(v.lang||''));
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  let vs=[];
  try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return; }
  // 语音列表还没异步加载好：保持原状，等 onvoiceschanged / 定时轮询
  if(!vs.length) return;
  _voices=vs; _voiceReady=true;
  const en=_enVoices(vs);
  // 优先：本机离线可用(localService=true，非联网合成)的美/英音；其次 google；最后任意英文
  const usuk=en.filter(v=>/en(-|_)?(US|GB|UK)/i.test(v.lang));
  _voice=(usuk.find(v=>v.localService)||en.find(v=>v.localService))
      ||usuk.find(v=>/google/i.test(v.name))
      ||usuk[0]||en[0]||null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
  // 部分浏览器/微信内核首次 getVoices() 返回空，需要反复触发才会填充
  let _vt=0;
  const _vi=setInterval(()=>{pickVoice(); if(_voiceReady||(++_vt>12)) clearInterval(_vi);},250);
}
function hasEnglishVoice(){
  if(!('speechSynthesis' in window)) return false;
  try{
    const vs=speechSynthesis.getVoices();
    if(vs&&vs.length) return _enVoices(vs).length>0;
    return !!_enVoices(_voices).length;
  }catch(e){return !!_enVoices(_voices).length;}
}
function speak(text){
  if(!text)return;
  const ss=window.speechSynthesis;
  if(!ss){toast('当前浏览器不支持语音朗读，建议换用 Chrome / Safari 打开');return;}
  // 每次同步刷新一次语音列表（voices 常是异步就绪的）。
  // 注意：这里绝不能 await，否则 iOS 会因"不在用户手势同步栈内"而拒绝发声。
  try{ pickVoice(); }catch(e){}
  try{ ss.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.92; u.pitch=1;
  // 拿得到英文语音就用它；拿不到就不设 voice，交给浏览器默认语音兜底
  // （旧版在这里"检测不到英文语音就 return"，导致大量手机点了没反应）
  if(_voice) u.voice=_voice;
  try{ ss.resume(); }catch(e){}

  let started=false;
  u.onstart=()=>{started=true;};
  u.onerror=(e)=>{
    const err=(e&&e.error)||'';
    if(err==='not-allowed'){
      toast('系统不允许朗读：检查手机是否处于静音、浏览器是否禁用了语音');
    }else if(err==='language-unavailable'||err==='voice-unavailable'){
      toast('设备缺少英文语音包，请在系统“设置→语言和语音”里下载英语语音后重试');
    }else if(err==='interrupted'||err==='canceled'){
      // 用户自己打断，不提示
    }else if(err){
      toast('朗读失败（'+err+'），建议换用系统浏览器打开');
    }else{
      toast('朗读失败，建议换用 Chrome / Safari 打开');
    }
  };
  try{ ss.speak(u); }catch(e){ toast('朗读失败：'+(e&&e.message||e)); return; }

  // Chrome 已知 bug：paused 状态下不发声，补一次 resume
  setTimeout(()=>{ try{ if(ss.paused) ss.resume(); }catch(e){} },150);
  // 兜底：说不出来且没有任何事件（多见于微信内核不支持 TTS），给可操作提示
  setTimeout(()=>{
    if(started) return;
    try{
      if(!ss.speaking && !ss.pending && !hasEnglishVoice()){
        toast('这个浏览器可能不支持朗读，建议用系统浏览器（Safari/Chrome）打开本页');
      }
    }catch(e){}
  },1200);
}

/* ---- 造句：三段式（①每词一句 ②5句升级 ③10组组合）---- */
function planOf(t){ return t.sentence_plan || {basic:[],upgrade:[],combo:[],meta:{}}; }
function setTxt(id,txt){const e=document.getElementById(id);if(e)e.textContent=txt;}

/* 题目标识：basic:i / up:i / combo:i。当天唯一，用来串起「同一题的多次作答」。 */
function planKeys(){
  const p=planOf(state.today);
  return [].concat(
    p.basic.map((_,i)=>'basic:'+i),
    (p.upgrade||[]).map((_,i)=>'up:'+i),
    (p.combo||[]).map((_,i)=>'combo:'+i));
}
function histOf(tk){ return ((state.hist||{})[tk]) || []; }
function doneCount(prefix,total){let n=0;for(let i=0;i<total;i++){if(histOf(prefix+':'+i).length)n++;}return n;}
function planProgress(){
  const p=planOf(state.today);
  setTxt('basicProg',`${doneCount('basic',p.basic.length)}/${p.basic.length}`);
  setTxt('upProg',`${doneCount('up',(p.upgrade||[]).length)}/${(p.upgrade||[]).length}`);
  setTxt('comboProg',`${doneCount('combo',(p.combo||[]).length)}/${(p.combo||[]).length}`);
  const b=document.getElementById('copyAllBtn');
  if(b) b.textContent=`📋 复制全部（${planKeys().filter(k=>histOf(k).length).length} 题）`;
}

/* 刷新页面后回填历史：每次作答都留在库里，第 1 次第 2 次互不影响 */
async function loadAttempts(){
  try{
    const d=await api('/sentence/attempts');
    state.hist={};
    (d.groups||[]).forEach(g=>{state.hist[g.task_key]=g.attempts||[];});
  }catch(e){ state.hist=state.hist||{}; }
}

async function renderSentencePlan(t){
  const p=planOf(t);
  await loadAttempts();
  state.tkMeta={};
  const g=(t&&t.grammar)||'';   // 本周语法要求（如「一般现在时、频率副词」），随批改一起传给后端

  // ③ 造句五星：拉取每个词的五星熟练度，用于渲染 ★ 徽章（未记录则不显示）
  const _words=[...p.basic.map(b=>b.word), ...(p.upgrade||[]).map(u=>u.word),
    ...(p.combo||[]).flatMap(c=>(c.words||[]).map(w=>w.word))].filter(Boolean);
  try{
    const _sm=await api('/output/stars',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({words:_words})});
    state.starMap=(_sm&&_sm.stars)||{};
  }catch(e){ state.starMap={}; }

  // ① 基础：每词一句
  document.getElementById('sentences').innerHTML=p.basic.map((b,i)=>{
    const tk='basic:'+i;
    state.tkMeta[tk]={word:b.word||'', task:b.task||'', label:b.task||'', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${b.i}. ${esc(b.task)}${starBadge(b.word)}${b.focus?' <span class="badge" style="background:#fef3c7;color:#92400e">★重点</span>':''}</div>`,
      '写一个英文句子…', false);
  }).join('') || '<div class="sub">今天没有新词。</div>';

  // ② 升级：给方向 + 示范句
  document.getElementById('upgrades').innerHTML=(p.upgrade||[]).map((u,i)=>{
    const tk='up:'+i;
    state.tkMeta[tk]={word:u.word||'', task:u.task||'', label:'升级「'+(u.word||'')+'」', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${u.i}. 升级「<b>${esc(u.word)}</b>${starBadge(u.word)}${u.meaning?'（'+esc(u.meaning)+'）':''}」
        <span class="badge" style="background:#fef3c7;color:#92400e">${esc(u.direction)}</span>
        ${u.is_review?'<span class="badge" style="background:#fee2e2;color:#b91c1c">复习词</span>':''}</div>
      <div class="sub" style="margin:4px 0">${esc(u.direction_desc)}</div>
      <div class="sub" style="margin:4px 0;color:var(--muted)">示范：${esc(u.sample)}</div>
      ${u.collocation?`<div class="sub" style="margin:4px 0">可用搭配：<b>${esc(u.collocation)}</b></div>`:''}`,
      '把第①段的句子改得更自然…', false);
  }).join('') || '<div class="sub">今天的词还够不上升级，先把基础句写完。</div>';

  // ③ 组合：2-3 个词写成连续表达
  document.getElementById('combos').innerHTML=(p.combo||[]).map((c,i)=>{
    const tk='combo:'+i;
    state.tkMeta[tk]={word:(c.words||[]).map(w=>w.word).join(' '), task:c.scene||'', label:c.scene||'', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${c.i}. ${esc(c.scene)}</div>
      <div class="sub" style="margin:4px 0">${(c.words||[]).map(w=>`<span class="badge" style="background:${w.review?'#fee2e2;color:#b91c1c':'var(--primary-bg);color:var(--primary)'}">${esc(w.word)}${starBadge(w.word)}${w.meaning?'·'+esc(w.meaning):''}${w.review?' 🔁':''}</span>`).join(' ')}</div>
      <div class="sub" style="margin:4px 0;color:var(--muted)">${esc(c.hint||'建议 2-3 句，写多写少随意，不强制。')}</div>`,
      '写 2-3 句连续表达（写多写少随意）…', true);
  }).join('') || '<div class="sub">今天没有可组合的词。</div>';

  planKeys().forEach(tk=>renderAttempts(tk));
  planProgress();
}

function starBadge(w){
  const s=state.starMap?state.starMap[(w||'').toLowerCase()]:undefined;
  if(s===undefined) return '';
  return ` <span class="starcs" title="主动输出熟练度 ${s}/5">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

/* 单题外壳：题干 + 输入框 + 批改按钮 + 结果区 + 历史区 */
function itemHtml(tk, headHtml, ph, isArea){
  const n=histOf(tk).length;
  const inp=isArea
    ? `<textarea class="sinput" id="in_${tk}" rows="3" placeholder="${esc(ph)}"></textarea>`
    : `<input class="sinput" id="in_${tk}" placeholder="${esc(ph)}">`;
  return `<div class="sitem">
    ${headHtml}
    ${inp}
    <div class="btnrow">
      <button class="btn ghost sm" data-act="check" data-val="${tk}">✍️ 批改${n?'（第 '+(n+1)+' 次）':''}</button>
      <button class="btn ghost sm" data-act="redo" data-val="${tk}" style="${n?'':'display:none'}" id="redo_${tk}">✏️ 重新作答</button>
      <button class="btn ghost sm" data-act="copyOne" data-val="${tk}" data-val2="last" style="${n?'':'display:none'}" id="cp_${tk}">📋 复制</button>
    </div>
    <div id="res_${tk}"></div>
  </div>`;
}

/* ---------- 提交批改 ---------- */
async function submitSentence(tk){
  const inp=document.getElementById('in_'+tk);
  const v=(inp&&inp.value||'').trim();
  if(!v){toast('先写一个句子');return;}
  const meta=(state.tkMeta||{})[tk]||{};
  const btn=document.querySelector('[data-act="check"][data-val="'+tk+'"]');
  if(btn){btn.disabled=true;btn.textContent='批改中…';}
  try{
    const r=await api('/sentence/check',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sentence:v, word:meta.word||'', task_key:tk,
        grammar:meta.grammar||'', prompt:meta.task||''})});
    if(!r||r.error){toast((r&&r.error)||'批改失败');return;}
    state.hist=state.hist||{}; state.hist[tk]=state.hist[tk]||[];
    state.hist[tk].push({
      id:r.sentence_id, attempt:r.attempt, sentence:r.original, corrected:r.corrected,
      score:r.score, verdict:r.verdict, ok:!!r.ok, error_type:r.error_type,
      status:r.status||'', errors:r.errors||[], task_issues:r.task_issues||[],
      optimizations:r.optimizations||[], created_at:r.created_at});
    renderAttempts(tk);
    planProgress();
    // 组合题额外反馈：用到了哪几个建议词（只提示，不判错）
    if(tk.indexOf('combo:')===0) comboHint(tk,v);
  }catch(e){ toast('批改失败：'+e.message); }
  finally{ if(btn){btn.disabled=false;btn.textContent='✍️ 批改（第 '+(histOf(tk).length+1)+' 次）';} }
}
function comboHint(tk,txt){
  const c=(planOf(state.today).combo||[])[parseInt(tk.split(':')[1],10)];
  if(!c) return;
  const low=(txt||'').toLowerCase();
  const used=(c.words||[]).filter(w=>low.includes(String(w.word).toLowerCase()));
  const miss=(c.words||[]).filter(w=>!low.includes(String(w.word).toLowerCase()));
  const box=document.getElementById('res_'+tk);
  if(!box) return;
  box.insertAdjacentHTML('afterbegin',
    `<div class="sub" style="margin:6px 0">🎯 用到 ${used.length}/${(c.words||[]).length} 个建议词`
    + (used.length?`：<b>${used.map(w=>esc(w.word)).join('、')}</b>`:'')
    + (miss.length?` · 没用上的：${miss.map(w=>esc(w.word)).join('、')}（下次可以试试）`:' · 全部用上了 👍')
    + `</div>`);
}
function redoSentence(tk){
  const inp=document.getElementById('in_'+tk);
  if(inp){inp.value='';inp.focus();}
  toast('已清空，重新写一句吧 ✏️（上一次的作答已保留）');
}

/* ---------- 结果渲染：判定 / 分数 / 哪里错 / 为什么 / 正确 / 可优化 ---------- */
function renderAttempts(tk){
  const box=document.getElementById('res_'+tk);
  if(!box)return;
  const list=histOf(tk);
  const cp=document.getElementById('cp_'+tk), rd=document.getElementById('redo_'+tk);
  if(cp)cp.style.display=list.length?'':'none';
  if(rd)rd.style.display=list.length?'':'none';
  if(!list.length){box.innerHTML='';return;}
  box.innerHTML=list.map((a,i)=>attemptCard(a,tk,i,i===list.length-1)).join('');
}
function attemptCard(a,tk,i,isLast){
  const sc=Number(a.score||0);
  const errs=a.errors||[], opts=a.optimizations||[], tasks=a.task_issues||[];
  const hasErr=errs.length>0, hasTask=tasks.length>0;
  const pass = sc>=85 && !hasErr && !hasTask;
  let head;
  if(pass){
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--green)">✅ 正确 · ${sc}/100 · 基本掌握</div>`;
  }else if(hasErr){
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--red)">❌ 有错误 · ${sc}/100 · 需要改进</div>`;
  }else if(hasTask){
    head=`<div style="font-size:15.5px;font-weight:800;color:#b45309">⚠️ 未完成题目要求 · ${sc}/100 · 需要改进</div>`;
  }else{
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--red)">❌ 有错误 · ${sc}/100 · 需要改进</div>`;
  }
  if(a.status==='UNCERTAIN'){
    head=`<div style="font-size:15.5px;font-weight:800;color:#b45309">⚠️ 系统无法完全判断 · ${sc}/100</div>`;
  }
  const errHtml = errs.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:var(--red)">🔍 哪里错了 / 为什么错</div>`
      + errs.map((e,j)=>`<div style="background:#fff;border:1px solid #fecaca;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">❌ <b>哪里错了：</b><span style="color:var(--red);font-weight:700">${esc(e.where)}</span>
          ${e.type?`<span class="errtype" style="margin-left:5px">${esc(e.type)}</span>`:''}</div>
        <div style="font-size:13.5px;color:#475569;margin-top:4px">💡 <b>为什么错：</b>${esc(e.explanation)}</div>
        <div style="font-size:13.5px;margin-top:4px">✅ <b>正确表达：</b><b style="color:var(--green)">${esc(e.correct)}</b></div>
      </div>`).join('')
    : (hasTask?`<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">✅ 没有明显语法错误</div>`
                :`<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">✅ 没有明显错误</div>`);
  const taskHtml = tasks.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:#b45309">📋 题目要求（需补齐，不计入语法错误）</div>`
      + tasks.map((e,j)=>`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">⚠️ <b>未完成：</b><span style="color:#b45309;font-weight:700">${esc(e.where)}</span></div>
        <div style="font-size:13.5px;color:#475569;margin-top:4px">💡 ${esc(e.explanation)}</div>
      </div>`).join('')
    : '';
  const corHtml = (!pass && a.corrected && a.corrected!==a.sentence)
    ? `<div style="margin-top:6px;font-size:13.5px">📗 <b>整句正确写法：</b><b style="color:var(--green)">${esc(a.corrected)}</b></div>`:'';
  const optHtml = opts.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:#92400e">💡 可以优化（原句没错，仅供参考，不扣分）</div>`
      + opts.map((o,j)=>`<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">✨ <b>可以优化：</b>${o.suggestion?`<b style="color:var(--green)">${esc(o.suggestion)}</b>`:'<span style="color:var(--muted)">（见说明）</span>'}</div>
        <div style="font-size:13px;color:#475569;margin-top:4px">${esc(o.reason||'')}</div>
      </div>`).join('')
    : '';
  return `<div class="res ${pass?'good':''}" style="margin-top:8px;${isLast?'':'opacity:.72'}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="min-width:0">
        <div style="font-size:12px;color:var(--muted)">第 ${a.attempt||i+1} 次作答${isLast?' · <b style="color:var(--primary)">最新</b>':''}</div>
        ${head}
      </div>
      <button class="btn ghost sm" style="flex-shrink:0" data-act="copyOne" data-val="${tk}" data-val2="${a.attempt}">📋 复制</button>
    </div>
    <div style="margin-top:5px;font-size:14px;line-height:1.6">${esc(a.sentence)}</div>
    ${errHtml}${taskHtml}${corHtml}${optHtml}
  </div>`;
}

/* ---------- 复制 ---------- */
function copyOne(tk, which){
  const list=histOf(tk);
  if(!list.length){toast('还没有批改记录');return;}
  const a = (which==='last'||which===''||which==null) ? list[list.length-1]
          : (list.find(x=>String(x.attempt)===String(which)) || list[list.length-1]);
  copyText(attemptCopyText(tk,a));
}
function attemptCopyText(tk,a){
  const meta=(state.tkMeta||{})[tk]||{};
  const sc=Number(a.score||0);
  const L=[];
  L.push('【造句批改】');
  L.push('单词：'+(meta.word||'—'));
  if(meta.task) L.push('题目：'+meta.task);
  L.push('第 '+(a.attempt||1)+' 次作答');
  L.push('我的句子：'+(a.sentence||''));
  L.push('得分：'+sc+'/100');
  L.push('判定：'+(a.ok?'✅ 正确':'❌ 有错误')+'（≥85 基本掌握，<85 需要改进）');
  if((a.errors||[]).length){
    (a.errors||[]).forEach((e,j)=>{
      L.push('错误'+(j+1)+' · 哪里错了：'+e.where);
      L.push('错误'+(j+1)+' · 类型：'+(e.type||'—'));
      L.push('错误'+(j+1)+' · 为什么错：'+e.explanation);
      L.push('错误'+(j+1)+' · 正确表达：'+e.correct);
    });
    if(a.corrected) L.push('整句正确写法：'+a.corrected);
  }else{
    L.push('哪里错了：没有明显错误');
  }
  if((a.task_issues||[]).length){
    (a.task_issues||[]).forEach((e,j)=>{
      L.push('题目要求'+(j+1)+' · 未完成：'+e.where);
      L.push('题目要求'+(j+1)+' · 说明：'+e.explanation);
    });
  }
  if((a.optimizations||[]).length){
    (a.optimizations||[]).forEach((o,j)=>{
      L.push('可优化'+(j+1)+'：'+(o.suggestion||'（见说明）'));
      L.push('可优化'+(j+1)+' 说明：'+(o.reason||''));
    });
  }else{
    L.push('可优化表达：无');
  }
  return L.join('\n');
}
async function toggleMySentences(){

function copyAllText(){
  const t=state.today||{}, pr=t.progress||{};
  const keys=planKeys().filter(k=>histOf(k).length);
  if(!keys.length) return '';
  const L=['【今日造句批改记录】',
    '日期：'+new Date().toISOString().slice(0,10),
    '进度：阶段'+pr.stage+' · W'+pr.week+' · D'+pr.day,
    '共 '+keys.length+' 题'];
  keys.forEach(tk=>{
    L.push('', '───────────────');

async function copyText(txt, emptyMsg){
  if(!txt){toast(emptyMsg||'没有可复制的内容');return false;}
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(txt); toast('已复制 ✅ 可直接粘贴给 AI 追问'); return true;
    }
    throw new Error('no-clipboard-api');
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=txt; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok?'已复制 ✅ 可直接粘贴给 AI 追问':'复制失败，请长按选中文本手动复制');
    return ok;
  }
}

const TRAIN_SEC_ORDER=['听力','词汇','语法','阅读','主动输出'];
function trainInit(){ state.train=state.train||{paper:null,answers:{},graded:{},projectId:null}; }
function renderTrainPaper(paper){
  if(!paper||!paper.sections||!paper.sections.length) return '';
  const secs=[...(paper.sections||[])].sort((a,b)=>{
    const ia=TRAIN_SEC_ORDER.indexOf(a.section), ib=TRAIN_SEC_ORDER.indexOf(b.section);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  return secs.map((sec,si)=>`
    <div class="card">
      <h2>${esc(sec.section||'模块')}</h2>
      ${(sec.questions||[]).map((q,qi)=>trainQHtml(si,qi,q)).join('')}
    </div>`).join('');
}
function trainQHtml(si,qi,q){
  const uid=si+':'+qi;
  const type=q.type;
  const stem=`<div style="font-size:13.5px;font-weight:700;margin-bottom:5px">${esc(q.qid!=null?q.qid:(qi+1))}. ${esc(q.prompt||'')}</div>`;
  const sel=(state.train.answers||{})[uid];
  let body='';
  if(type==='choice'){
    const opts=q.options||[];
    body=`<div>${opts.map(o=>{
      const L=String(o).replace(/^([A-D])[.．、:：]\s*/,'$1');
      return `<button class="optb" data-act="tOpt" data-no="${uid}" data-val="${esc(L)}" style="${sel===L?'background:var(--primary);color:#fff;border-color:var(--primary)':''}">${esc(o)}</button>`;
    }).join('')}</div>`;
  } else if(type==='judge'){
    const opts=(q.options&&q.options.length)?q.options:['TRUE','FALSE'];
    body=`<div>${opts.map(o=>{
      const L=String(o);
      return `<button class="optb" data-act="tOpt" data-no="${uid}" data-val="${esc(L)}" style="${sel===L?'background:var(--primary);color:#fff;border-color:var(--primary)':''}">${esc(o)}</button>`;
    }).join('')}</div>`;
  } else if(type==='fill'){
    body=`<input id="tans_${uid}" value="" placeholder="在此填写答案…" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:13.5px" />`;
  } else {
    body=`<textarea id="tans_${uid}" rows="2" placeholder="写下你的答案…" style="width:100%;box-sizing:border-box;padding:7px 9px;border:1px solid var(--border);border-radius:7px;font-size:13.5px"></textarea>`;
  }
  const g=(state.train.graded||{})[uid];
  const fb=g?`<div class="sub" style="margin-top:6px">${g.score!=null?('得分：<b>'+g.score+'</b> ｜ '):''}${esc(g.feedback||'已记录')}</div>`:'';
  return `<div data-q="${uid}" style="margin-top:8px;padding-top:7px;border-top:1px dashed var(--border)">
    ${stem}${body}
    <div style="margin-top:7px"><button class="btn green sm" data-act="tSubmit" data-uid="${uid}" data-sec="${si}" data-q="${qi}">提交本题</button></div>
    ${fb}
  </div>`;
}
function renderTrainArea(){
  const a=document.getElementById('trainArea');
  if(a) a.innerHTML=renderTrainPaper(state.train.paper);
}
async function trainImport(){
  const ta=document.getElementById('trainInput');
  const raw=ta?ta.value:'';
  if(!raw || !raw.trim()){ toast('请先粘贴 AI 返回的卷文本（需含 <<<TEST>>>）'); return; }
  const box=document.getElementById('trainParseRes');
  if(box) box.innerHTML='<div class="sub">解析中…</div>';
  let r=null;
  try{ r=await api('/test/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:raw})}); }
  catch(e){ toast('解析请求失败'); if(box) box.innerHTML=''; return; }
  if(!r || !r.sections){
    toast('解析失败：'+(r&&r.error||'返回格式不对（需含 <<<TEST>>>…<<<END>>>）'));
    if(box) box.innerHTML=`<div class="res" style="background:#fef2f2;border-color:#fecaca;color:var(--red)">解析失败：${esc(r&&r.error||'格式不对')}</div>`;
    return;
  }
  trainInit();
  state.train.paper=r; state.train.answers={}; state.train.graded={}; state.train.projectId=null;
  // 建一个训练项目，便于逐题判分与历史记录；失败不影响已完成的解析
  try{
    const pr=await api('/test/projects',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ability:'综合', problem:'专项训练导入', prompt_md:raw})});

async function trainSubmitQ(el){
  const uid=el.getAttribute('data-uid');
  const secIdx=parseInt(el.getAttribute('data-sec'),10);
  const qIdx=parseInt(el.getAttribute('data-q'),10);
  trainInit();
  const paper=state.train.paper;
  if(!paper||!paper.sections||!paper.sections[secIdx]) return;
  const q=paper.sections[secIdx].questions[qIdx];
  if(!q) return;
  const type=q.type;
  let user_sentence=undefined, answer=undefined;
  if(type==='choice'||type==='judge'){
    const s=(state.train.answers||{})[uid];
    if(s==null){ toast('请先选择答案'); return; }
    answer=s;
  } else {
    const inp=document.getElementById('tans_'+uid);
    const v=inp?inp.value.trim():'';
    if(!v){ toast('请先填写答案'); return; }
    user_sentence=v;
  }
  el.disabled=true; el.textContent='判分中…';
  let r=null;
  try{
    r=await api('/test/grade',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({project_id:state.train.projectId||null, round:uid, user_sentence, answer})});
  }catch(_){ r=null; }
  el.disabled=false; el.textContent='提交本题';
  if(!r || r.ok===false){ toast('判分失败：'+(r&&r.error||'服务异常')); return; }
  const score=(r.score!=null)?Number(r.score):null;
  const fb=r.feedback||'';
  state.train.graded[uid]={score,feedback:fb};
  const wrap=el.closest('[data-q]');
  if(wrap){
    const okCls=(score==null)?'train-neutral':((score>1? score>=60 : score>=0.6)?'train-ok':'train-bad');
    wrap.classList.add(okCls);
    let fbBox=wrap.querySelector('.tfb');
    if(!fbBox){ fbBox=document.createElement('div'); fbBox.className='tfb'; wrap.appendChild(fbBox); }
    fbBox.innerHTML=`<div class="sub" style="margin-top:6px">${score!=null?('得分：<b>'+score+'</b> ｜ '):''}${esc(fb||'已记录')}</div>`;
  }
}

  const r=await api('/review/submit',{method:'POST',headers:{'Content-Type':'application/json'},

  state.revLog=state.revLog||[];

/* ============ 错误 / 薄弱项页（独立入口）============ */
/* ==================================================================
   薄弱项：5 大类三色卡片（前端把 /errors 的错误类型映射到 5 大类）
   说明：成熟版后端 /weakness 没有 capabilities.categories，
   所以这里直接遍历 WEAK_CATALOG，用 ERR_CAP_MAP + 关键词把
   state.errs（来自 /errors）里命中的错误归到对应能力项。
   趋势图只用 recent[] 的时间戳做前端周聚合，不写 localStorage、不引入演示数据。
   ================================================================== */
const WEAK_CATALOG=[
  {key:'grammar', icon:'📐', label:'语法', items:[
    {key:'past_tense',   label:'一般过去时反复错',        alias:['past tense','一般过去时','过去时']},
    {key:'third_person', label:'三单反复错',              alias:['三单','第三人称','third person','third-person']},
    {key:'countable',    label:'可数/不可数反复错',       alias:['可数','不可数','countable','uncountable']},
    {key:'tense_mix',    label:'时态混用',                alias:['时态混用','时态','tense']}
  ]},
  {key:'structure', icon:'🧱', label:'句型 / 结构', items:[
    {key:'want_to',      label:'不会使用 want to + do',   alias:['want to']},
    {key:'comparative',  label:'不会使用比较级',          alias:['比较级','comparative']},
    {key:'reason',       label:'不会组织原因表达',        alias:['原因','because','reason']},
    {key:'cn_order',     label:'总是把中文语序直接搬到英语', alias:['语序','中文语序','word order']}
  ]},
  {key:'expression', icon:'💬', label:'表达', items:[
    {key:'same_structure', label:'造句反复出现同一种结构错误', alias:['同一种结构','same structure']},
    {key:'monotonous',     label:'表达过于单一',              alias:['表达过于单一','单一','monotonous']},
    {key:'function',       label:'某种交际功能不会表达',      alias:['交际','功能','function']}
  ]},
  {key:'listening', icon:'🎧', label:'听力能力', items:[
    {key:'liaison',     label:'连读反复听不出来',                alias:['连读','liaison']},
    {key:'pattern',     label:'特定句型反复听不懂',              alias:['听不懂','句型听','pattern']},
    {key:'detail_info', label:'数字/时间/地点等信息反复识别错误', alias:['数字','时间','地点','信息','detail']}
  ]},
  {key:'reading', icon:'📖', label:'阅读理解', items:[
    {key:'sentence_type',  label:'某类句型经常理解错',   alias:['理解错','sentence type']},
    {key:'main_structure', label:'经常抓错主干',         alias:['主干','main structure']},
    {key:'long_sentence',  label:'长句拆解能力不足',     alias:['长句','拆解','long sentence']}
  ]}
];
/* 错误类型名 → 5 大类之一（粗标签按关键词归类；拼写单独挑出交闪卡） */
const ERR_CAP_MAP=[
  [/拼写|拼错|spell/i,'_spell'],
  [/时态|三单|单复数|冠词|介词|词性|grammar|tense/i,'grammar'],
  [/句型|语序|句子结构|structure|word order/i,'structure'],
  [/表达|搭配|单调|单一|expression|colloc/i,'expression'],
  [/听|listen/i,'listening'],
  [/阅读|主旨|推断|read/i,'reading']
];
function _errCapOf(type){
  const t=String(type||'');
  for(const pair of ERR_CAP_MAP){ if(pair[0].test(t)) return pair[1]; }
  return '_other';
}
/* type 文本是否命中某能力小项（key / label / alias 之一包含即可） */
function _weakHitType(type, def){
  if(!def) return false;
  const t=String(type||'').toLowerCase();
  const key=String(def.key||'').toLowerCase();
  if(key && t.indexOf(key)>=0) return true;
  if(def.alias && def.alias.some(a=>t.indexOf(String(a).toLowerCase())>=0)) return true;
  if(def.label && t.indexOf(String(def.label).toLowerCase())>=0) return true;
  return false;
}
function _findDef(catKey, itemKey){
  const cat=WEAK_CATALOG.find(c=>c.key===catKey);
  if(!cat) return null;
  return cat.items.find(it=>it.key===itemKey)||null;
}
function _todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _isoWeek(dstr){
  const p=String(dstr).split('-'); if(p.length<3) return '?';
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3);
  const first=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const wk=1+Math.round(((d-first)/86400000-3+((first.getUTCDay()+6)%7))/7);
  return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
/* 把某（大类/小项）命中的错误 recent[] 时间戳按 ISO 周聚合 → {week:count} */
function _weekSeriesFor(catKey, itemKey){
  const errs=state.errs||[];
  const byWeek={};
  errs.forEach(e=>{
    if(_errCapOf(e.type)!==catKey) return;
    if(itemKey){
      const def=_findDef(catKey, itemKey);
      if(!def || !_weakHitType(e.type, def)) return;
    }
    (e.recent||[]).forEach(r=>{
      const t=Date.parse(r.created_at||'');
      if(isNaN(t)) return;
      const w=_isoWeek(new Date(t).toISOString().slice(0,10));
      byWeek[w]=(byWeek[w]||0)+1;
    });
  });
  return byWeek;
}
/* 严重度：🔴阻塞(高频需调计划) / 🟡薄弱(需针对训练) / 🔵记忆(闪卡解决) */
function weakSeverity(catKey, itemKey, count){
  const n=Number(count||0);
  if(n===0) return {code:'none', icon:'✅', label:'暂无数据', note:''};
  const ks=String(catKey||'').toLowerCase()+' '+String(itemKey||'').toLowerCase();
  if(/spell|拼写|记|闪卡|单词/.test(ks)) return {code:'mem', icon:'🔵', label:'记忆项', note:'闪卡解决，不改课程'};
  if(n>=8) return {code:'block', icon:'🔴', label:'阻塞项', note:'必须调整学习计划'};
  return {code:'weak', icon:'🟡', label:'薄弱项', note:'需要针对训练'};
}
function _trendIcon(c){
  return c==='improve'?'📉':c==='worsen'?'📈':c==='new'?'🆕':c==='flat'?'➖':'⏳';
}
/* 大类/小项本周 vs 上周趋势（基于 recent 时间戳周聚合，不用 localStorage） */
function weakTrend(catKey, itemKey){
  const byWeek=_weekSeriesFor(catKey, itemKey);
  const weeks=Object.keys(byWeek).sort();
  if(!weeks.length) return {code:'unknown', label:'待观察', cls:'tr-unknown'};
  const curW=_isoWeek(_todayStr());
  const thisWeek=byWeek[curW]!=null?byWeek[curW]:0;
  let lastWeek=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i]<curW){ lastWeek=byWeek[weeks[i]]; break; } }
  if(lastWeek===0) return thisWeek>0?{code:'new',label:'新出现',cls:'tr-new'}:{code:'flat',label:'稳定',cls:'tr-flat'};
  if(thisWeek<lastWeek) return {code:'improve',label:'改善',cls:'tr-improve'};
  if(thisWeek>lastWeek) return {code:'worsen',label:'恶化',cls:'tr-worsen'};
  return {code:'flat',label:'稳定',cls:'tr-flat'};
}
/* 本周/上周/趋势%/连续周（基于 recent 时间戳周聚合，不用 localStorage） */
function weakWeekStat(catKey, itemKey, liveCount){
  const byWeek=_weekSeriesFor(catKey, itemKey);
  const weeks=Object.keys(byWeek).sort();
  const curW=_isoWeek(_todayStr());
  const thisWeek = byWeek[curW]!=null ? byWeek[curW] : (liveCount!=null?Number(liveCount):0);
  let lastWeek=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i]<curW){ lastWeek=byWeek[weeks[i]]; break; } }
  let consec=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i]>curW) continue; if(byWeek[weeks[i]]>0) consec++; else break; }
  let status, pct=null;
  if(lastWeek===0){ status = thisWeek>0?{code:'new',label:'新出现'}:{code:'flat',label:'稳定'}; }
  else { pct=Math.round((thisWeek-lastWeek)/lastWeek*100);
    status = pct<0?{code:'improve',label:'改善中'}:pct>0?{code:'worsen',label:'恶化中'}:{code:'flat',label:'稳定'}; }
  return {thisWeek, lastWeek, pct, status, consec, series:weeks.map(w=>byWeek[w])};
}
/* 趋势折线图（250×66）：不足 2 周显示说明，不硬画 */
function weakTrendChart(catKey, itemKey){
  const ws=weakWeekStat(catKey, itemKey, null);
  const pts=ws.series||[];
  if(pts.length<2) return `<div style="color:var(--muted);margin-top:4px;font-size:12px">📈 需要更多数据才能画趋势（已记录 ${pts.length} 周，至少需 2 周）。</div>`;
  const W=250,H=66,pad=8;
  const max=Math.max.apply(null,pts), min=Math.min.apply(null,pts), span=(max-min)||1;
  const X=i=>pad+i*((W-2*pad)/(pts.length-1));
  const Y=v=>H-pad-((v-min)/span)*(H-2*pad);
  let path=''; pts.forEach((v,i)=>{ path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; });
  const dots=pts.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.3" style="fill:#2563eb"/>`).join('');
  const up=pts[pts.length-1]>pts[0], down=pts[pts.length-1]<pts[0];
  const col=up?'#dc2626':down?'#16a34a':'#64748b';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:5px;display:block">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" style="stroke:#eef2f7;stroke-width:1"/>
    <path d="${path}" style="fill:none;stroke:${col};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
    ${dots}
  </svg>
  <div style="font-size:11px;margin-top:1px;color:#475569">📈 各周错误数：${pts.join(' → ')}　${up?'↑ 增多':down?'↓ 减少':'→ 持平'}</div>`;
}
/* 5 大类三色卡片：遍历 WEAK_CATALOG，把 state.errs 命中项归进来（不读 capabilities） */

    });
    const extra=catErrs.filter(e=>!used.has(e)).map(e=>({def:{key:'',label:e.type,alias:[]}, hit:[e]}));
    const all=rows.concat(extra);

      </summary>
      ${all.map(r=>{

        const total=on?r.hit.reduce((s,e)=>s+(e.total||0),0):0;
        const ws=weakWeekStat(cat.key, r.def.key, count30);
        const sev=weakSeverity(cat.key, r.def.key, count30);
        const trendTxt=ws.pct!=null?(ws.pct>0?('↑'+ws.pct+'%'):ws.pct<0?('↓'+(-ws.pct)+'%'):'±0%'):ws.status.label;
        const badgeCol=ws.pct!=null?(ws.pct<0?'#16a34a':ws.pct>0?'#dc2626':'#64748b'):(ws.status.code==='new'?'#2563eb':'#64748b');
        const lastWkTxt=ws.lastWeek?(ws.lastWeek+' 次'):'首次记录';
        const chart=on?weakTrendChart(cat.key, r.def.key):'';
        const sevBg=sev.code==='block'?'#fee2e2':sev.code==='weak'?'#fef3c7':sev.code==='mem'?'#dbeafe':'#f1f5f9';
        const sevFg=sev.code==='block'?'#b91c1c':sev.code==='weak'?'#b45309':sev.code==='mem'?'#1d4ed8':'#64748b';

        const detail=on?`近30天 ${count30} 次 / 累计 ${total} 次`:'';
        return `<details ${on?'':'style="opacity:.7"'}>
          <summary style="display:flex;align-items:center;gap:7px;padding:9px 16px;cursor:pointer;font-size:13.5px">
            <span>${on?'⚠️':'·'}</span>

            <span style="font-size:11.5px;color:${badgeCol}">${ws.pct!=null?trendTxt:ws.status.label}</span>
            <span style="color:#94a3b8;font-weight:800">›</span>
          </summary>
          <div style="padding:4px 16px 12px">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">

              连续出现 <b>${ws.consec}</b> 周${ws.consec>=2?'（持续性问题）':''}

  return `<div class="card" style="border:1.5px solid var(--primary)">
    <h2 style="margin:0">🧭 薄弱项总览
      <span style="float:right;font-size:12px;color:var(--muted);font-weight:400">共 ${totalHit} 项需关注</span></h2>
    <div class="sub" style="margin-top:4px">把后端错误类型映射到 5 大类能力项（语法 / 句型结构 / 表达 / 听力 / 阅读）。点大分类展开，点每一条再展开看证据、趋势与建议；标 ⚠️ 的是系统确实查到问题的。</div>

/* 复制报告：数据 + 诊断提示词 + 补习提示词 */
function _tpl(id){ const t=document.getElementById(id); return t?String(t.textContent||'').trim():''; }
function pgosDataDump(){
  const L=['【PGOS 学习数据 · 实时导出】','导出时间：'+new Date().toLocaleString()];
  const pg=document.getElementById('topProg');
  L.push('当前进度：'+(pg?(pg.textContent||'').trim():'—'));
  const errs=state.errs||[];
  L.push('','■ 近30天错误类型（按类型聚合，前端映射到 5 大类）');
  if(errs.length){
    errs.forEach(e=>{
      const cap=_errCapOf(e.type);
      L.push(`- [${cap}] ${e.level||''} ${e.type||'未分类'}：近30天 ${e.count_30d||0} 次 / 累计 ${e.total||0} 次`);
      (e.recent||[]).slice(0,6).forEach(r=>{
        const when=String(r.created_at||'').slice(0,16).replace('T',' ');
        L.push(`    · ${r.original||'—'} → ${r.corrected||'—'}${r.explanation?('（'+(r.explanation||'')+'）'):''}${when?('【'+when+'】'):''}`);
      });
      if(e.remedy) L.push(`    对策：${e.remedy}`);
    });
  } else L.push('- 暂无错误记录。');
  L.push('','■ 系统已检测到的能力薄弱项（含近期趋势，按错误时间戳周聚合）');
  let anyCap=false;
  WEAK_CATALOG.forEach(cat=>{
    const catErrs=errs.filter(e=>_errCapOf(e.type)===cat.key);
    if(!catErrs.length) return;
    cat.items.forEach(def=>{
      const hit=catErrs.filter(e=>_weakHitType(e.type, def));
      if(!hit.length) return;
      anyCap=true;
      const count30=hit.reduce((s,e)=>s+(e.count_30d||0),0);
      const ws=weakWeekStat(cat.key, def.key, count30);
      const sev=weakSeverity(cat.key, def.key, count30);
      const lastWk=ws.lastWeek?(ws.lastWeek+' 次'):'首次记录';
      const trendTxt=ws.pct!=null?(ws.pct>0?('↑'+ws.pct+'%'):ws.pct<0?('↓'+(-ws.pct)+'%'):'±0%'):ws.status.label;
      L.push(`【${cat.label} · ${def.label}】`);
      L.push(`  - ${sev.icon}${sev.label}`);
      L.push(`      近30天 ${count30} 次｜本周 ${ws.thisWeek} 次｜上周 ${lastWk}｜趋势 ${trendTxt}（${ws.status.label}）｜连续出现 ${ws.consec} 周${ws.consec>=2?'（持续性）':''}`);
      const remedies=hit.map(e=>e.remedy).filter(Boolean);
      L.push(`      对策：${remedies.join('；')||'—'}`);
    });
  });
  if(!anyCap) L.push('- 暂未诊断出能力类薄弱项。');
  const low=(state.weak&&state.weak.low_star_words)||[];
  L.push('','■ 主动输出偏弱的词（认得但用不出）');
  L.push(low.length?low.slice(0,40).map(w=>`${w.word||'—'}(${w.stars!=null?w.stars:'?'}星/练${w.total_attempts||0}次)`).join('、'):'- 暂无。');
  const bank=state.bank||{}, bitems=bank.items||[];
  L.push('','■ 错题本（最近 20 条）');
  if(bitems.length){
    bitems.slice(0,20).forEach((b,i)=>{
      const when=String(b.created_at||b.first_at||'').slice(0,16).replace('T',' ');
      L.push(`${i+1}. ${b.original||b.sentence_text||'—'} → ${b.corrected||'—'}${b.error_type?('【'+b.error_type+'】'):''}${when?('【'+when+'】'):''}`);
    });
    L.push(`（共 ${bank.total||bitems.length} 条${bank.unfixed!=null?('，未改正 '+bank.unfixed+' 条'):''}）`);
  } else L.push('- 暂无错题。');
  L.push('','（说明：以上为系统原始数据，未经加工。请按提示词规则自行判断证据是否足够。）');
  return L.join('\n');
}

/* ============ 总结页辅助函数 ============ */
function _anaMetric(label, val, sub){
  return `<div class="metric"><span>${label}</span><b>${val!=null?val:'—'}${sub?` <small style="font-weight:400;color:var(--muted)">${sub}</small>`:''}</b></div>`;
}
/* 带涨跌箭头的指标：cur=本周, prev=上周, unit=单位, lowerIsBetter=错误率类（越低越好） */
function _anaTrend(label, cur, prev, unit, lowerIsBetter){
  if(cur==null||prev==null) return _anaMetric(label, cur!=null?cur+unit:'—', prev!=null?('上周 '+prev+unit):'');
  const diff=Number(cur)-Number(prev);
  const pct=prev!=0?Math.round(diff/Math.abs(Number(prev))*100):0;
  const isGood=lowerIsBetter?(diff<0):(diff>0);
  const color=isGood?'var(--green)':'var(--red)';
  const arrow=diff>0?'↑':diff<0?'↓':'→';
  const sign=diff>0?'+':'';
  return `<div class="metric"><span>${label}</span><b>${cur}${unit} <span style="color:${color};font-weight:800">${arrow} ${sign}${pct}%</span> <small style="font-weight:400;color:var(--muted)">上周 ${prev}${unit}</small></b></div>`;
}
/* 迷你折线图：arr=[{label,v}]，lowerIsBetter=错误率类 */
function _anaMiniLine(arr,title,lowerIsBetter){
  if(!arr||!arr.length) return '';
  const W=280,H=70,P=10;
  const vals=arr.map(x=>x.v);
  const maxv=Math.max(...vals,1), minv=Math.min(...vals,0);
  const range=maxv-minv||1;
  const xc=i=>P+(W-2*P)*(arr.length===1?0.5:i/(arr.length-1));
  const yc=v=>H-P-(H-2*P)*((v-minv)/range);
  let d=''; let pen=false;
  arr.forEach((x,i)=>{ const px=xc(i), py=yc(x.v); d+=(pen?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)+' '; pen=true; });
  const dots=arr.map((x,i)=>`<circle cx="${xc(i).toFixed(1)}" cy="${yc(x.v).toFixed(1)}" r="3" fill="${lowerIsBetter?'var(--red)':'var(--primary)'}"/>`).join('');
  const labels=arr.map((x,i)=>`<text x="${xc(i).toFixed(1)}" y="${H-2}" font-size="9" fill="#94a3b8" text-anchor="middle">${i+1}</text>`).join('');
  const nums=arr.map(x=>x.v).join(' → ');
  return `<div style="margin:8px 0"><div style="font-size:13px;font-weight:700;margin-bottom:4px">${esc(title)}</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e2e8f0"/><path d="${d.trim()}" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>
    <div class="trendnote">最近四周：${nums}</div>
  </div>`;
}
/* 错误趋势折线图：输入 byDay={YYYY-MM-DD:次数}，按自然日画，无记录日不补点 */
function _errTrendLine(byDay){
  const days=Object.keys(byDay||{}).sort();
  if(!days.length) return '<div class="sub" style="margin:6px 0">暂无按日错误记录。</div>';
  const arr=days.map(d=>({label:d.slice(5), v:byDay[d]}));
  const W=320,H=92,P=14,maxv=Math.max.apply(null,arr.map(x=>x.v).concat(1));
  const xc=i=>P+(W-2*P)*(arr.length===1?0.5:i/(arr.length-1));
  const yc=v=>H-P-(H-2*P)*(v/maxv);
  let d='';let pen=false;
  arr.forEach((x,i)=>{const px=xc(i),py=yc(x.v);d+=(pen?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)+' ';pen=true;});
  const dots=arr.map((x,i)=>`<circle cx="${xc(i).toFixed(1)}" cy="${yc(x.v).toFixed(1)}" r="2.5" fill="var(--red)"/>`).join('');
  const labels=arr.map((x,i)=>`<text x="${xc(i).toFixed(1)}" y="${H-2}" font-size="8" fill="#94a3b8" text-anchor="middle">${i%2===0?esc(x.label):''}</text>`).join('');
  const total=arr.reduce((s,x)=>s+x.v,0), avg=Math.round(total/arr.length);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:4px">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#e2e8f0"/>
    <path d="${d.trim()}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg><div class="trendnote">共 ${arr.length} 天 · 日均 ${avg} 次 · 峰值 ${maxv} 次</div>`;
}
/* 进度条：current/max */
function _anaProgress(label, cur, max){
  if(cur==null||max==null||max===0) return _anaMetric(label, '—');
  const pct=Math.round(cur/max*100);
  const color=pct>=80?'var(--green)':pct>=60?'var(--amber)':'var(--red)';
  return `<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px"><span>${esc(label)}</span><b>${cur} / ${max}（${pct}%）</b></div><div class="progressbar"><div style="width:${pct}%;background:${color}"></div></div></div>`;
}
function _sumPeriod(){
  const dt=new Date(), day=(dt.getDay()+6)%7;
  const mon=new Date(dt); mon.setDate(dt.getDate()-day);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=x=>x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);
  const y=dt.getFullYear(), m=dt.getMonth()+1, md=('0'+m).slice(-2), last=new Date(y,m,0).getDate();
  return {week:f(mon)+' ～ '+f(sun), month:y+'-'+md+'-01 ～ '+y+'-'+md+'-'+('0'+last).slice(-2)};
}

  const monthSummary = `本月共记录 ${totalErr} 条错误，涉及 ${errTypes.length} 类：\n` + (errTypes.length?errTypes.map(e=>e.type+' '+e.count_30d+'次').join('\n'):'（无）') + '\n错误统计用于记录学习表现，不直接代表能力薄弱。';

/* 最近活动数据：来自真实后端 /history（学习历史流水，追加式，永不删除） */
async function historyData(){
  try{
    const rows=await api('/history');
    if(!rows||!rows.length) return [];
    const LABEL={learn_vocab:'学习', write_sentence:'造句', review:'闪卡', quiz:'测评', listening:'听力', import_words:'导入', import:'导入'};
    return rows.map(r=>({
      type: LABEL[r.action]||r.action||'其他',
      date: (r.date||r.created_at||'').slice(0,10),
      score: null, ok: null
    }));
  }catch(e){ return []; }
}
async function _recentActivityHtml(){
  const d=await historyData();
  if(!d.length) return '';
  const byType={}; d.forEach(x=>{ byType[x.type]=(byType[x.type]||[]); byType[x.type].push(x); });
  const rows=Object.entries(byType).map(([t,list])=>{
    const last=list[list.length-1];
    let extra='';
    if((t==='测评'||t==='听力') && list.some(x=>x.score!=null)){ const avg=Math.round(list.reduce((s,x)=>s+(x.score||0),0)/list.length); extra=`均分 ${avg}`; }
    else if((t==='造句'||t==='闪卡') && list.some(x=>x.ok!=null)){ const rate=Math.round(list.filter(x=>x.ok).length/list.length*100); extra=`正确率 ${rate}%`; }
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span><b>${t}</b> ${list.length} 条</span><span style="color:var(--muted)">最近 ${last.date} · ${extra}</span></div>`;
  }).join('');
  return `<div class="card" style="margin-top:10px"><h2>🕐 最近活动</h2><div class="sub">按模块分组，显示最近记录数和表现。</div>${rows}</div>`;
}
/* 生成可复制的纯文本总结（周报/月报共用） */
function _buildSumText(kind, period, errTypes, confirmed, byDay, totalErr, monthSummary){
  const L=['【English OS 学习总结 · '+kind+'】','周期：'+(kind==='月报'?period.month:period.week),'生成时间：'+new Date().toLocaleString(),''];
  L.push('—— 错误概览（仅事实，不代表能力薄弱）——');
  if(errTypes.length){
    errTypes.forEach(e=>L.push(`· ${e.type}（${e.level||''}）：近30天 ${e.count_30d||0} 次，累计 ${e.total||0}`));
  } else L.push('· 本周暂无错误记录');
  L.push('','—— 错误按日分布 ——');
  const keys=Object.keys(byDay).sort();
  L.push(keys.length?keys.map(d=>`· ${d.slice(5)}：${byDay[d]} 次`).join('\n'):'· 暂无按日错误记录');
  L.push('','—— 需要注意（只读已确认薄弱项）——');
  L.push(confirmed.length?confirmed.map(e=>`· ${e.type}（${e.level||''} · 已确认）`).join('\n'):'· 本周暂无已确认的重点薄弱项');
  if(kind==='月报'){ L.push('','—— 本月总结 ——', monthSummary); }
  L.push('','（学习天数 / 新学词汇 / 计划完成率等需后端统计接口；当前未提供，按“不编造”原则未显示。）');
  return L.join('\n');
}
/* 复制总结报告（给 AI 分析用） */
function copySummaryReport(){
  const txt=state.sumText;
  if(!txt){ toast('报告尚未加载'); return; }
  copyText(txt,'暂无总结数据可复制');
  toast('已复制总结报告 ✅');
}

async function render(page){const el=document.getElementById('content');if(pages[page])await pages[page](el);}
render('learn');
</script>
<script type="text/plain" id="tplPromptDiag">
🎯 PGOS｜AI薄弱项诊断 Prompt
一、角色
你是一名严格、克制、以学习效果为导向的英语学习诊断师。
我会提供一份来自我的学习系统 PGOS 的学习表现、错误记录、能力统计和薄弱项数据。
你的任务不是简单复述数据，也不是为了让报告看起来详细而制造问题。
你的唯一核心任务是：
根据真实学习证据，判断学习者目前是否存在真正的英语能力问题，并判断哪些问题值得进入下一阶段专项训练。
你负责的是：
诊断“练什么”。
你不负责：
决定“怎么练”。
因此，本阶段只做诊断，不生成习题、不生成听力材料、不制定完整学习计划。
二、诊断范围
必须检查以下六个能力维度：
语法
词汇
句型 / 表达
听力
阅读
其他能力
其中：
其他能力
仅用于报告中存在明确证据、且无法合理归入前五项的能力。
例如：
发音
流利度
互动能力
不得因为没有明确证据而自行创造：
学习习惯问题
学习态度问题
自信问题
动机问题
时间管理问题
三、核心原则：错误 ≠ 能力薄弱
必须始终遵守：
一次错误不能直接证明能力薄弱。
每一个潜在问题，都必须经过：
错误 → 归因 → 重复性 → 持续性 → 实际影响 → 置信度 → 是否值得干预
的判断。
如果证据不足：
宁可不诊断，也不要猜测。
四、证据等级与升级门槛
将证据分为四级。
Level 1｜单次证据
同一问题只出现一次。
结论：
不得建立能力薄弱项。
只能记录为：
单次错误 / 待观察。
Level 2｜重复证据
同一类能力问题再次出现。
例如：
多次出现一般过去时错误
多次无法理解相同类型的听力信息
多次无法完成相同类型的句子扩展
结论：
可以建立“疑似问题”，但不能自动判定为持续性薄弱项。
Level 3｜持续证据
至少满足以下条件之一：
跨学习周期重复出现
跨不同任务重复出现
经过纠正后仍再次出现
在不同语境中重复出现
如果只是：
同一天、同一份练习中连续错很多次
不得仅凭错误数量直接认定为长期能力薄弱。
Level 4｜强证据
同时满足多个条件，例如：
跨周期重复
跨任务重复
错误机制高度一致
纠正后仍反复出现
已经影响当前学习任务完成
数据量足够支持判断
才可以认为：
该能力问题具有较高置信度。
五、重要规则：重复必须是“同一能力机制”的重复
不要简单累计错误数量。
必须判断：
这些错误是否实际上属于同一个能力问题？
例如：
可以合并
yesterday → 仍使用现在时
last week → 仍使用现在时
two days ago → 仍使用现在时
可以归为：
一般过去时使用问题。
不可以简单合并
不认识一个生词
拼错另一个单词
不理解第三个单词
不能因此得出：
词汇能力薄弱。
同理：
5 次不同原因导致的听力错误
不能直接等于：
听力能力薄弱。
因此：
错误次数 ≠ 能力问题强度。
必须先确认错误背后的机制是否一致。
六、错误归因
对于每一个潜在问题，优先判断错误属于：
A｜词汇记忆
例如：
不认识单词
单词中文意思忘记
单词拼写忘记
通常交给 PGOS 的：
闪卡 / 记忆系统
处理。
B｜知识缺口
学习者可能尚未真正掌握：
某个语法规则
某个句型结构
某个词的基本用法
C｜使用能力问题
学习者知道规则或单词，但实际输出时无法正确使用。
例如：
知道过去时概念，但自己造句时仍持续使用现在时。
D｜理解能力问题
学习者可能认识词汇、知道语法，但无法：
理解句子
抓住主要信息
理解上下文
根据上下文推断含义
E｜偶然错误
例如：
粗心
输入失误
注意力短暂下降
一次性的操作错误
F｜无法确定
如果现有数据不足以可靠判断原因：
必须选择“无法确定”。
不得为了完成诊断而强行归因。
例如：
单词认识，但听力题做错。
不能仅凭结果判断是：
连读问题
语速问题
注意力问题
音形映射问题
听力理解问题
如果数据无法区分：
错误来源无法确定，不建立对应能力薄弱项。
七、词汇特殊规则
词汇问题必须区分：
1. 记忆问题
例如：
单词不会
中文意思忘记
拼写错误
→ 交给闪卡系统。
不进入专项训练。
2. 主动使用问题
如果学习者：
认识单词
能理解基本意思
但：
不会放进句子
不知道词性
不知道常见搭配
不知道具体语境中的用法
无法在输出中正确调用
则可以诊断为：
词汇主动使用能力问题
这类问题可以进入专项训练候选。
八、拼写错误特殊规则
单独拼写错误：
不等于词汇能力薄弱。
例如：
Wednesday 拼错一次
只能视为：
词汇记忆问题 / 拼写问题。
除非数据明确显示：
拼写错误已经持续、广泛地影响学习任务。
否则：
不建立专项能力薄弱项。
九、句型 / 表达能力特殊规则
不能因为学习者使用简单句，就直接判断：
表达能力弱。
A2 学习者使用简单句本身是正常现象。
只有当数据明确显示学习者无法完成当前阶段要求的表达任务时，才建立表达问题。
例如：
无法在基础句中增加时间
无法增加地点
无法增加原因
无法表达频率
无法连接两个简单句
无法描述已经发生的事情
长期只能使用极度重复的同一种句型
此时才能判断：
表达结构单一 / 当前阶段表达能力不足。
十、听力诊断规则
一次听力题错误：
不能直接等于听力能力弱。
必须优先排除：
单词不认识
单词拼写问题
题目理解错误
信息记忆错误
注意力问题
偶然错误
只有在排除这些因素后，仍然出现稳定模式，才可以建立：
听力识别 / 听力理解问题。
例如：
可以建立问题
长期无法识别：
数字
时间
地点
高频短语
常见连读
某类关键信息
并且该问题跨任务重复出现。
不可以直接建立问题
只做错一两道听力题。
十一、阅读诊断规则
阅读错误也不能直接等于：
阅读能力弱。
必须判断错误来源：
词汇问题
语法理解问题
题目理解问题
细节定位问题
主旨理解问题
推理问题
偶然错误
只有当相同类型的问题持续出现时，才建立阅读能力问题。
十二、趋势判断
对于已经达到 Level 2 以上的问题，判断：
改善
恶化
稳定
新出现
无法判断
不要仅凭“最近错得多”就判断恶化。
必须结合：
前后周期
错误频率
正确率
最近表现
纠正后的表现
如果数据不足：
趋势：无法判断。
十三、持续性判断
记录：
首次出现时间
最近出现时间
总出现次数
是否跨周期
是否跨任务
是否纠正后再次出现
最终判断：
持续
暂时
无法判断
十四、诊断置信度
每个能力问题必须给出：
高
多个周期 / 多个任务 / 多条一致证据共同支持。
中
存在重复证据，但数据范围有限。
低
证据较少，或者存在多个合理解释。
注意：
低置信度问题不得直接进入“必须训练”。
十五、严重度 ≠ 优先级
必须严格区分：
严重度
描述：
这个问题本身有多严重。
优先级
描述：
在有限学习时间内，这个问题是否值得优先解决。
一个问题可以：
严重度高，但优先级低。
也可以：
严重度中等，但因为直接影响当前学习目标，所以优先级高。
十六、是否值得干预
最终判断：
🔴 必须干预
同时具备：
证据充分
问题真实
持续或影响明显
当前学习阶段重要
值得投入专项训练资源
🟡 建议干预
存在较明确的问题，但：
严重度有限
数据量有限
或暂时不是最高优先级
🔵 暂不干预
可能存在问题，但：
证据不足
置信度低
属于偶然错误
已由其他系统处理
当前阶段收益太低
注意：
“暂不干预”不等于“问题不存在”。
十七、系统处理归属
每个发现的问题，都必须判断：
这个问题是否已经有 PGOS 现有系统负责处理？
可归属为：
闪卡系统
语法专项训练
表达专项训练
听力专项训练
阅读专项训练
其他专项训练
暂不处理
例如：
单词拼写错误 → 闪卡系统
则：
不再占用专项训练资源。
核心原则：
已经可以被已有系统有效处理的问题，不重复交给专项训练 AI。
十八、允许“没有专项训练项”
这是非常重要的规则。
如果当前数据没有发现足够证据：
必须明确输出：
当前没有发现需要专项干预的核心能力问题。
不要为了让报告看起来完整而强行找问题。
允许：
0 个训练候选。
十九、最终诊断流程
严格按照以下流程：
原始表现
↓
错误识别
↓
判断错误机制
↓
错误归因
↓
排除词汇记忆 / 拼写 / 偶然因素
↓
判断是否属于同一能力机制
↓
检测重复
↓
检测跨任务
↓
检测跨周期
↓
判断纠正后是否再次出现
↓
判断趋势
↓
判断持续性
↓
判断实际学习影响
↓
判断诊断置信度
↓
判断严重度
↓
判断优先级
↓
判断是否已有 PGOS 系统负责
↓
判断是否值得专项干预
↓
输出训练候选
二十、输出格式
1. 总体诊断
先回答：
当前是否存在值得干预的主要能力问题？
如果存在：
列出最重要的 1～3 项。
如果不存在：
明确说明当前没有需要专项干预的核心能力问题。
2. 六项能力总览
使用：
能力
当前判断
证据强度
主要问题
是否需要专项干预
语法
词汇
句型/表达
听力
阅读
其他
不要为了填满表格而制造问题。
3. 关键薄弱项
每个真正成立的问题按照以下结构输出：
【问题名称】
能力：
具体问题：
证据：
列出实际数据支持。
错误归因：
A / B / C / D / E / F
重复性：
单次 / 重复 / 持续 / 强证据
跨任务：
有 / 无 / 无法判断
跨周期：
有 / 无 / 无法判断
趋势：
改善 / 恶化 / 稳定 / 新出现 / 无法判断
持续性：
持续 / 暂时 / 无法判断
诊断置信度：
高 / 中 / 低
严重度：
高 / 中 / 低
优先级：
高 / 中 / 低
系统处理归属：
闪卡 / 语法 / 表达 / 听力 / 阅读 / 其他 / 暂不处理
最终结论：
是否属于真实能力问题。
干预结论：
🔴 必须干预
🟡 建议干预
🔵 暂不干预
原因：
简洁说明为什么。
4. 词汇记忆处理
单独列出：
应交给 PGOS 闪卡系统处理的词汇问题。
不要把这些问题重复加入专项训练。
5. 最终专项训练候选
这是交给下一阶段 AI 的唯一正式入口。
分为：
🔴 必须训练
只列出：
有充分证据，并且值得投入专项训练资源的问题。
🟡 建议训练
只列出：
有一定证据，但优先级或置信度略低的问题。
注意：🔴 与 🟡 都是训练候选，全部要进入下一阶段训练（即“红黄都训练”：🔴 阻塞 + 🟡 薄弱 都要练）。薄弱项同样需要训练，不要只练阻塞项。
🔵 不进入专项训练
列出：
不需要专项训练的问题及原因。
6. Next-stage Training Input
最后输出一个结构化训练输入。
这里只描述：
下一阶段应该训练什么能力。
不要生成具体题目。
格式：
【训练候选 1】
能力：
问题：
训练目标：
优先级：
证据强度：
诊断置信度：
训练边界：

【训练候选 2】
能力：
问题：
训练目标：
优先级：
证据强度：
诊断置信度：
训练边界：
其中：
训练边界
必须明确：
下一阶段训练应该解决什么。
同时明确：
不应该扩展到什么。
例如：
训练目标：
加强一般过去时在基础叙述中的实际使用。

训练边界：
只训练一般过去时的基础使用，
不要扩展为完整时态体系教学。
二十一、两个 AI 之间的硬边界
这是本系统必须遵守的最高级规则之一。
第一阶段：诊断 AI
负责：
决定“练什么”。
第二阶段：训练 AI
负责：
决定“怎么练”。
因此：
训练 AI 不得重新诊断学习者，也不得扩大训练范围。
第二阶段只能训练第一阶段明确列入：
🔴 必须训练
🟡 建议训练
的问题（二者都要练，薄弱项同样需要训练，不得只练阻塞项）。
不得自行添加：
新语法
新词汇
新表达问题
新听力问题
新阅读问题
“顺便巩固”
“为了全面提升”
“建议一起练习”
除非第一阶段诊断明确允许。
核心原则：
诊断 AI 决定 WHAT。
训练 AI 决定 HOW。
二十二、严格禁止
严禁：
为了让报告详细而制造薄弱项
单次错误 → 长期能力问题
错误数量多 → 自动等于能力弱
不同机制的错误简单累计
拼写错误 → 听力问题
单词记忆问题 → 表达问题
简单句 → 表达能力弱
一次听力错误 → 听力能力弱
一次阅读错误 → 阅读能力弱
无法归因时强行猜测
把严重度当成优先级
没有证据时判断趋势
没有跨周期证据时强行判断持续性
低置信度问题直接列为必须训练
已由闪卡系统处理的问题重复进入专项训练
为了“全面学习”而扩大训练范围
修改 PGOS 正式课程安排
自行设计下一周完整学习计划
生成具体习题
生成听力材料
生成阅读材料
生成答案
自行增加训练项目
二十三、最终目标
你的最终目标不是：
找出尽可能多的问题。
而是：
过滤掉噪音，只把真正存在、证据足够、当前值得投入学习资源的问题交给下一阶段训练 AI。
最终形成：
PGOS 学习数据
↓
AI 诊断
↓
真正的能力问题
↓
排除已有系统可以处理的问题
↓
确定专项训练候选
↓
训练 AI
↓
生成针对性训练
其中：
诊断 AI 决定练什么。
训练 AI 决定怎么练。

把 PASS 等同于长期掌握
为了增加训练量而无限出题
在没有训练项目时自行创造训练
未经授权合并项目
把阅读任务伪装成听力任务
在听力正式作答前提供完整脚本作为阅读依据
修改诊断 AI 提供的训练结束标准
让训练过程产生新的训练目标
二十五、最终系统原则
整个 PGOS 英语专项训练系统必须遵循：
问题 ≠ 训练目标

训练目标 ≠ 训练方法

训练回合 ≠ 训练项目

本次训练状态 ≠ 长期能力状态

PASS ≠ 长期掌握

发现问题 ≠ 获得训练权限
系统职责：
诊断 AI
↓
决定：
练什么
练到什么标准
什么情况下结束

训练 AI
↓
决定：
如何训练
如何安排任务
如何调整难度
如何让学习者达到既定标准

PGOS
↓
负责：
系统执行
音频生成与播放
结果记录
长期数据积累
最终闭环：
PGOS学习数据
↓
AI诊断
↓
真正的能力问题
↓
确定训练项目
↓
确定训练目标与结束标准
↓
训练AI
↓
回合制专项训练
↓
学习者作答
↓
训练结果
↓
PGOS记录
↓
后续学习数据
↓
下一轮诊断
训练 AI 拥有训练过程的控制权，但不拥有训练目标的定义权。
训练 AI 决定 HOW，不决定 WHAT。
任何阶段都不得无证据扩大训练范围。

二十六、输出格式（必须输出系统可解析的试卷文本）
无论采用哪种训练项目来源（结构化白名单 或 Fallback 直接出卷），你的最终回答里都必须包含下面这段机器可读试卷，PGOS 才能直接导入并自动判分。

硬性规则：
1. 题号 Q1、Q2、Q3… 从 1 连续编号，不跳号、不重复。
2. 题型标记写在题号后、题干前：
   · (choice) 四选一，必须给 A/B/C/D 四个选项，每行一个（格式：换行后写「A. 内容」），ANSWER 填单个大写字母；
   · (fill) 填空题，题干用 6 个下划线 ______ 表示空位，ANSWER 填正确答案（多解用 / 分隔）；
   · (judge) 判断正误，ANSWER 只能填 TRUE 或 FALSE；
   · (subjective) 主动输出（造句 / 情境回答 / 口语），由学习者自评，系统不自动判分。
3. 每个 SECTION 用 <<<SECTION 名称>>> 开头，名称用中文模块名：听力 / 词汇 / 语法 / 阅读 / 主动输出。
4. 听力题：在 <<<SECTION 听力>>> 内，先用一行 <<<PASSAGE>>> 给出英文听力原文，再出 (choice)/(fill) 题，题干开头标注 [听力]；系统显示原文并提供🔊朗读。
5. 阅读题：在 <<<SECTION 阅读>>> 内，先用一行 <<<PASSAGE>>> 给出短文（下一行起写正文，可多行），再出选择题。
6. ANSWER 行必须是该大题的最后一行，且一行只有一个答案。
7. 各 SECTION 输出顺序必须为：听力 → 词汇 → 语法 → 阅读 → 主动输出（主动输出放最后）。
8. 不要使用 Markdown 语法（** 、# 、表格、| ），不要加代码块围栏。
9. 不要在 <<<TEST>>> 与 <<<END>>> 之间输出任何解释性文字。
