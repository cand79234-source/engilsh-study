<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>English OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --border:#e8ecf4; --text:#1e293b; --muted:#7c8698;
  --primary:#4f46e5; --primary2:#6366f1; --primary-bg:#eef2ff;
  --green:#16a34a; --green-bg:#f0fdf4; --red:#dc2626; --amber:#d97706;
  --radius:14px; --shadow:0 1px 3px rgba(15,23,42,.06);
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;overflow-x:hidden}
h1{font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13px;margin:2px 0 12px}

/* 顶部 */
.topbar{position:fixed;top:0;left:0;right:0;height:54px;background:#fff;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:50}
.brand{font-weight:800;font-size:17px;color:var(--primary)}
.prog-pill{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;border:none}
.prog-pill:active{opacity:.7}

/* 内容 */
.content{padding:66px 14px calc(var(--nav-h) + 24px);max-width:620px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.badge{background:var(--primary-bg);color:var(--primary);border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.starcs{color:#f59e0b;font-size:12px;letter-spacing:1px;white-space:nowrap}

/* 按钮 */
.btn{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;min-height:44px}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn.green{background:var(--green)}
.btn.sm{min-height:36px;padding:7px 14px;font-size:13px}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1;text-align:center;min-width:100px}

/* 进度 */
.progressbar{height:9px;background:var(--border);border-radius:20px;overflow:hidden;margin:8px 0 4px}
.progressbar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:20px;transition:.3s}
.metric{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.metric b{color:var(--text)}

/* 词汇 */
.word{display:flex;justify-content:space-between;align-items:center;padding:12px 13px;border:1px solid var(--border);
  border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.word:active{background:var(--primary-bg)}
.word .en{font-weight:700;font-size:15px}
.word .cn{color:var(--muted);font-size:12.5px}
.word .ph{color:var(--muted);font-weight:500;font-size:12px;margin-left:5px}
.word.done{background:var(--green-bg);border-color:#bbf7d0}
.word.done .en{color:var(--green)}
.word.open{border-color:var(--primary);background:var(--primary-bg)}
.detail{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:13px;margin:-2px 0 10px;font-size:14px}
.detail .row{margin:4px 0}
.detail .lbl{color:var(--muted);font-size:12px}
.colloc{background:#e0e7ff;color:var(--primary);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:800;display:inline-block;margin:3px 6px 3px 0;cursor:pointer;user-select:none;border:1px solid #cdd6f6}
.colloc:active{background:var(--primary);color:#fff;transform:scale(.96)}
.hl{color:var(--primary);font-weight:800;background:transparent}
.tk{cursor:pointer;border-bottom:1px dotted rgba(59,130,246,.4)}
.tk:active{background:var(--primary-bg)}
.detail .row.exrow .tran .hl{background:none}
.detail .row.exrow{margin:9px 0 0;padding-top:8px;border-top:1px dashed #e0e7ff}
.exrow .tran{margin-left:0}
.tran{color:var(--green);font-size:12.5px;margin-top:3px;line-height:1.5}

/* 造句 */
.sinput{width:100%;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;margin-top:6px}
.sinput:focus{outline:none;border-color:var(--primary)}
.sitem{margin-bottom:15px}
.sq{font-size:13.5px;font-weight:600;margin:6px 0 2px}
.res{background:var(--primary-bg);border:1px solid #e0e7ff;border-radius:11px;padding:11px;margin-top:8px;font-size:13.5px}
.res.good{background:var(--green-bg);border-color:#bbf7d0}
.errtype{display:inline-block;background:#fee2e2;color:var(--red);border-radius:7px;padding:1px 9px;font-size:12px;margin-top:7px;font-weight:600}
.spk{cursor:pointer;font-size:16px;user-select:none;line-height:1;display:inline-flex}
.spk:active{transform:scale(.9)}
.fold-ic{cursor:pointer;font-size:17px;line-height:1;color:var(--muted);padding:8px 9px;border-radius:10px;user-select:none;display:inline-flex;align-items:center;justify-content:center;min-width:34px;min-height:34px;transition:.12s}
.fold-ic:active{transform:scale(.92);background:rgba(0,0,0,.06)}

/* 复习 */
.rev{padding:12px 0}
.rev .prompt{font-size:15px;font-weight:600;margin-bottom:9px;line-height:1.5}
.revb{display:flex;gap:9px;margin-top:9px}
.revb .btn{flex:1}
.ansbox{color:var(--muted);font-size:13px;margin-top:8px}
.optb{border:1.5px solid var(--border);background:#fff;padding:9px 12px;border-radius:9px;font-size:13.5px;cursor:pointer;margin:0 5px 6px 0;min-width:56px}
.optb:active{opacity:.8}
.optb.chosen{background:var(--primary);color:#fff;border-color:var(--primary)}
.optb.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.optb.no{background:var(--red-bg);border-color:var(--red);color:var(--red)}

/* 设置 */
label{font-size:13px;color:var(--muted);display:block;margin:9px 0 5px;font-weight:600}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;font-size:14.5px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{font-family:monospace;font-size:13px;min-height:110px;line-height:1.6}
.stepper{display:flex;align-items:center;gap:7px}
.stepper button{width:42px;height:42px;flex-shrink:0;border:1.5px solid var(--primary);background:#fff;color:var(--primary);border-radius:10px;font-size:20px;cursor:pointer}
.stepper input{text-align:center}
.tagline{font-size:12.5px;color:var(--muted);background:#f8fafc;border:1px dashed var(--border);border-radius:9px;padding:8px 11px;margin:6px 0}

/* 底部导航 */
.bottomnav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:#fff;
  border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;cursor:pointer}
.bottomnav a .ico{font-size:22px;line-height:1}
.bottomnav a.active{color:var(--primary)}

/* 弹窗 / 进度调整 */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:90}
.overlay.show{display:flex}
.sheet{width:100%;max-width:620px;background:#fff;border-radius:20px 20px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));
  max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-size:17px;font-weight:800;margin-bottom:2px}
.sheet .close{float:right;border:none;background:#f1f5f9;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer}
#seg_stage{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}
#seg_stage button{border:1.5px solid var(--border);background:#fff;padding:7px 8px;border-radius:9px;font-size:12.5px;cursor:pointer;text-align:center;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seg_stage button.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
#seg_stage button small{display:block;font-size:9.5px;font-weight:400;opacity:.8}
.seg button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.sticky-actions{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:#fff;margin:0 -16px calc(-16px - env(safe-area-inset-bottom));
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);z-index:2}
.pickgrid button{border:1.5px solid var(--border);background:#fff;padding:9px 0;border-radius:9px;font-size:13px;cursor:pointer;text-align:center}
.pickgrid button.on{background:var(--primary-bg);color:var(--primary);border-color:var(--primary);font-weight:700}
.errcount{font-size:12px;font-weight:700;background:#fee2e2;color:var(--red);border-radius:20px;padding:2px 8px}
.pill-mini{display:inline-flex;align-items:center;gap:5px;background:#f1f5f9;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700}

/* 听力 · 手写填空 */
.dlgbox{background:#fafbff;border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-top:8px}
.gapin{display:inline-block;width:6.4em;min-width:58px;padding:2px 6px;margin:0 2px;
  border:1.5px solid var(--primary);border-radius:7px;font-size:14px;font-weight:700;
  color:var(--primary);background:#fff;text-align:center;vertical-align:middle;
  font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
.gapin::placeholder{color:#c7d2fe;font-weight:400}
.gapin:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-bg)}
.gapin.ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.gapin.no{border-color:var(--red);color:var(--red);background:#fef2f2}
.gapin.showans{border-style:dashed;color:var(--green)}
.gapna{display:inline-block;padding:2px 8px;margin:0 2px;border:1.5px dotted var(--muted);
  border-radius:7px;font-size:12px;color:var(--muted);background:#f8fafc}
.warnbox{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:9px;
  padding:8px 11px;font-size:12.8px;line-height:1.55;margin-top:8px}

/* 顶部返回条（长列表页用，免得滑到底才能返回） */
.stickybar{position:sticky;top:54px;z-index:40;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:9px 14px;margin:0 -14px 0 -14px;
  border-bottom:1px solid var(--border)}
.topback{display:inline-flex;align-items:center;gap:4px;background:var(--primary-bg);color:var(--primary);
  border:none;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
.topback:active{opacity:.7}

/* 薄弱项 · 固定 5 类清单 */
.weakcat{border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff}
.weakcat>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:800;background:#f8fafc;border-bottom:1px solid var(--border)}
.weakcat>summary::-webkit-details-marker{display:none}
.weakcat[open]>summary{border-bottom:1px solid var(--border)}
.wc-caret{margin-left:auto;font-size:12px;color:var(--muted);transition:transform .15s}
.weakcat[open] .wc-caret{transform:rotate(90deg)}
.weakcnt{font-size:11.5px;font-weight:800;border-radius:20px;padding:2px 9px;background:#f1f5f9;color:var(--muted)}
.weakcnt.hit{background:#fee2e2;color:#b91c1c}
/* 四大类标题旁的彩色感叹号：根据类内最严重项点亮（红=阻塞 / 黄=薄弱 / 蓝=记忆） */
.catmark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;color:#fff;font-weight:900;font-size:13px;line-height:1;flex-shrink:0}
.catmark-red{background:#dc2626}
.catmark-yellow{background:#f59e0b}
.catmark-blue{background:#2563eb}
.wcitem{padding:9px 13px;border-top:1px dashed var(--border);font-size:13.3px}
.wcitem.hit{background:#fffbeb}
.wcitem .wn{display:flex;align-items:flex-start;gap:7px;font-weight:700}
.wcitem.hit .wn{color:#92400e}
.wcitem .wd{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5}
/* 小类二级折叠：默认收起，行内只留「状态 + 名称 + 趋势」，点开才看证据与建议 */
.wcsub{border-top:1px dashed var(--border)}
.wcsub>summary{list-style:none;cursor:pointer;padding:9px 13px;display:flex;align-items:center;gap:7px;
  font-size:13.3px;font-weight:700;color:var(--muted)}
.wcsub>summary::-webkit-details-marker{display:none}
.wcsub>summary .wclabel{flex:1;min-width:0}
.wcsub.hit>summary{background:#fffbeb;color:#92400e}
.wcsub .wc-caret{font-size:11px;color:var(--muted);transition:transform .15s;flex-shrink:0}
.wcsub[open] .wc-caret{transform:rotate(90deg)}
.wcsub .wcbody{padding:0 13px 10px 13px;font-size:12.5px;color:var(--muted);line-height:1.6}
.wcsub.hit .wcbody{background:#fffbeb}
.wctrend{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 7px;flex-shrink:0;white-space:nowrap}
.tr-improve{background:#dcfce7;color:#15803d}
.tr-worsen{background:#fee2e2;color:#b91c1c}
.tr-flat{background:#f1f5f9;color:#64748b}
.tr-new{background:#dbeafe;color:#1d4ed8}
.tr-unknown{background:#f1f5f9;color:#94a3b8}
/* 必加 1~3：严重度 / 本周上周趋势 / 持续性，内联在小类展开内容里 */
.sevline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.sev{font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px;flex-shrink:0}
.sev-block{background:#fee2e2;color:#b91c1c}
.sev-weak{background:#fef3c7;color:#b45309}
.sev-mem{background:#dbeafe;color:#1d4ed8}
.sevnote{font-size:11.5px;color:var(--muted)}
.wkline{font-size:12px;color:#475569;margin-top:4px;line-height:1.5}
.wkline b{color:#0f172a}
/* 错误概览/本周需注意 一行一项，加粗与同行同字号 */
.sumrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;line-height:1.6;padding:2px 0}
.sumrow b{font-weight:800;color:var(--text)}
.sumrow .srl{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumrow .srr{flex-shrink:0;margin-left:8px;color:var(--muted)}
/* 趋势图底部注释，统一小字 */
.trendnote{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
/* 错误概览顶部图例 */
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin:2px 0 7px}
/* 补习 / 专项训练 */
.tproj{border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden;background:#fff}
.tproj>summary{list-style:none;cursor:pointer;padding:11px 13px;display:flex;align-items:center;gap:8px;
  font-size:14px;font-weight:800;background:#f8fafc;border-bottom:1px solid var(--border)}
.tproj>summary::-webkit-details-marker{display:none}
.tproj[open]>summary{border-bottom:1px solid var(--border)}
.tbody{padding:11px 13px}
.trow{display:flex;gap:8px;font-size:13.2px;line-height:1.6;padding:2px 0}
.trow .tk{color:var(--muted);flex-shrink:0;min-width:62px}
.lvl{font-size:11px;font-weight:800;border-radius:20px;padding:2px 8px;flex-shrink:0}
.lvl.must{background:#fee2e2;color:#b91c1c}
.lvl.sug{background:#fef3c7;color:#b45309}
.lvl.no{background:#f1f5f9;color:#64748b}
.st{font-size:11px;font-weight:800;border-radius:20px;padding:2px 8px;flex-shrink:0}
.st.not_started{background:#f1f5f9;color:#64748b}
.st.continue{background:#dbeafe;color:#1d4ed8}
.st.review{background:#fef3c7;color:#b45309}
.st.done{background:#dcfce7;color:#15803d}
.tq{background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-top:9px}
.tq .qtext{font-size:14.5px;line-height:1.65;font-weight:600}
.qin{width:100%;margin-top:9px;border:1.5px solid var(--border);border-radius:9px;padding:10px 11px;
  font-size:15px;font-family:inherit;background:#fff;color:var(--fg)}
.qin:focus{outline:none;border-color:var(--primary)}
.opts{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.opt{border:1.5px solid var(--border);border-radius:9px;padding:9px 11px;font-size:14px;background:#fff;cursor:pointer}
.opt.sel{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);font-weight:700}
.opt.ok{border-color:#16a34a;background:#dcfce7;color:#15803d;font-weight:700}
.opt.no{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
.hintbox{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:9px 11px;margin-top:8px;
  font-size:13.2px;line-height:1.6;color:#92400e}
.verdict{border-radius:10px;padding:10px 12px;margin-top:9px;font-size:13.5px;line-height:1.65}
.verdict.pass{background:#dcfce7;color:#15803d;border:1px solid #86efac}
.verdict.review{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.verdict.notyet{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.thist{border-top:1px dashed var(--border);padding:9px 13px;font-size:12.8px;line-height:1.6}
.thist:first-child{border-top:none}
.codebox{width:100%;min-height:130px;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;
  font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.55;
  background:#f8fafc;color:var(--fg);resize:vertical}
.codebox:focus{outline:none;border-color:var(--primary)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">English OS</div>
  <button class="prog-pill" id="topProg" onclick="openProg()">阶段0 · W1 · D1</button>
</div>
<main class="content" id="content"></main>
<div class="bottomnav">
  <a data-page="learn" class="active"><span class="ico">📖</span><span>学习</span></a>
  <a data-page="listen"><span class="ico">🎧</span><span>听力</span></a>
  <a data-page="review"><span class="ico">🔁</span><span>复习</span></a>
  <a data-page="test"><span class="ico">📝</span><span>测评</span></a>
  <a data-page="sum"><span class="ico">📊</span><span>总结</span></a>
</div>
<!-- 进度调整弹窗 -->
<div class="overlay" id="progOverlay" onclick="if(event.target===this)closeProg()">
  <div class="sheet" id="progSheet"></div>
</div>
<script>
/* ---------- API 封装：自动带 X-Auth-Token + 401 弹输入框 ----------
   部署在公网时，Render 控制台设了 EOS_TOKEN 之后所有 /api/* 都要口令。
   这个 wrapper 帮我们：
   1) 默认从 localStorage 取 eos_token，自动加到 X-Auth-Token 请求头
   2) 收到 401 时弹一个输入框，让用户填口令，存回 localStorage 后自动重试
   3) 本地模式（服务端未设 EOS_TOKEN）下永远不弹框，所有响应是 200
   口令本身永远不会出现在代码或 git 里——用户首次访问时自己输入并存在浏览器。
   ----------------------------------------------------------------- */
const EOS_TOKEN_KEY = 'eos_token';

function getEosToken() {
  try { return localStorage.getItem(EOS_TOKEN_KEY) || ''; } catch (_) { return ''; }
}
function setEosToken(t) {
  try {
    if (t) localStorage.setItem(EOS_TOKEN_KEY, t);
    else localStorage.removeItem(EOS_TOKEN_KEY);
  } catch (_) {}
}

function promptEosToken() {
  // 单输入框；空 = 取消
  const v = window.prompt('请输入访问口令（EOS_TOKEN）：', '');
  return (v == null) ? null : v.trim();
}

// 数据走同源后端：页面与后端同域部署，所有 /api 请求走相对路径
const API_BASE = '';

async function apiRaw(p, opt) {
  // 真正的 fetch：带 token、透传 opt
  const headers = Object.assign({}, (opt && opt.headers) || {});
  const tok = getEosToken();
  if (tok && !headers['X-Auth-Token'] && !headers['x-auth-token']
            && !headers['Authorization'] && !headers['authorization']) {
    headers['X-Auth-Token'] = tok;
  }
  const finalOpt = Object.assign({}, opt || {}, { headers });
  const r = await fetch(API_BASE + '/api' + p, finalOpt);
  return r;
}

async function api(p, opt) {
  let r = await apiRaw(p, opt);
  if (r.status !== 401) return r.json();
  // 401：先清掉旧 token（可能输错了），再问一次
  setEosToken('');
  const v = promptEosToken();
  if (!v) {
    // 用户取消：把 401 原文透出
    let body = null;
    try { body = await r.json(); } catch (_) {}
    return body || { ok: false, error: '未授权：缺少访问口令（EOS_TOKEN）。' };
  }
  setEosToken(v);
  r = await apiRaw(p, opt);
  if (r.status === 401) {
    setEosToken('');  // 还是错的，清掉
    let body = null;
    try { body = await r.json(); } catch (_) {}
    return body || { ok: false, error: '访问口令错误。' };
  }
  return r.json();
}

/* 例句内固定搭配高亮：把例句中出现的搭配词组（含变体词形）加粗 */
function _norm(w){
  // 轻量词形归一：小写 + 去常见后缀，用于比较词根
  if(!w)return '';
  w=String(w).toLowerCase();
  if(w.length<=3)return w;
  if(/[^a-z]/.test(w))return w.replace(/[^a-z]/g,'');
  let r=w;
  // 不规则高频
  const irr={went:'go',gone:'go',been:'be',were:'be',had:'have',made:'make',did:'do',said:'say',
             saw:'see',took:'take',got:'get',gave:'give',found:'find',felt:'feel',knew:'know',
             taught:'teach',bought:'buy',thought:'think',spoke:'speak',wrote:'write',came:'come',
             became:'become',began:'begin',built:'build',caught:'catch',chose:'choose',drove:'drive',
             grew:'grow',heard:'hear',kept:'keep',left:'leave',met:'meet',paid:'pay',put:'put',
             ran:'run',sent:'send',sat:'sit',stood:'stand',told:'tell',understood:'understand',won:'win'};
  if(irr[r])return irr[r];
  // 去词缀：-ing/-ed/-d/-es/-s/-ies
  if(r.endsWith('ing')){const b=r.slice(0,-3);if(b.endsWith('e'))return b;return b;} // come->coming→com? 近似用 b
  if(r.endsWith('ied'))return r.slice(0,-3)+'y';
  if(r.endsWith('ed'))return r.slice(0,-2);
  if(r.endsWith('d'))return r.slice(0,-1);
  if(r.endsWith('ies'))return r.slice(0,-3)+'y';
  if(r.endsWith('es'))return r.slice(0,-2);
  if(r.endsWith('s'))return r.slice(0,-1);
  return r;
}
const _SKIP=['a','an','the'];   // 退化匹配时排除的纯冠词
function hlColloc(sentence, phrases){
  if(!sentence)return esc(sentence||'');
  if(!phrases||!phrases.length)return esc(sentence);
  // 把原文切块：字 + 分隔
  const segs=[]; // {txt:词原文, w:归一后的词|null}
  let m;
  const re=/([A-Za-z][A-Za-z'’-]*)|([^A-Za-z]+)/g;
  while((m=re.exec(sentence))!==null){
    if(m[1])segs.push({txt:m[1], w:_norm(m[1])});
    else segs.push({txt:m[0], w:null});
  }
  const marked=new Array(segs.length).fill(false);
  function tryMatch(pWords){
    // 滑动窗口：例句某起点起，依次匹配目标词（跳过标点），全部命中则标记
    for(let s=0;s<segs.length;s++){
      if(segs[s].w==null)continue;
      let j=0, hit=true, pidx=[];
      for(let i=s;i<segs.length&&j<pWords.length;i++){
        if(segs[i].w==null)continue;           // 跳过标点/空格
        if(segs[i].w===pWords[j]){pidx.push(i);j++;}
        else { hit=false; break; }             // 必须连续命中
      }
      if(hit&&j===pWords.length){ for(const k of pidx)marked[k]=true; return true; }
    }
    return false;
  }
  for(const ph of phrases){
    const words=String(ph).split(/\s+/).map(x=>x.replace(/[«»「」]/g,'')).filter(Boolean).map(_norm).filter(Boolean);
    if(!words.length)continue;
    // 完整顺序匹配（变体已由 _norm 拉平）
    tryMatch(words);
  }
  // 若完整词组未连续出现，退化为只标该搭配里最长的那个实词（通常是核心名词/动词），
  // 避免把句子里所有沾边的介词/通用动词都标粗。每搭配至多补一组。
  const _STOP=/^(a|an|the|for|of|in|on|at|to|with|from|by|be|is|are|was|were|and|or|as|do|does|did)$/;
  for(const ph of phrases){
    const ws=String(ph).split(/\s+/).map(x=>x.replace(/[«»「」]/g,'')).filter(Boolean).map(_norm);
    // 从长到短取候选（实词），先试最长的那个
    const cand=ws.filter(w=>w&&!_STOP.test(w)).sort((a,b)=>b.length-a.length);
    if(!cand.length)continue;
    let done=false;
    for(const c of cand){
      // 找例句中第一个未标记的该词
      for(let i=0;i<segs.length;i++){
        if(!marked[i]&&segs[i].w===c&&segs[i].txt.length>=3){marked[i]=true;done=true;break;}
      }
      if(done)break;
    }
  }
  // 拼接：每个英文词包成可点 span（欧陆式点词查义），搭配词组保持加粗
  let out='';
  for(let i=0;i<segs.length;i++){
    const s=segs[i];
    if(s.w!=null){
      const inner = marked[i] ? '<b class="hl">'+esc(s.txt)+'</b>' : esc(s.txt);
      out += '<span class="tk" data-act="wlookup" data-val="'+esc(s.txt.toLowerCase())+'">'+inner+'</span>';
    } else {
      out += esc(s.txt);
    }
  }
  return out;
}

// 离线发音：浏览器本地 TTS（优先选本机已下载的英文语音，无需联网/无外部服务）
let _voices=[], _voice=null, _voiceReady=false;
function _enVoices(vs){
  return (vs||[]).filter(v=>/^en/i.test(v.lang||''));
}
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  let vs=[];
  try{ vs=speechSynthesis.getVoices()||[]; }catch(e){ return; }
  // 语音列表还没异步加载好：保持原状，等 onvoiceschanged / 定时轮询
  if(!vs.length) return;
  _voices=vs; _voiceReady=true;
  const en=_enVoices(vs);
  // 优先：本机离线可用(localService=true，非联网合成)的美/英音；其次 google；最后任意英文
  const usuk=en.filter(v=>/en(-|_)?(US|GB|UK)/i.test(v.lang));
  _voice=(usuk.find(v=>v.localService)||en.find(v=>v.localService))
      ||usuk.find(v=>/google/i.test(v.name))
      ||usuk[0]||en[0]||null;
}
if('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
  // 部分浏览器/微信内核首次 getVoices() 返回空，需要反复触发才会填充
  let _vt=0;
  const _vi=setInterval(()=>{pickVoice(); if(_voiceReady||(++_vt>12)) clearInterval(_vi);},250);
}
function hasEnglishVoice(){
  if(!('speechSynthesis' in window)) return false;
  try{
    const vs=speechSynthesis.getVoices();
    if(vs&&vs.length) return _enVoices(vs).length>0;
    return !!_enVoices(_voices).length;
  }catch(e){return !!_enVoices(_voices).length;}
}
function speak(text){
  if(!text)return;
  const ss=window.speechSynthesis;
  if(!ss){toast('当前浏览器不支持语音朗读，建议换用 Chrome / Safari 打开');return;}
  // 每次同步刷新一次语音列表（voices 常是异步就绪的）。
  // 注意：这里绝不能 await，否则 iOS 会因"不在用户手势同步栈内"而拒绝发声。
  try{ pickVoice(); }catch(e){}
  try{ ss.cancel(); }catch(e){}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=0.92; u.pitch=1;
  // 拿得到英文语音就用它；拿不到就不设 voice，交给浏览器默认语音兜底
  // （旧版在这里"检测不到英文语音就 return"，导致大量手机点了没反应）
  if(_voice) u.voice=_voice;
  try{ ss.resume(); }catch(e){}

  let started=false;
  u.onstart=()=>{started=true;};
  u.onerror=(e)=>{
    const err=(e&&e.error)||'';
    if(err==='not-allowed'){
      toast('系统不允许朗读：检查手机是否处于静音、浏览器是否禁用了语音');
    }else if(err==='language-unavailable'||err==='voice-unavailable'){
      toast('设备缺少英文语音包，请在系统“设置→语言和语音”里下载英语语音后重试');
    }else if(err==='interrupted'||err==='canceled'){
      // 用户自己打断，不提示
    }else if(err){
      toast('朗读失败（'+err+'），建议换用系统浏览器打开');
    }else{
      toast('朗读失败，建议换用 Chrome / Safari 打开');
    }
  };
  try{ ss.speak(u); }catch(e){ toast('朗读失败：'+(e&&e.message||e)); return; }

  // Chrome 已知 bug：paused 状态下不发声，补一次 resume
  setTimeout(()=>{ try{ if(ss.paused) ss.resume(); }catch(e){} },150);
  // 兜底：说不出来且没有任何事件（多见于微信内核不支持 TTS），给可操作提示
  setTimeout(()=>{
    if(started) return;
    try{
      if(!ss.speaking && !ss.pending && !hasEnglishVoice()){
        toast('这个浏览器可能不支持朗读，建议用系统浏览器（Safari/Chrome）打开本页');
      }
    }catch(e){}
  },1200);
}

function fixSentenceTask(raw){
  if(!raw) return raw;
  let s=String(raw);
  // 出题别扭修复：后端给普通名词（luggage/passport…）套了「自我介绍」分类，
  // 生成出"写一句关于你自己的话（名字/身份/来自哪里）"这种违和题干。
  // 这里只在前端把强制的"自我介绍/名字身份来自哪里"框架改通顺，不影响后端批改与扩写。
  s=s.replace(/关于你自己的话（名字\/身份\/来自哪里）/g,'和你有关的、生活里会用到的句子');
  s=s.replace(/关于你自己的连续表达/g,'和你有关的连续表达');
  s=s.replace(/关于你自己的话/g,'和你有关的句子');
  s=s.replace(/关于你自己/g,'和你自己');
  return s;
}
async function renderSentencePlan(t){

  const _words=[...p.basic.map(b=>b.word), ...(p.upgrade||[]).map(u=>u.word),
    ...(p.combo||[]).flatMap(c=>(c.words||[]).map(w=>w.word))].filter(Boolean);
  try{
    const _sm=await api('/output/stars',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({words:_words})});
    state.starMap=(_sm&&_sm.stars)||{};
  }catch(e){ state.starMap={}; }

  // ① 基础：每词一句
  document.getElementById('sentences').innerHTML=p.basic.map((b,i)=>{
    const tk='basic:'+i;
    state.tkMeta[tk]={word:b.word||'', task:fixSentenceTask(b.task)||'', label:fixSentenceTask(b.task)||'', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${b.i}. ${esc(fixSentenceTask(b.task))}${starBadge(b.word)}${b.focus?' <span class="badge" style="background:#fef3c7;color:#92400e">★重点</span>':''}</div>`,
      '写一个英文句子…', false);
  }).join('') || '<div class="sub">今天没有新词。</div>';

  // ② 升级：给方向 + 示范句
  document.getElementById('upgrades').innerHTML=(p.upgrade||[]).map((u,i)=>{
    const tk='up:'+i;
    state.tkMeta[tk]={word:u.word||'', task:fixSentenceTask(u.task)||'', label:'升级「'+(u.word||'')+'」', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${u.i}. 升级「<b>${esc(u.word)}</b>${starBadge(u.word)}${u.meaning?'（'+esc(u.meaning)+'）':''}」
        <span class="badge" style="background:#fef3c7;color:#92400e">${esc(u.direction)}</span>
        ${u.is_review?'<span class="badge" style="background:#fee2e2;color:#b91c1c">复习词</span>':''}</div>
      <div class="sub" style="margin:4px 0">${esc(u.direction_desc)}</div>
      <div class="sub" style="margin:4px 0;color:var(--muted)">示范：${esc(u.sample)}</div>
      ${u.collocation?`<div class="sub" style="margin:4px 0">可用搭配：<b>${esc(u.collocation)}</b></div>`:''}`,
      '把第①段的句子改得更自然…', false);
  }).join('') || '<div class="sub">今天的词还够不上升级，先把基础句写完。</div>';

  // ③ 组合：2-3 个词写成连续表达
  document.getElementById('combos').innerHTML=(p.combo||[]).map((c,i)=>{
    const tk='combo:'+i;
    state.tkMeta[tk]={word:(c.words||[]).map(w=>w.word).join(' '), task:fixSentenceTask(c.scene)||'', label:fixSentenceTask(c.scene)||'', grammar:g};
    return itemHtml(tk,
      `<div class="sq">${c.i}. ${esc(fixSentenceTask(c.scene))}</div>
      <div class="sub" style="margin:4px 0">${(c.words||[]).map(w=>`<span class="badge" style="background:${w.review?'#fee2e2;color:#b91c1c':'var(--primary-bg);color:var(--primary)'}">${esc(w.word)}${starBadge(w.word)}${w.meaning?'·'+esc(w.meaning):''}${w.review?' 🔁':''}</span>`).join(' ')}</div>
      <div class="sub" style="margin:4px 0;color:var(--muted)">${esc(c.hint||'建议 2-3 句，写多写少随意，不强制。')}</div>`,
      '写 2-3 句连续表达（写多写少随意）…', true);
  }).join('') || '<div class="sub">今天没有可组合的词。</div>';

  planKeys().forEach(tk=>renderAttempts(tk));
  planProgress();
}

function starBadge(w){
  const s=state.starMap?state.starMap[(w||'').toLowerCase()]:undefined;
  if(s===undefined) return '';
  return ` <span class="starcs" title="主动输出熟练度 ${s}/5">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>`;
}

/* 单题外壳：题干 + 输入框 + 批改按钮 + 结果区 + 历史区。
   每句可单独折叠：点题干右侧的 ▾/▴ 收起来，避免"一句改很多次"把页面拉得很长。 */
function itemHtml(tk, headHtml, ph, isArea){
  const n=histOf(tk).length;
  const inp=isArea
    ? `<textarea class="sinput" id="in_${tk}" rows="3" placeholder="${esc(ph)}"></textarea>`
    : `<input class="sinput" id="in_${tk}" placeholder="${esc(ph)}">`;
  return `<div class="sitem">
    <div style="display:flex;align-items:flex-start;gap:8px">
      <div style="flex:1;min-width:0">${headHtml}</div>
      <span class="fold-ic" data-act="senItemFold" data-senitem-ic title="折叠/展开">▽</span>
    </div>
    <div class="sitem-body">
    ${inp}
    <div class="btnrow">
      <button class="btn ghost sm" data-act="check" data-val="${tk}">✍️ 批改${n?'（第 '+(n+1)+' 次）':''}</button>
      <button class="btn ghost sm" data-act="redo" data-val="${tk}" style="${n?'':'display:none'}" id="redo_${tk}">✏️ 重新作答</button>
      <button class="btn ghost sm" data-act="copyOne" data-val="${tk}" data-val2="last" style="${n?'':'display:none'}" id="cp_${tk}">📋 复制</button>
    </div>
    <div id="res_${tk}"></div>
    </div>
  </div>`;
}

/* ---------- 提交批改 ---------- */
/* 任务完成度本地校验：后端只判「语法对不对」，不检查「题目让你写的东西你写没写」。
   所以会出现「I buy a ticket」这种——语法挑不出毛病，但题目要求写的是
   「现在 / 每天都做的事」，句子里既没频率也没时间，其实没完成题目。
   这里补一层规则把这类漏判捞回来，只加提示、不改动后端存的原始分。 */
function localTaskCheck(sentence, meta){
  const issues=[];
  const s=String(sentence||'').trim();
  if(!s) return issues;
  const low=s.toLowerCase();
  const toks=low.replace(/[^a-z0-9'\s-]/g,' ').split(/\s+/).filter(Boolean);

  // ① 目标词有没有真的写进去
  const w=String(meta.word||'').trim().toLowerCase();
  if(w){
    let has;
    if(/^[a-z][a-z'\-]*$/.test(w)){          // 单词：允许常见变形
      const stem=w.replace(/e$/,'');
      const forms=new Set([w, w+'s', w+'es', w+'ed', w+'ing',
        stem+'ing', stem+'ed', w.replace(/y$/,'ies'), w.replace(/y$/,'ied')]);
      has=toks.some(t=>forms.has(t)) || low.indexOf(w)>=0;
    }else{                                    // 短语：整段包含即可
      has=low.indexOf(w)>=0;
    }
    if(!has){
      issues.push({
        where:'没用上题目要求的「'+String(meta.word)+'」',
        explanation:'这个练习专门练「'+String(meta.word)+'」，句子里必须出现它。把它加进去再提交一次。'
      });
    }
  }

  // ② 题目要求写「现在 / 每天都做的事」→ 必须读得出频率或时间，或用现在进行时
  const t=String(meta.task||''), g=String(meta.grammar||'');
  const needHabit=/每天|每日|习惯|日常|固定安排/.test(t+g) || /现在进行时|正在做|此刻/.test(t);
  if(needHabit){
    const freq=/(always|usually|often|sometimes|never|seldom|rarely|every\s*day|every\s*morning|every\s*evening|every\s*night|every\s*week|everyday|once\s+a\s+week|twice\s+a\s+week|on\s+(?:mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays|weekdays|weekends)|in\s+the\s+(?:morning|afternoon|evening)|at\s+night|after\s+(?:work|school|dinner)|these\s+days|nowadays)/.test(low);
    const cont=/\b(?:am|is|are|'m|'s|'re)\s+[a-z]+ing\b/.test(low);
    if(!freq && !cont){
      issues.push({
        where:'题目要求写「现在 / 每天都做的事」，但你这句读不出频率或时间',
        explanation:'「'+s+'」只像一次性动作，看不出「经常 / 每天」。补一个频率或时间就成立，'+
          '比如 every day / usually / in the morning；或者直接用现在进行时：'+
          (w?('I am '+w.replace(/^to\s+/,'')+'ing ... now'):'I am ...ing now')+'。'
      });
    }
  }
  return issues;
}

async function submitSentence(tk){
  const inp=document.getElementById('in_'+tk);
  const v=(inp&&inp.value||'').trim();
  if(!v){toast('先写一个句子');return;}
  const meta=(state.tkMeta||{})[tk]||{};
  const btn=document.querySelector('[data-act="check"][data-val="'+tk+'"]');
  if(btn){btn.disabled=true;btn.textContent='批改中…';}
  try{
    const r=await api('/sentence/check',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sentence:v, word:meta.word||'', task_key:tk,
        grammar:meta.grammar||'', prompt:meta.task||''})});
    if(!r||r.error){toast((r&&r.error)||'批改失败');return;}
    // 后端只判语法；这里补一层「题目要求做到没做到」的本地校验
    const localIssues=localTaskCheck(v, meta);
    const f=Object.assign({}, r);
    if(localIssues.length){
      f.task_issues=(r.task_issues||[]).concat(localIssues);
      f.ok=false;
      // 语法无误但没完成题目要求：压到及格线（85）以下，避免被判成「基本掌握」
      f.score=Math.min(Number(r.score||0), 74);
      f._local=1;
    }
    state.hist=state.hist||{}; state.hist[tk]=state.hist[tk]||[];
    state.hist[tk].push({
      id:f.sentence_id, attempt:f.attempt, sentence:f.original, corrected:f.corrected,
      score:f.score, verdict:f.verdict, ok:!!f.ok, error_type:f.error_type,
      status:f.status||'', errors:f.errors||[], task_issues:f.task_issues||[],
      optimizations:f.optimizations||[], created_at:f.created_at, _local:f._local||0});
    renderAttempts(tk);
    planProgress();
    // 组合题额外反馈：用到了哪几个建议词（只提示，不判错）
    if(tk.indexOf('combo:')===0) comboHint(tk,v);
  }catch(e){ toast('批改失败：'+e.message); }
  finally{ if(btn){btn.disabled=false;btn.textContent='✍️ 批改（第 '+(histOf(tk).length+1)+' 次）';} }
}
function comboHint(tk,txt){
  const c=(planOf(state.today).combo||[])[parseInt(tk.split(':')[1],10)];
  if(!c) return;
  const low=(txt||'').toLowerCase();
  const used=(c.words||[]).filter(w=>low.includes(String(w.word).toLowerCase()));
  const miss=(c.words||[]).filter(w=>!low.includes(String(w.word).toLowerCase()));
  const box=document.getElementById('res_'+tk);
  if(!box) return;
  box.insertAdjacentHTML('afterbegin',
    `<div class="sub" style="margin:6px 0">🎯 用到 ${used.length}/${(c.words||[]).length} 个建议词`
    + (used.length?`：<b>${used.map(w=>esc(w.word)).join('、')}</b>`:'')
    + (miss.length?` · 没用上的：${miss.map(w=>esc(w.word)).join('、')}（下次可以试试）`:' · 全部用上了 👍')
    + `</div>`);
}
function redoSentence(tk){
  const inp=document.getElementById('in_'+tk);
  if(inp){inp.value='';inp.focus();}
  toast('已清空，重新写一句吧 ✏️（上一次的作答已保留）');
}

/* ---------- 结果渲染：判定 / 分数 / 哪里错 / 为什么 / 正确 / 可优化 ---------- */
function renderAttempts(tk){
  const box=document.getElementById('res_'+tk);
  if(!box)return;
  const list=histOf(tk);
  const cp=document.getElementById('cp_'+tk), rd=document.getElementById('redo_'+tk);
  if(cp)cp.style.display=list.length?'':'none';
  if(rd)rd.style.display=list.length?'':'none';
  if(!list.length){box.innerHTML='';return;}
  box.innerHTML=list.map((a,i)=>attemptCard(a,tk,i,i===list.length-1)).join('');
}
/* 后端偶尔回传「你打的 l 已自动当作大写 I」这类输入法/字体噪音建议，
   和英语能力无关，看着还闹心 → 渲染与复制两处统一过滤掉。 */
function _optDropped(o){
  if(!o) return true;
  const t=String((o.suggestion||'')+' '+(o.reason||'')+' '+(o.sample||'')+' '+(o.note||''));
  return /自动当作大写|手机字体|长得一样|不存在单独的/.test(t);
}
function attemptCard(a,tk,i,isLast){
  const sc=Number(a.score||0);
  const errs=a.errors||[], opts=(a.optimizations||[]).filter(o=>!_optDropped(o)), tasks=a.task_issues||[];
  const hasErr=errs.length>0, hasTask=tasks.length>0;
  const pass = sc>=85 && !hasErr && !hasTask;
  let head;
  if(pass){
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--green)">✅ 正确 · ${sc}/100 · 基本掌握</div>`;
  }else if(hasErr){
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--red)">❌ 有错误 · ${sc}/100 · 需要改进</div>`;
  }else if(hasTask){
    head=`<div style="font-size:15.5px;font-weight:800;color:#b45309">⚠️ 未完成题目要求 · ${sc}/100 · 需要改进</div>`;
  }else{
    head=`<div style="font-size:15.5px;font-weight:800;color:var(--red)">❌ 有错误 · ${sc}/100 · 需要改进</div>`;
  }
  if(a.status==='UNCERTAIN'){
    head=`<div style="font-size:15.5px;font-weight:800;color:#b45309">⚠️ 系统无法完全判断 · ${sc}/100</div>`;
  }
  const errHtml = errs.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:var(--red)">🔍 哪里错了 / 为什么错</div>`
      + errs.map((e,j)=>`<div style="background:#fff;border:1px solid #fecaca;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">❌ <b>哪里错了：</b><span style="color:var(--red);font-weight:700">${esc(e.where)}</span>
          ${e.type?`<span class="errtype" style="margin-left:5px">${esc(e.type)}</span>`:''}</div>
        <div style="font-size:13.5px;color:#475569;margin-top:4px">💡 <b>为什么错：</b>${esc(e.explanation)}</div>
        <div style="font-size:13.5px;margin-top:4px">✅ <b>正确表达：</b><b style="color:var(--green)">${esc(e.correct)}</b></div>
      </div>`).join('')
    : (hasTask?`<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">✅ 没有明显语法错误</div>`
                :`<div style="margin-top:6px;font-size:13.5px;color:var(--muted)">✅ 没有明显错误</div>`);
  const taskHtml = tasks.length
    ? `<div style="margin-top:7px;font-size:13px;font-weight:800;color:#b45309">📋 题目要求（需补齐，不计入语法错误）${a._local?'<span style="font-weight:400;color:var(--muted);font-size:12px"> · 本地补检：语法没问题，但题目没做到</span>':''}</div>`
      + tasks.map((e,j)=>`<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:8px 10px;margin:6px 0">
        <div style="font-size:13.5px">⚠️ <b>未完成：</b><span style="color:#b45309;font-weight:700">${esc(e.where)}</span></div>
        <div style="font-size:13.5px;color:#475569;margin-top:4px">💡 ${esc(e.explanation)}</div>
      </div>`).join('')
    : '';
  const corHtml = (!pass && a.corrected && a.corrected!==a.sentence)
    ? `<div style="margin-top:6px;font-size:13.5px">📗 <b>整句正确写法：</b><b style="color:var(--green)">${esc(a.corrected)}</b></div>`:'';
  // 参考建议：合并润色 + 扩写，避免重复大标题，统一用简洁 bullet
  const tips=[];
  opts.forEach(o=>{
    if(!o) return;
    if(o.kind==='expand'){
      tips.push(`<span style="color:var(--primary);font-weight:700">扩写：</span>${esc(o.sample)}<span style="color:var(--muted);font-size:12.5px"> — ${esc(o.note||'')}</span>`);
    }else if(o.suggestion||o.reason){
      const sug=o.suggestion?`<b style="color:var(--green)">${esc(o.suggestion)}</b>`:'';
      const rsn=o.reason?`<span style="color:var(--muted);font-size:12.5px">${sug?' — ':''}${esc(o.reason)}</span>`:'';
      tips.push(sug+rsn);
    }
  });
  const tipsHtml = tips.length
    ? `<div style="margin-top:8px">
        <div style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:5px">💡 参考建议（原句没错，仅供参考，不扣分）</div>
        ${tips.map(t=>`<div style="font-size:13.5px;line-height:1.55;padding:4px 0;padding-left:16px;text-indent:-13px">● ${t}</div>`).join('')}
      </div>`
    : '';
  return `<div class="res ${pass?'good':''}" style="margin-top:8px;${isLast?'':'opacity:.72'}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <div style="min-width:0">
        <div style="font-size:12px;color:var(--muted)">第 ${a.attempt||i+1} 次作答${isLast?' · <b style="color:var(--primary)">最新</b>':''}</div>
        ${head}
      </div>
      <button class="btn ghost sm" style="flex-shrink:0" data-act="copyOne" data-val="${tk}" data-val2="${a.attempt}">📋 复制</button>
    </div>
    <div style="margin-top:5px;font-size:14px;line-height:1.6">${esc(a.sentence)}</div>
    ${errHtml}${taskHtml}${corHtml}${tipsHtml}
  </div>`;
}

/* ---------- 复制 ---------- */
function copyOne(tk, which){
  const list=histOf(tk);
  if(!list.length){toast('还没有批改记录');return;}
  const a = (which==='last'||which===''||which==null) ? list[list.length-1]
          : (list.find(x=>String(x.attempt)===String(which)) || list[list.length-1]);
  copyText(attemptCopyText(tk,a));
}
function attemptCopyText(tk,a){
  const meta=(state.tkMeta||{})[tk]||{};
  const sc=Number(a.score||0);
  const L=[];
  L.push('【造句批改】');
  L.push('单词：'+(meta.word||'—'));
  if(meta.task) L.push('题目：'+meta.task);
  L.push('第 '+(a.attempt||1)+' 次作答');
  L.push('我的句子：'+(a.sentence||''));
  L.push('得分：'+sc+'/100');
  L.push('判定：'+(a.ok?'✅ 正确':'❌ 有错误')+'（≥85 基本掌握，<85 需要改进）');
  if((a.errors||[]).length){
    (a.errors||[]).forEach((e,j)=>{
      L.push('错误'+(j+1)+' · 哪里错了：'+e.where);
      L.push('错误'+(j+1)+' · 类型：'+(e.type||'—'));
      L.push('错误'+(j+1)+' · 为什么错：'+e.explanation);
      L.push('错误'+(j+1)+' · 正确表达：'+e.correct);
    });
    if(a.corrected) L.push('整句正确写法：'+a.corrected);
  }else{
    L.push('哪里错了：没有明显错误');
  }
  if((a.task_issues||[]).length){
    (a.task_issues||[]).forEach((e,j)=>{
      L.push('题目要求'+(j+1)+' · 未完成：'+e.where);
      L.push('题目要求'+(j+1)+' · 说明：'+e.explanation);
    });
  }
  const _opts=(a.optimizations||[]).filter(o=>!_optDropped(o));
  if(_opts.length){
    L.push('参考建议：');
    _opts.forEach((o,j)=>{
      if(o&&o.kind==='expand'){
        L.push('● 扩写：'+(o.sample||'')+'（'+(o.note||'')+'）');
      }else if(o){
        L.push('● '+(o.suggestion||o.reason||'（见说明）')+(o.reason&&o.suggestion?' — '+o.reason:''));
      }
    });
  }else{
    L.push('参考建议：无');
  }
  return L.join('\n');
}
/* 学习页可折叠区：voc = 词汇卡体, sen = 造句区, copy = 今日词单面板。
   折叠只改 DOM 显示（不动已渲染的输入框/进度），并同步标题旁图标。 */
function foldToggle(key, id){
  state.folds=Object.assign({voc:true,sen:true,copy:false,listen:false,basic:true,upgrade:true,combo:true}, state.folds||{});
  state.folds[key]=!state.folds[key];
  const box=document.getElementById(id);
  if(box) box.style.display=state.folds[key]?'':'none';
  // 更新同卡标题里的图标（可能有多个 data-fold-for，逐个改，避免 id 冲突）
  document.querySelectorAll('[data-fold-for="'+id+'"]').forEach(g=>{
    g.textContent=state.folds[key]?'▽':'▷';});
}
/* 三类造句（基础/升级/组合）各自折叠：映射 key → 内容区 id */
const _CAT_BODY={basic:'basicBody', upgrade:'upBody', combo:'comboBody'};
function catFold(key){
  const bodyId=_CAT_BODY[key]; if(!bodyId) return;
  foldToggle(key, bodyId);
}
/* 单个句子折叠：点句头按钮，折叠该句的输入框+操作+历史区。
   用 DOM 局部状态（open/close），不持久化到 state.folds。 */
function senItemFold(el){
  const item=el.closest('.sitem'); if(!item) return;
  const body=item.querySelector('.sitem-body');
  const icon=item.querySelector('[data-senitem-ic]');
  if(!body) return;
  const closed=body.style.display==='none';
  body.style.display=closed?'':'none';
  if(icon) icon.textContent=closed?'▽':'▷';
}
/* 今日全部词（按今天的词序），用于"复制给 AI"。
   复习词 = review_pool 里的词（黄底标出）。 */
function todayWordNames(){
  const w=(state.today&&state.today.words)||[];
  return w.map(x=>x&&x.word).filter(Boolean);
}
function todayReviewSet(){
  const rp=(state.today&&state.today.review_pool)||[];

/* 课程地图缓存（启动时从 /api/curriculum 拉一次）。
   后端是权威源,前端不复制数据 —— 防止「UI 上是新地图、后端跑的是旧地图」。*/
let WEEK_CURRICULUM = [];
async function ensureCurriculum(force=false){
  if(!force && WEEK_CURRICULUM.length) return WEEK_CURRICULUM;
  try{
    const r = await api('/curriculum');
    WEEK_CURRICULUM = Array.isArray(r) ? r : [];
  }catch(_){ WEEK_CURRICULUM = []; }
  return WEEK_CURRICULUM;
}

/* 把「阶段 st + 周 wk」转成主题行；越界返回"机动周"。*/
function weekCurriculumOf(stage, week){
  const s=Number(stage)||0, w=Number(week)||1;
  const row = WEEK_CURRICULUM.find(r => r.stage===s && r.week===w);
  if (row) return row;
  return { stage:s, week:w, theme:`机动周${s+1}-${w}`, grammar:"按系统默认补强" };
}

    const ta=document.createElement('textarea');
    ta.value=txt; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,txt.length);
    let ok=false; try{ ok=document.execCommand('copy'); }catch(_){}
    ta.remove();
    toast(ok?'已复制 ✅ 可直接粘贴给 AI 追问':'复制失败，请长按选中文本手动复制');
    return ok;
  }
}

/* 闪卡记忆星级：星越多 = 这个词越难记住（每「没记住」一次点亮一颗） */
function memoryStarsHtml(n, showZero){
  const st=Math.max(0,Math.min(5,+n||0));
  if(st===0 && !showZero) return '';
  const tip = st===0 ? '还没忘记过，记住了！'
            : st>=4 ? `很难记住：已经忘了 ${st} 次，重点盯它`
                    : `记忆难度 ${st}/5：忘了 ${st} 次`;
  return `<div title="${tip}" style="font-size:13px;letter-spacing:2px;color:#f59e0b;line-height:1">`
       + '★'.repeat(st) + `<span style="color:#d1d5db">${'★'.repeat(5-st)}</span>`
       + `<span style="font-size:11px;color:var(--muted);letter-spacing:0;margin-left:6px">${tip}</span>`
       + `</div>`;
}

function renderFlashcard(el){
  const items=state.revItems||[];   // 用本次会话快照，不随实时到期队列变化

  if(state.revIdx>=items.length) return renderFlashDone(el);

  const c=items[state.revIdx], total=items.length;
  const flipped=!!state.revFlipped;
  // 成熟卡少量反向：中文 → 英文（主动提取），其余都是英文 → 中文（意义识别）
  const isZh2En=c.direction==='zh2en';

  const front = isZh2En
    ? `<div style="font-size:23px;font-weight:700;line-height:1.4">${esc(c.meaning||'（暂无释义）')}</div>

  // 翻面后的「怎么用」扩展区：固定搭配 + 例句（没有就不渲染）
  const _cols = c.collocations || [];
  const _exs  = c.examples     || [];
  const colsHtml = _cols.length ? `
    <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);
                text-align:left;width:100%">
      <div style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:5px">
        🔗 固定搭配（${_cols.length}）
      </div>
      ${_cols.map(co => `
        <div style="font-size:13.5px;line-height:1.55;padding:2px 0">

          <span style="color:var(--muted);font-size:12.5px">${co.meaning ? ' — ' + esc(co.meaning) : ''}</span>
        </div>
        ${co.example ? `<div style="font-size:12.5px;color:var(--muted);margin:1px 0 4px 8px;line-height:1.4">e.g. ${esc(co.example)}</div>` : ''}
      `).join('')}
    </div>` : '';

  const exsHtml = _exs.length ? `
    <div style="margin-top:10px;${_cols.length ? '' : 'padding-top:12px;border-top:1px dashed var(--border);'}
                text-align:left;width:100%">
      <div style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:5px">
        📝 例句（${_exs.length}）
      </div>
      ${_exs.map(ex => `
        <div style="font-size:13.5px;line-height:1.5;padding:2px 0">${esc(ex.sentence)}</div>
        ${ex.translation ? `<div style="font-size:12.5px;color:var(--muted);margin:0 0 4px 8px;line-height:1.4">${esc(ex.translation)}</div>` : ''}
      `).join('')}
    </div>` : '';

  const back = `
    ${isZh2En
      ? `<div style="font-size:31px;font-weight:800">${esc(c.word)}</div>
         ${c.phonetic?`<div class="sub" style="margin-top:5px">${esc(c.phonetic)}</div>`:''}`
      : `<div style="font-size:20px;font-weight:700;line-height:1.45">${esc(c.meaning||'（暂无释义）')}</div>
         ${c.pos?`<div class="sub" style="margin-top:5px">${esc(c.pos)}</div>`:''}`}
    ${colsHtml}
    ${exsHtml}
  `;

  el.innerHTML=`
    <div class="stickybar">
      <button class="topback" data-act="revExit">← 返回复习</button>
      <span style="font-weight:800;font-size:15.5px;flex:1;min-width:0">🗂 今日复习</span>

    </div>
    <div class="sub" style="margin-top:8px">${isZh2En?'中文 → 英文（主动提取）':'英文 → 中文（意义识别）'}</div>

    <div class="card" style="margin-top:12px;min-height:176px;display:flex;flex-direction:column;
         justify-content:center;align-items:center;text-align:center;cursor:pointer" data-act="revFlip">
      <div style="align-self:stretch;display:flex;justify-content:center;margin-bottom:8px">

    ${flipped

           <button class="btn" style="background:var(--red)" data-act="revGrade" data-val="0">😵 忘记</button>
           <button class="btn" style="background:var(--amber)" data-act="revGrade" data-val="3">🤔 模糊</button>
           <button class="btn green" data-act="revGrade" data-val="5">😎 记得</button>

async function gradeFlash(q){
  const c=(state.revItems||[])[state.revIdx];
  if(!c||state.revBusy) return;              // 重复提交保护：连点只记一次
  state.revBusy=true;
  const r=await api('/review/submit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:c.id,quality:q})});
  state.revBusy=false;
  if(!r||r.error){toast('提交失败，请重试');return;}
  state.revLog=state.revLog||[];
  state.revLog.push({word:c.word,mode:r.mode});
  // 记忆星级：后端返回最新值，同步到本地快照，下次翻到这张卡立刻显示
  let starTip='';
  if(r.memory_stars!==undefined){
    const before=c.memory_stars||0, after=r.memory_stars;
    c.memory_stars=after;
    if(after>before) starTip=` ⭐${after}/5 点亮一颗（忘了 ${after} 次）`;
    else if(after<before) starTip=` ⭐${after}/5 熄灭一颗，记得更牢了`;
  }
  toast((r.mode==='again'?'已记录：明天再见'
       :r.mode==='hard'?'已记录：缩短间隔，更快再见'
       :`已记录：${r.new_interval} 天后再见`)+starTip);
  state.revIdx++; state.revFlipped=false;
  pages.review(document.getElementById('content'));
}

function renderFlashDone(el){
  const log=state.revLog||[];
  const good=log.filter(x=>x.mode==='good').length;
  const hard=log.filter(x=>x.mode==='hard').length;
  const again=log.filter(x=>x.mode==='again').length;
  el.innerHTML=`
    <div class="stickybar">
      <button class="topback" data-act="revExit">← 返回复习</button>
      <span style="font-weight:800;font-size:15.5px;flex:1;min-width:0">✅ 今日复习完成</span>

const TEST_SECTION_ORDER=['听力','词汇','语法','阅读','主动输出'];
function cleanPassage(t){ return (t||'').replace(/<<<[^>]*>>>/g,'').replace(/\s+/g,' ').trim(); }
function renderTestPaper(p){
  if(!p||!p.sections||!p.sections.length) return '';
  const all=(p.questions||[]);

  });
  return `
  <div class="card" style="border:1.5px solid var(--amber)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">📃 ${esc(p.title||'试卷')}</h2>
      <span class="badge">${p.question_count||all.length} 题</span>
    </div>
    ${p.warnings&&p.warnings.length?`<div class="sub" style="margin-top:4px;color:var(--amber)">⚠️ ${esc(p.warnings.join('；'))}</div>`:''}
  </div>
  ${secs.map(sec=>`

function qStemHtml(q){

    <div style="font-size:13.5px;font-weight:700;margin-bottom:5px">${qStemHtml(q)}</div>

// 修正 / 增强后端周测·月测·阶段测提示词（均为前端复制前做文本修正，后端无需改动）：
// 1) 原提示词自相矛盾：一边要"客观题放进 <<<TEST>>>"，一边又"听力题不要放进这段标记里"，
//    导致 AI 在机器可读段把整个听力模块排除。修正为：听力题也要放进 <<<TEST>>>，
//    用 (choice)/(fill) 表示、题干标 [听力]，并在 <<<SECTION 听力>>> 内先用 <<<PASSAGE>>>
//    给出英文听力原文，系统会显示并提供🔊朗读（浏览器语音合成，无需音频文件）。
// 2) 模块顺序改为：听力 → 词汇 → 语法 → 阅读 → 主动输出（主动输出放最后）。
function fixTestPromptConflict(p){
  if(!p) return p;
  let s=p;
  // (1) 听力题放进机器可读段，并给出可朗读的原文
  s=s.replace(/听力题（需要听音频）不要放进这段标记里/g,
    '听力题（需要听音频）也要放进这段标记里：在「<<<SECTION 听力>>>` 内，先用一行 <<<PASSAGE>>> 给出听力原文（英文、要朗读的内容，如短句/对话/短文），再出 (choice)/(fill) 题，并在题干开头标注「[听力]」；系统会显示原文并提供🔊朗读按钮（浏览器语音合成，无需音频文件），答案照常给出，由学习者对照文本自评');
  // (2) 模块列表顺序调整（周测/月测通用）
  s=s.replace(/包含五个模块：\s*\n1\. 词汇\s*\n2\. 听力\s*\n3\. 语法\s*\n4\. 阅读\s*\n5\. 主动输出/g,
    '包含五个模块（请严格按此顺序出题与出卷）：\n1. 听力\n2. 词汇\n3. 语法\n4. 阅读\n5. 主动输出');
  // (3) 机器可读段各 SECTION 输出顺序强制
  s=s.replace(/9\. 语法模块的「判断\/改错、情境填空、句子转换、主动使用」都要按上面的 `\(judge\)` \/ `\(fill\)` 标记写进这段，方便自动判分或自评。/g,
    '9. 语法模块的「判断/改错、情境填空、句子转换、主动使用」都要按上面的 `(judge)` / `(fill)` 标记写进这段，方便自动判分或自评。\n10. 各 SECTION 输出顺序必须为：听力 → 词汇 → 语法 → 阅读 → 主动输出（主动输出放最后）。');
  return s;
}

/* 某阶段的真实周数：优先读 /stages 返回的 weeks（后端已按课程地图算好） */
function stageWeeks(stages, stage){
  if(Array.isArray(stages)){
    const s=stages[stage]||stages.find(x=>x.stage===stage);
    if(s&&s.weeks) return s.weeks;
  }
  return (state.stageWeeks&&state.stageWeeks[stage])||12;
}
function setDraft(k,v){
  state.progDraft[k]=v;
  if(k==='stage'){
    /* 切阶段：周数会变（阶段0/1=12，2/3=16，4/5=20），重画周网格并夹住越界的周 */
    const maxW=stageWeeks(state.stages,v);
    let w=state.progDraft.week||1;
    if(w>maxW){ w=maxW; state.progDraft.week=w; }
    const grid=document.getElementById('grid_week');
    if(grid){
      grid.innerHTML=Array.from({length:maxW},(_,i)=>
        `<button data-v="${i+1}" class="${i+1===w?'on':''}" onclick="setDraft('week',${i+1})">W${i+1}</button>`).join('');
      const lbl=grid.previousElementSibling;
      if(lbl&&lbl.tagName==='LABEL') lbl.textContent=`主题周 (1-${maxW})`;
    }
  }
  const segmap={stage:'seg_stage',week:'grid_week',day:'grid_day'};
  const box=document.getElementById(segmap[k]);
  if(box) box.querySelectorAll('button').forEach(b=>b.classList.toggle('on',+b.dataset.v===v));
  previewProg();
}

/* 后端返回的一项是否命中清单里的某条：先比 key，再比 label/别名 */
function _weakHit(it, def){
  if(!it) return false;
  const k=String(it.key||'').toLowerCase();
  const lb=String(it.label||'');
  if(k && def.key && k===String(def.key).toLowerCase()) return true;
  if(lb && lb===def.label) return true;
  return (def.alias||[]).some(a=>{
    const A=String(a).toLowerCase();
    return (k&&k.indexOf(A)>=0) || (lb&&lb.toLowerCase().indexOf(A)>=0);
  });
}
/* ---------- 薄弱项趋势 ----------
   后端只给「近30天累计次数」，没有按天的时间序列，所以趋势靠本地每日快照比：
   今天之前最后一次快照 vs 当前值 → 改善 / 恶化 / 稳定 / 新出现。
   基线不足（刚用第一天）就老实显示「待观察」，绝不凭一次数据编趋势。 */
const WSNAP_KEY='eos_weak_snap_v1';
function _todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _wsnapLoad(){
  try{ const v=JSON.parse(localStorage.getItem(WSNAP_KEY)||'[]'); return Array.isArray(v)?v:[]; }
  catch(e){ return []; }
}
/* 每天只保留一份快照（同一天重复打开覆盖为最新值），基线永远取「今天之前」那份。
   最多留 60 天，超出丢弃最旧的。 */
function weakSnapshot(map){
  if(!map) return;
  const today=_todayStr();
  let all=_wsnapLoad().filter(s=>s&&s.d&&s.d!==today);
  all.push({d:today, map:map});
  while(all.length>60) all.shift();
  try{ localStorage.setItem(WSNAP_KEY, JSON.stringify(all)); }catch(e){}
}
/* 错误类型 → 能力大类：后端只给「拼写 / 句型」这类粗标签，只能按关键词归类。
   拼写不进薄弱项（属单词没记住，交给闪卡），这里单独挑出来跳过。 */
const ERR_CAP_MAP=[
  [/拼写|拼错|spell/i,'_spell'],
  [/时态|三单|单复数|冠词|介词|词性|grammar|tense/i,'grammar'],
  [/句型|语序|句子结构|structure|word order/i,'structure'],
  [/表达|搭配|单调|单一|expression|colloc/i,'expression'],
  [/听|listen/i,'listening'],
  [/阅读|主旨|推断|read/i,'reading']
];
function _errCapOf(type){
  const t=String(type||'');
  for(const [re,cap] of ERR_CAP_MAP){ if(re.test(t)) return cap; }
  return '_other';
}
/* 兜底：没有跨天快照时，用「近7天 vs 前23天」的错误时间分布推算趋势。
   只对能归到该大类的错误计数；细分小类没有独立时间戳，沿用所属大类的切片。 */
function weakSliceTrend(catKey){
  const errs=state.errs||[];
  if(!errs.length) return null;
  const now=Date.now(), DAY=86400000;
  let r7=0, p23=0;
  errs.forEach(e=>{
    if(_errCapOf(e.type)!==catKey) return;
    (e.recent||[]).forEach(r=>{
      const t=Date.parse(r.created_at||'');
      if(isNaN(t)) return;
      const age=(now-t)/DAY;
      if(age<=7) r7++;
      else if(age<=30) p23++;
    });
  });
  if(r7===0 && p23===0) return null;
  if(p23===0) return {code:'new', label:'新出现', cls:'tr-new'};
  if(r7<p23) return {code:'improve', label:'改善', cls:'tr-improve'};
  if(r7>p23) return {code:'worsen', label:'恶化', cls:'tr-worsen'};
  return {code:'flat', label:'稳定', cls:'tr-flat'};
}
/* 首选：跨天快照对比（最可靠）；没有基线才回落到时间切片；都没有就老实说「待观察」 */
function weakTrend(catKey, itemKey, cur){
  const k = itemKey ? (catKey+'|'+String(itemKey)) : ('@'+catKey);
  const curN=Number(cur||0);
  const all=_wsnapLoad(), today=_todayStr();
  let base=null;
  for(let i=all.length-1;i>=0;i--){ if(all[i].d!==today && all[i].map){ base=all[i]; break; } }
  if(base){
    const prev=base.map[k];
    if(prev==null || Number(prev)===0)
      return curN>0 ? {code:'new', label:'新出现', cls:'tr-new'} : {code:'flat', label:'稳定', cls:'tr-flat'};
    if(curN<Number(prev)) return {code:'improve', label:'改善', cls:'tr-improve'};
    if(curN>Number(prev)) return {code:'worsen', label:'恶化', cls:'tr-worsen'};
    return {code:'flat', label:'稳定', cls:'tr-flat'};
  }
  return weakSliceTrend(catKey) || {code:'unknown', label:'待观察', cls:'tr-unknown'};
}
function _trendIcon(c){
  return c==='improve'?'📉':c==='worsen'?'📈':c==='new'?'🆕':c==='flat'?'➖':'⏳';
}
function _isoWeek(dstr){
  const p=String(dstr).split('-'); if(p.length<3) return '?';
  const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  const day=(d.getUTCDay()+6)%7; d.setUTCDate(d.getUTCDate()-day+3);
  const first=new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const wk=1+Math.round(((d-first)/86400000-3+((first.getUTCDay()+6)%7))/7);
  return d.getUTCFullYear()+'-W'+String(wk).padStart(2,'0');
}
/* 本周/上周/趋势%/连续周：基于本地每日快照按 ISO 周聚合。
   首次使用（只有今天一份快照）时上周=0，显示「首次记录」，不编造历史。 */
function weakWeekStat(catKey, itemKey, liveCount){
  const k=itemKey?(catKey+'|'+String(itemKey)):('@'+catKey);
  const all=_wsnapLoad().filter(s=>s&&s.d&&s.map&&s.map[k]!=null);
  const byWeek={};
  all.forEach(s=>{ const w=_isoWeek(s.d); const v=Number(s.map[k])||0; if(!byWeek[w]||s.d>byWeek[w].d) byWeek[w]={d:s.d,v}; });
  const weeks=Object.keys(byWeek).sort();
  const curW=_isoWeek(_todayStr());
  const thisWeek = byWeek[curW]?byWeek[curW].v:(liveCount!=null?Number(liveCount):0);
  let lastWeek=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i]<curW){ lastWeek=byWeek[weeks[i]].v; break; } }
  let consec=0;
  for(let i=weeks.length-1;i>=0;i--){ if(weeks[i]>curW) continue; if(byWeek[weeks[i]].v>0) consec++; else break; }
  let status, pct=null;
  if(lastWeek===0){ status = thisWeek>0?{code:'new',label:'新出现'}:{code:'flat',label:'稳定'}; }
  else { pct=Math.round((thisWeek-lastWeek)/lastWeek*100);
    status = pct<0?{code:'improve',label:'改善中'}:pct>0?{code:'worsen',label:'恶化中'}:{code:'flat',label:'稳定'}; }
  return {thisWeek, lastWeek, pct, status, consec, series:weeks.map(w=>byWeek[w].v)};
}
/* 严重度：这个问题到底需不需要改学习计划？
   🔴 阻塞项=必须调整学习（高频）；🟡 薄弱项=需要针对训练；🔵 记忆项=闪卡解决，不改课程。 */
function weakSeverity(catKey, itemKey, count){
  const n=Number(count||0);
  if(n===0) return {code:'none', icon:'✅', label:'暂无数据', note:''};
  const ks=String(catKey||'').toLowerCase()+' '+String(itemKey||'').toLowerCase();
  if(/spell|拼写|记|闪卡|单词/.test(ks)) return {code:'mem', icon:'🔵', label:'记忆项', note:'闪卡解决，不改课程'};
  if(n>=8) return {code:'block', icon:'🔴', label:'阻塞项', note:'必须调整学习计划'};
  return {code:'weak', icon:'🟡', label:'薄弱项', note:'需要针对训练'};
}
/* 下周学习调整：只给 AI 输出的「格式示例」，不预填数值（避免带偏 AI） */
function weakAdjustFormatExample(){
  return [

    '保持：正常词汇进度',
    '不调整：拼写训练（🔵记忆项，交闪卡，不改课程）'
  ].join('\n');

/* 趋势折线图：用本地快照按周聚合的 30天错误数画；不足 2 周显示积累提示 */
function weakTrendChart(catKey, itemKey){
  const ws=weakWeekStat(catKey, itemKey, null);
  const pts=ws.series||[];
  if(pts.length<2) return `<div class="wkline" style="color:var(--muted);margin-top:3px">📈 趋势图需 ≥2 周数据才成图（已记录 ${pts.length} 周；本周 vs 上周起才有折线）。已为你预置数周，立即可见 ↓</div>`;
  const W=250,H=66,pad=8;
  const max=Math.max.apply(null,pts), min=Math.min.apply(null,pts), span=(max-min)||1;
  const X=i=>pad+i*((W-2*pad)/(pts.length-1));
  const Y=v=>H-pad-((v-min)/span)*(H-2*pad);
  let path=''; pts.forEach((v,i)=>{ path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; });
  const dots=pts.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.3" style="fill:#2563eb"/>`).join('');
  const up=pts[pts.length-1]>pts[0], down=pts[pts.length-1]<pts[0];
  const col=up?'#dc2626':down?'#16a34a':'#64748b';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="margin-top:5px;display:block">
    <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" style="stroke:#eef2f7;stroke-width:1"/>
    <path d="${path}" style="fill:none;stroke:${col};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>
    ${dots}
  </svg>
  <div class="wkline" style="font-size:11px;margin-top:1px">📈 各周30天错误数：${pts.join(' → ')}　${up?'↑ 增多':down?'↓ 减少':'→ 持平'}</div>`;
}

/* 填空输入框：手写，不再给选项（答案不再摆在下面）。
   ans 为 null 表示这份材料没给该空的参考答案 → 标记为「不计分」，不当错判 */
function gapInput(idx, ans){
  const has = (ans!==null && ans!==undefined && String(ans).trim()!=='');
  return `<input class="gapin${has?'':' noans'}" type="text" autocomplete="off" autocapitalize="off"
    autocorrect="off" spellcheck="false" data-idx="${idx}" data-ans="${esc(has?ans:'')}"
    ${has?'':'data-noans="1"'} placeholder="${has?'?':'无答案'}" aria-label="第 ${idx+1} 空" />`;
}
/* 对话行：保留 A: / B: 前缀（A 蓝、B 绿），行首带朗读按钮 */
function dlgLine(who, inner, speakText){
  const meta = who==='A' ? {c:'var(--primary)',bg:'var(--primary-bg)'}
             : who==='B' ? {c:'#047857',bg:'#ecfdf5'} : null;
  const tag = who ? `<span style="display:inline-block;font-weight:800;font-size:12.5px;color:${meta.c};background:${meta.bg};border-radius:6px;padding:1px 6px;margin-right:6px">${who}:</span>` : '';
  const spk = speakText ? `<button class="btn ghost sm" data-act="paSpeak" data-val="${esc(speakText)}" style="flex-shrink:0;margin-top:1px">🔊</button>` : '';
  return `<div style="display:flex;align-items:flex-start;gap:6px;margin:8px 0">${spk}
      <div style="flex:1;font-size:14px;line-height:2.1">${tag}${inner}</div></div>`;
}
function partBHtml(hasDlg, mat, words){
  // 有导入对话：整段按 A:/B: 逐行显示，空处给输入框手写填空（不给选项、不提前泄答案）
  if(hasDlg&&mat&&mat.dialogue&&mat.dialogue.length){
    const blanks=(mat.blanks||[]).map(b=>b.word).filter(Boolean);
    if(blanks.length){
      // 后端常把整段对话塞进一个字符串（"A: … B: … A: …"），先按 A:/B: 拆成一行一句
      const lines=[];
      mat.dialogue.forEach(chunk=>{
        String(chunk==null?'':chunk).split(/\r?\n/).forEach(seg=>{
          String(seg).split(/(?=\s[AB]:\s)/).forEach(s=>{
            const t=String(s).trim(); if(t) lines.push(t);
          });
        });
      });
      const allBlanks=lines.reduce((n,l)=>n+((String(l).match(/_{3,}/g)||[]).length),0);
      const short=Math.max(0, allBlanks-blanks.length);   // 材料没给答案的空数
      let bi=0;
      const rows=lines.map(line=>{
        const m=line.match(/^\s*([AB])\s*[:：]\s*([\s\S]*)$/i);
        const who=m?m[1].toUpperCase():'';
        const body=m?m[2]:line;
        const segs=body.split(/_{3,}/);
        if(segs.length<2) return dlgLine(who, esc(body), '');
        let inner='', full=body;
        for(let k=0;k<segs.length;k++){
          inner+=esc(segs[k]);
          if(k<segs.length-1){
            const ans=(blanks[bi]!==undefined)?blanks[bi]:'';
            if(ans){ inner+=gapInput(bi, ans); full=full.replace(/_{3,}/, ans); }
            else{   // 材料本身缺答案：摆明了告诉你，别让你填了还被判错
              inner+=`<span class="gapna" title="这份材料没给出这个空的标准答案">______</span>`;
              full=full.replace(/_{3,}/, 'blank');
            }
            bi++;
          }
        }
        return dlgLine(who, inner, full);
      }).join('');
      state._tot.B=Math.min(bi, blanks.length);
      if(!state._tot.B) return '<div class="sub">对话里没找到可挖的空（需要在句中用 ______ 标记）。</div>';
      return (short?`<div class="warnbox">⚠️ 这份材料有 <b>${short}</b> 个空没给标准答案（多半是导入时被截断），这些空不参与批改。想补全的话，重新导入一次完整对话即可。</div>`:'')
        + `<div class="dlgbox">${rows}</div>`+gapUI('B','','B');
    }
  }
  // 兜底：从今日词抽 3 词，听句子手写缺的词
  const pick=(words||[]).slice(0,3);
  state._tot.B=pick.length;
  if(!pick.length) return '<div class="sub">今天没有词可兜底，先导入对话或去学习页学词。</div>';
  const items=pick.map((w,i)=>`<div style="margin:10px 0">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
      <span style="flex:1;font-size:13px;font-weight:700">第 ${i+1} 句 · 听句子，写出缺的词</span>
      <button class="btn ghost sm" data-act="paSpeak" data-val="${esc('We need to '+w+' today.')}">🔊</button>
    </div>
    <div style="font-size:14px;line-height:2.1">We need to ${gapInput(i,w)} today.</div></div>`).join('');
  return `<div class="dlgbox">${items}</div>`+gapUI('B','','B');
}
/* 从 AI 生成的听力材料文本里挖出 Q1/Q2 的选择题（后端不解析选项，前端自己挖）。
   返回 [{question, options:[...], answer:'B'}]。存成本地题库 map（按题干文本），跨天/跨次导入累积。 */
function parsePassageQuestions(text){
  if(!text) return [];
  const out=[];
  const re=/<<<Q\d+>>>([\s\S]*?)(?=<<<|$)/gi;
  let m;
  while((m=re.exec(String(text)))){
    const body=m[1];
    const qm=body.match(/Question\s*[:：]?\s*(.+)/i);
    if(!qm) continue;
    const question=qm[1].trim();
    const opts=[];
    const ol=/^\s*([A-Da-d])[.．、:：]\s*(.+)$/gm;
    let om;
    while((om=ol.exec(body))){ opts.push(om[2].trim()); }
    const am=body.match(/Answer\s*[:：]?\s*([A-Da-d])/i);
    const answer=am?am[1].toUpperCase():'';
    if(opts.length>=2) out.push({question, options:opts, answer});
  }
  return out;
}
function saveQBank(text){
  const arr=parsePassageQuestions(text);
  if(!arr.length) return;
  let map={};
  try{ map=JSON.parse(localStorage.getItem('eos_qbank_map')||'{}'); }catch(e){ map={}; }
  arr.forEach(q=>{ if(q.question) map[q.question]=q; });
  localStorage.setItem('eos_qbank_map', JSON.stringify(map));
}
/* 自动从短文里挖一个词，配今日词做干扰项，生成一道选择题（不依赖材料是否带选项）。
   offset 用于同一篇短文出多题时取不同词，保证稳定可复现。 */
function autoChoiceFromPassage(passage, words, offset){
  const tokens=(passage||'').match(/[A-Za-z']{3,}/g)||[];
  const seen=new Set(), cands=[];
  for(const t of tokens){ const w=t.toLowerCase().replace(/'$/,''); if(seen.has(w))continue; seen.add(w); if(/^[a-z]/.test(w)) cands.push(t.replace(/'$/,'')); }
  if(cands.length<1) return null;
  const ans=cands[offset%cands.length];
  const al=ans.toLowerCase();
  const pool=(words||[]).map(x=>String(x).trim()).filter(x=>x && x.toLowerCase()!==al && x.length>=3);
  const uniq=[...new Set(pool)];
  for(let i=uniq.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[uniq[i],uniq[j]]=[uniq[j],uniq[i]];}
  const dist=uniq.slice(0,3);
  if(dist.length<3) return null;
  const opts=[ans,...dist];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return {question:'听 / 读短文，选出短文中实际出现过的那个词：', options:opts, answer:ans};
}

function partCHtml(hasPass, mat){
  if(!hasPass||!mat||!mat.passage||!mat.questions||!mat.questions.length){
    return '<div class="sub">导入含 <<<PASSAGE>>> 的材料后，这里会出现短文选择题。</div>';
  }
  const qs=mat.questions.slice(0,2);
  state._tot.C=qs.length;
  const bank=state._qbankMap||{};
  const words=(state.today&&state.today.words)||[];
  const qHtml=qs.map((q,i)=>{
    let choice=null;
    const c=bank[q.question];
    // 优先用导入时挖到的选项（理解题）；没有就自动从短文挖词生成选择题
    if(c&&c.options&&c.options.length>=2) choice={question:q.question, options:c.options, answer:c.answer};
    else { const ac=autoChoiceFromPassage(mat.passage, words, i); if(ac) choice={question:ac.question, options:ac.options, answer:ac.answer}; }
    if(choice){
      // answer 可能是字母（题库）或单词（自动挖词），统一归一为正确选项文本
      let ansWord = choice.options.includes(choice.answer) ? choice.answer
        : (()=>{ const idx=['A','B','C','D'].indexOf(String(choice.answer||'A').toUpperCase()); return choice.options[idx]||choice.options[0]; })();
      return `<div style="margin-top:8px;padding-top:7px;border-top:1px dashed var(--border)">
        <div style="font-size:13px;font-weight:700;margin-bottom:4px">${esc(choice.question||'')}</div>
        ${choice.options.map(o=>optRow(o,ansWord)).join('')}</div>`;
    }
    // 极端兜底：短文无可挖词 → 开放自答（基本走不到）
    const qid=(q.id!=null)?q.id:(i+1);
    return `<div class="openq" data-qid="${qid}" style="margin-top:8px;padding-top:7px;border-top:1px dashed var(--border)">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">${esc(q.question||'')}</div>
      <input type="text" class="openin" placeholder="用英文写下你的答案…" style="width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid var(--border);border-radius:7px;font-size:13px;margin-top:4px" />
      <div class="btnrow" style="margin-top:6px">
        <button class="btn green sm" data-act="openTap" data-ok="1">✅ 我听懂了</button>
        <button class="btn ghost sm" data-act="openTap" data-ok="0">❌ 没听懂</button>
      </div>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:6px"><button class="btn ghost sm" data-act="paSpeak" data-val="${esc(mat.passage)}">🔊 播放短文</button>
    <div style="font-size:12px;color:var(--muted);margin-top:3px">听对话、读短文后，选出正确答案（选择题）：</div>
    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;margin-top:4px">${esc(mat.passage)}</div></div>`
    + gapUI('C', qHtml, 'C');
}

/* Part C 开放式自测：用户听完用英文自答后，点按钮自评「听懂/没听懂」。
   正确项会插入一个 .picked.ok 标记，让 partSubmit 正常计入。 */
function openTap(el){
  const q=el.closest('.openq'); if(!q) return;
  if(q.dataset.done) return;
  q.dataset.done='1';
  const ok=el.getAttribute('data-ok')==='1';
  q.querySelectorAll('[data-act=openTap]').forEach(b=>{ b.disabled=true; });
  const marker=document.createElement('span');
  marker.className='picked '+(ok?'ok':'no');
  marker.style.display='none';
  q.appendChild(marker);
  const flag=document.createElement('span');
  flag.style.fontSize='12px'; flag.style.fontWeight='700'; flag.style.marginLeft='8px';
  flag.style.color=ok?'var(--green)':'var(--red)';
  flag.textContent=ok?'已记为听懂':'已记为未听懂';
  q.querySelector('.btnrow').appendChild(flag);
  const live=document.getElementById('live_C');
  if(live){
    const done=q.parentNode.querySelectorAll('.openq[data-done]').length;
    live.textContent=`已答 ${done} / ${state._tot.C}`;
  }
  toast(ok?'✅ 已记为听懂':'❌ 已记为未听懂');
}

/* Part A/B/C 提交：统计该部分容器里用户「已答对」(.picked.ok) 的题目数 */
async function partSubmit(part){
  const btn=document.querySelector(`[data-act=partSubmit][data-part=${part}]`);
  const card=btn?btn.closest('.card'):null;
  let correct=0;
  if(card){
    if(part==='B'){
      // 填空：逐空比对（忽略大小写 / 首尾空格 / 句末标点）
      const ins=card.querySelectorAll('input.gapin');
      ins.forEach(inp=>{
        const ans=normGap(inp.getAttribute('data-ans'));
        const val=normGap(inp.value);
        const ok=!!val && val===ans;
        inp.readOnly=true;
        inp.classList.add(ok?'ok':'no');
        if(ok){ correct++; }
        else{ inp.value=''; inp.placeholder=inp.getAttribute('data-ans')||'?'; inp.classList.add('showans'); }
      });
      state._tot.B=ins.length||1;
    } else {
      card.querySelectorAll('.picked.ok').forEach(()=>correct++);
    }
  }
  const total=Math.max(state._tot[part]||1,1);
  const cur=state.lp||{stage:0,week:1,day:1};
  if(btn){btn.disabled=true;btn.textContent='已记录';}
  await api('/listening/answer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({stage:cur.stage,week:cur.week,day:cur.day,part:part,correct:correct,total:total})});
  toast(`Part ${part}：答对 ${correct}/${total}，已记录${correct<total?'（空的正确词已填出）':''}`);
  // 留 2.6 秒看对错；若用户已切到别的页，就不要强行把他们拽回听力页
  setTimeout(()=>{
    const onListen=document.querySelector('.bottomnav a[data-page=listen]');
    if(onListen && onListen.classList.contains('active')) pages.listen(document.getElementById('content'));
  },2600);
}
function normGap(s){
  return String(s==null?'':s).trim().toLowerCase()
    .replace(/[.!?,;:'"“”‘’]/g,'').replace(/\s+/g,' ');
}

/* 点选项：一次作答，锁定本题。选对=绿(ok)，选错=红(no)且把正确项也标绿。partSubmit 统计 .chosen.ok */
function optTap(el){
  if(el.classList.contains('picked')) return;      // 本题已作答
  const word=el.getAttribute('data-word');
  const opt=el.getAttribute('data-opt');
  const q=el.parentNode;
  const isCorrect=String(opt).toLowerCase()===String(word||'').toLowerCase();
  // 用户本次选择标绿/红并记为 picked（本题锁定）
  el.classList.add('picked');
  el.classList.add(isCorrect?'ok':'no');
  if(!isCorrect){
    // 答错：把正确项也标绿提示
    q.querySelectorAll('[data-opt]').forEach(b=>{
      if(String(b.getAttribute('data-opt')).toLowerCase()===String(word||'').toLowerCase()) b.classList.add('ok');
    });
    toast('❌ 答错');
  } else {
    toast('✅ 对');
  }
}
function tSubOk(el){
  const no=el.getAttribute('data-no');
  const ok=el.getAttribute('data-ok')==='1';
  state.testAnswers=state.testAnswers||{};
  state.testAnswers[no]=ok?'1':'0';
  const wrap=el.closest('[data-q]');
  if(wrap){ wrap.querySelectorAll('[data-act=tSubOk]').forEach(b=>b.disabled=true);
    toast(ok?'✅ 已自评：完成':'❌ 已自评：还需练习'); }
}

/* 近音干扰 */
function _shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const _A_NEAR={receive:['receive','rehearse','relieve','review'],customer:['customer','custom','costume','compute'],deliver:['deliver','developer','driver','liver'],invoice:['invoice','noise','voice','choice'],meeting:['meeting','meaning','eating','greeting'],order:['order','older','border','other'],check:['check','chalk','cheek','cheat'],report:['report','resort','support','repute']};
function _nearOptions(word){
  const w=String(word||'').toLowerCase();
  const base=_A_NEAR[w]||[word,'reason','recent','repeat'];
  const pool=base.concat(_A_NEAR.receive,_A_NEAR.meeting,_A_NEAR.check);
  const opts=[word];
  for(const x of pool){ if(String(x).toLowerCase()!==w&&opts.length<4&&!opts.includes(x)) opts.push(x); }
  while(opts.length<4){ opts.push('answer'+(opts.length+1)); }
  return _shuf(opts.slice(0,4));
}

/* 带涨跌箭头的指标：cur=本周, prev=上周, unit=单位, lowerIsBetter=错误率类（越低越好） */
function _anaTrend(label, cur, prev, unit, lowerIsBetter){
  if(cur==null||prev==null) return _anaMetric(label, cur!=null?cur+unit:'—', prev!=null?('上周 '+prev+unit):'');
  const diff=Number(cur)-Number(prev);
  const pct=prev!=0?Math.round(diff/Math.abs(Number(prev))*100):0;
  const isGood=lowerIsBetter?(diff<0):(diff>0);
  const color=isGood?'var(--green)':'var(--red)';
  const arrow=diff>0?'↑':diff<0?'↓':'→';
  const sign=diff>0?'+':'';
  return `<div class="metric"><span>${label}</span><b>${cur}${unit} <span style="color:${color};font-weight:800">${arrow} ${sign}${pct}%</span> <small style="font-weight:400;color:var(--muted)">上周 ${prev}${unit}</small></b></div>`;
}
/* 迷你折线图：arr=[{label,v}]，lowerIsBetter=错误率类 */
function _anaMiniLine(arr,title,lowerIsBetter){
  if(!arr||!arr.length) return '';
  const W=280,H=70,P=10;
  const vals=arr.map(x=>x.v);
  const maxv=Math.max(...vals,1), minv=Math.min(...vals,0);
  const range=maxv-minv||1;
  const xc=i=>P+(W-2*P)*(arr.length===1?0.5:i/(arr.length-1));
  const yc=v=>H-P-(H-2*P)*((v-minv)/range);
  let d=''; let pen=false;
  arr.forEach((x,i)=>{ const px=xc(i), py=yc(x.v); d+=(pen?'L':'M')+px.toFixed(1)+' '+py.toFixed(1)+' '; pen=true; });
  const dots=arr.map((x,i)=>`<circle cx="${xc(i).toFixed(1)}" cy="${yc(x.v).toFixed(1)}" r="3" fill="${lowerIsBetter?'var(--red)':'var(--primary)'}"/>`).join('');

function _sumPeriod(){

  const f=x=>x.getFullYear()+'-'+('0'+(x.getMonth()+1)).slice(-2)+'-'+('0'+x.getDate()).slice(-2);
  const y=dt.getFullYear(), m=dt.getMonth()+1, md=('0'+m).slice(-2), last=new Date(y,m,0).getDate();

function _recentActivityHtml(acts){
  const d = acts || [];
  if(!d.length) return `<div class="card" style="margin-top:10px"><h2>🕐 最近活动</h2><div class="sub">还没有学习活动记录。去「学习 / 听力 / 复习 / 测评」做几道题，这里就会出现真实的练习记录。</div></div>`;
  const byType={}; d.forEach(x=>{ byType[x.type]=(byType[x.type]||[]); byType[x.type].push(x); });
  const rows=Object.entries(byType).map(([t,list])=>{
    const last=list[list.length-1];
    let extra='';
    if(t==='测评'){ const avg=Math.round(list.reduce((s,x)=>s+(x.score||0),0)/list.length); extra=`均分 ${avg}`; }
    else if(t==='听力'&&last.score!=null){ extra=`正确率 ${last.score}%`; }
    else if(t==='造句'){ const rate=Math.round(list.filter(x=>x.ok).length/list.length*100); extra=`正确率 ${rate}%`; }
    return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span><b>${t}</b> ${list.length} 条</span><span style="color:var(--muted)">最近 ${last.date}${extra?(' · '+extra):''}</span></div>`;
  }).join('');
  return `<div class="card" style="margin-top:10px"><h2>🕐 最近活动</h2><div class="sub">按模块分组，显示最近记录数和表现（数据来自后端真实记录）。</div>${rows}</div>`;
}
/* 生成可复制的纯文本总结（周报/月报共用） */
function _buildSumText(kind, period, errTypes, confirmed, byDay, totalErr, monthSummary){
  const L=['【English OS 学习总结 · '+kind+'】','周期：'+(kind==='月报'?period.month:period.week),'生成时间：'+new Date().toLocaleString(),''];
  L.push('—— 错误概览（仅事实，不代表能力薄弱）——');
  if(errTypes.length){
    errTypes.forEach(e=>L.push(`· ${e.type}（${e.level||''}）：近30天 ${e.count_30d||0} 次，累计 ${e.total||0}`));
  } else L.push('· 本周暂无错误记录');
  L.push('','—— 错误按日分布 ——');
  const keys=Object.keys(byDay).sort();
  L.push(keys.length?keys.map(d=>`· ${d.slice(5)}：${byDay[d]} 次`).join('\n'):'· 暂无按日错误记录');
  L.push('','—— 需要注意（只读已确认薄弱项）——');
  L.push(confirmed.length?confirmed.map(e=>`· ${e.type}（${e.level||''} · 已确认）`).join('\n'):'· 本周暂无已确认的重点薄弱项');
  if(kind==='月报'){ L.push('','—— 本月总结 ——', monthSummary); }
  L.push('','（学习天数 / 新学词汇 / 计划完成率等需后端统计接口；当前未提供，按“不编造”原则未显示。）');
  return L.join('\n');
}
